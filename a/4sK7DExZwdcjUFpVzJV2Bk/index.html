/*
VOICE: робочий інструмент, як Access, але спокійніший і зрозуміліший для 9 класу.
IDEA: настільна СКБД — заголовок вікна, стрічка інструментів, область переходів, вкладки об'єктів.
PICTURE: сама робоча область (таблиця, схема даних, бланк запиту) — вона і є головне зображення.
COLOUR and TYPE: малиновий Access #a4262c як домінанта, теплий світлий ґрунт, Golos Text, JetBrains Mono для SQL.
LAYOUT: шапка + стрічка зверху, ліворуч область переходів, праворуч вкладки та подання; на телефоні — стовпчиком.
*/
:root{color-scheme:light dark;--bg:light-dark(#f2efea,#151619);--panel:light-dark(#ffffff,#1f2024);--panel2:light-dark(#f8f6f2,#26272c);--ink:light-dark(#1c1b1a,#ecebe8);--mut:light-dark(#6a655d,#a7a39c);--line:light-dark(#ddd8cf,#36373d);--acc:#a4262c;--accd:light-dark(#8a1d23,#e0666b);--acc2:light-dark(#fbeaea,#3a2124);--ok:light-dark(#1b7a45,#63d394);--okb:light-dark(#e6f4ec,#1d3326);--bad:light-dark(#b42318,#ff8f85);--badb:light-dark(#fdecea,#3b1f1d);--sel:light-dark(#fff3cf,#3d3520);--key:#c98a00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
header.top{background:var(--acc);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:400;opacity:.8;font-size:13px}
.dbname{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 9px;color:#fff;width:min(260px,40vw)}
.savest{font-size:12.5px;opacity:.85;margin-inline-start:auto}
.topbtn{background:#fff;color:var(--acc);border:0;border-radius:6px;padding:7px 12px;font-weight:600;display:flex;gap:6px;align-items:center;min-height:36px}
#navToggle{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;min-height:36px;padding:0 10px}
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 8px}
.rg{display:flex;flex-direction:column;border-inline-end:1px solid var(--line);padding:0 8px;flex:none}
.rg:last-child{border:0}
.rgb{display:flex;gap:2px}
.rgt{font-size:11.5px;color:var(--mut);text-align:center;margin-top:2px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 8px;font-size:12.5px;min-width:64px;max-width:96px;line-height:1.15;text-align:center}
.rb svg.i{width:24px;height:24px;color:var(--acc)}
.rb:hover{background:var(--acc2);border-color:var(--line)}
.main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
nav#nav{background:var(--panel);border-inline-end:1px solid var(--line);overflow:auto;padding:8px 0}
.navh{font-size:12px;color:var(--mut);padding:2px 12px 6px;display:flex;justify-content:space-between}
.ng{margin-bottom:6px}
.ngh{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:6px 12px;color:var(--accd);border-bottom:1px solid var(--line)}
.ngh span{margin-inline-start:auto;color:var(--mut);font-weight:400}
.ni{display:flex;align-items:center}
.ni.on{background:var(--acc2)}
.nib{flex:1;text-align:start;background:none;border:0;padding:7px 12px 7px 28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:34px}
.nim{background:none;border:0;width:34px;min-height:34px;color:var(--mut);font-size:16px}
.nim:hover,.nib:hover{color:var(--acc)}
.nempty{padding:4px 28px;color:var(--mut);font-size:13px;font-style:italic}
.work{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--bg);padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-bottom:0;background:var(--panel2);border-radius:7px 7px 0 0;padding:6px 6px 6px 10px;white-space:nowrap;font-size:13.5px;flex:none}
.tab.on{background:var(--panel);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
.tab .x{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;color:var(--mut)}
.tab .x:hover{background:var(--acc2);color:var(--acc)}
#view{background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
#view>*{flex:none}#view>.sheetwrap,#view>.fstage,#view>.fsplit{flex:1 0 auto}
.vt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;min-height:34px;font-size:13.5px}
.seg button.on{background:var(--acc);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;min-height:34px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--accd);color:#fff}
.btn.sm{min-height:28px;padding:3px 8px;font-size:12.5px}
.btn.wide{width:100%;justify-content:flex-start;min-height:42px}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;min-height:34px;font-size:14px}
.sp{flex:1}
.cnt{font-size:13px;color:var(--mut)}
.hint{margin:10px 12px 0;padding:9px 12px;border-radius:8px;background:var(--acc2);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.hint svg.i{color:var(--acc);margin-top:1px}
.hint b{color:var(--accd)}
.pad{padding:12px}
/* datasheet */
.sheetwrap{overflow:auto;padding:12px;flex:1}
table.sheet{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
.sheet th,.sheet td{border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.sheet thead th{position:sticky;top:0;background:var(--panel2);font-weight:600;text-align:start;padding:7px 10px;z-index:2;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.sheet thead th:first-child,.sheet td.rs{border-inline-start:1px solid var(--line)}
.sheet thead th .k{color:var(--key)}
.sheet td.rs{width:30px;min-width:30px;text-align:center;color:var(--mut);background:var(--panel2);cursor:pointer;font-size:12px}
.sheet tr.selr td{background:var(--sel)}
.sheet tr.warn td.rs{background:var(--badb);color:var(--bad)}
.sheet tr.newr td{background:var(--panel2)}
.ci{border:0;background:transparent;padding:7px 10px;width:100%;min-width:110px;min-height:34px;font-size:14px}
.ci.num{text-align:end}
.ci.ro{color:var(--mut)}
.ci:focus{background:var(--panel);outline:2px solid var(--acc);outline-offset:-2px}
.cb{width:18px;height:18px;margin:8px 14px;accent-color:var(--acc)}
.sheet td.v{padding:7px 10px}
.sheet td.n{text-align:end}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
/* design grid */
table.dg{border-collapse:collapse;width:100%;max-width:980px}
.dg th{font-size:12.5px;color:var(--mut);text-align:start;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.dg td{padding:4px 6px;border-bottom:1px solid var(--line)}
.dg .inp{width:100%}
.keyb{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--mut)}
.keyb.on{background:#fff4d1;border-color:var(--key);color:var(--key)}
.typehelp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px;max-width:980px}
.typehelp div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--panel2)}
.typehelp b{display:block;color:var(--accd)}
/* relations */
.relcanvas{position:relative;overflow:auto;min-height:440px;margin:12px;border:1px dashed var(--line);border-radius:10px;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/18px 18px}
#rsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#rsvg path.hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:14;fill:none}
#rsvg path.ln{stroke:var(--acc);stroke-width:2;fill:none}
#rsvg path.ln.loose{stroke:var(--mut);stroke-dasharray:5 4}
#rsvg text{fill:var(--acc);font:700 14px "Golos Text",sans-serif}
.tbox{position:absolute;width:200px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:2}
.tbox .th{background:var(--acc);color:#fff;font-weight:600;padding:7px 10px;border-radius:8px 8px 0 0;cursor:grab;touch-action:none;display:flex;gap:6px;align-items:center}
.tbox ul{list-style:none;margin:0;padding:4px 0;max-height:220px;overflow:auto}
.tbox li{padding:4px 10px;font-size:13.5px;display:flex;gap:6px;align-items:center;cursor:grab}
.tbox li:hover,.tbox li.over{background:var(--acc2)}
.tbox li .k{color:var(--key)}
.rellist{margin:0 12px 16px}
.rellist table{border-collapse:collapse;width:100%;font-size:13.5px}
.rellist td,.rellist th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start}
/* query */
.qtop{display:flex;gap:12px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line);background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/18px 18px;min-height:120px;align-items:flex-start}
.qtop .tbox{position:static}
.qtop .tbox li{cursor:pointer}
.qtop .tbox .th{cursor:default}
.qtop .tbox .th button{margin-inline-start:auto;background:none;border:0;color:#fff;font-size:16px;width:26px;height:26px}
.qwrap{overflow:auto;padding:12px}
table.qbe{border-collapse:collapse;font-size:13.5px}
.qbe th{text-align:end;padding:4px 8px;font-weight:600;color:var(--mut);white-space:nowrap;background:var(--panel2);position:sticky;left:0;z-index:1}
.qbe td{border:1px solid var(--line);padding:2px;min-width:170px}
.qbe td input:not([type=checkbox]),.qbe td select{width:100%;border:0;background:transparent;padding:6px;min-height:32px}
.qbe td input:focus,.qbe td select:focus{outline:2px solid var(--acc);outline-offset:-2px}
.qbe tr.qt td{border:0;text-align:center}
.qbe tr.qt button{background:none;border:0;color:var(--mut);width:28px;height:26px}
.qbe tr.qt button:hover{color:var(--acc)}
.qbe .tcell{padding:6px;color:var(--mut)}
.qbe input.crit{background:light-dark(#fffaf0,#24221c)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 10px;font:13px "JetBrains Mono",monospace;min-height:30px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
pre.sql{font:14px/1.6 "JetBrains Mono",monospace;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px;white-space:pre-wrap}
.qerr{margin:12px;padding:12px;border-radius:8px;background:var(--badb);color:var(--bad)}
/* forms */
.fsplit{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:0;flex:1}
.fpanel{border-inline-end:1px solid var(--line);padding:12px;background:var(--panel2);overflow:auto}
.fpanel h4{margin:14px 0 6px;font-size:13px;color:var(--accd)}
.fpanel h4:first-child{margin-top:0}
.fpanel label.fl{display:grid;gap:3px;margin-bottom:8px;font-size:13px}
.fpanel .inp{width:100%}
.itl{display:grid;gap:4px}
.it{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 8px;font-size:13px}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{background:none;border:0;width:26px;height:26px;color:var(--mut)}
.it button:hover{color:var(--acc)}
.it input{border:1px solid var(--line);border-radius:5px;padding:2px 6px;width:90px;background:var(--panel)}
.avail{display:flex;flex-wrap:wrap;gap:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.fstage{padding:18px;overflow:auto;background:var(--bg)}
.formcard{max-width:640px;margin:0 auto;background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden;border:1px solid var(--line)}
.fhead{background:var(--fc,#a4262c);color:#fff;padding:16px 20px;font-weight:700;line-height:1.15}
.fbody{padding:16px 20px;display:grid;gap:10px}
.fbody.two{grid-template-columns:1fr 1fr}
.frow{display:grid;gap:3px}
.frow>span{font-size:13px;color:var(--mut);font-weight:500}
.frow .ci{border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.frow .cb{margin:6px 0}
.flabel{grid-column:1/-1;font-weight:700;color:var(--fc,#a4262c);border-bottom:2px solid var(--fc,#a4262c);padding-top:6px}
.fnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--line);background:var(--panel2);font-size:13.5px}
.fnav .btn{min-width:38px;justify-content:center}
.newbadge{background:var(--okb);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600}
/* reports */
.rpage{max-width:820px;margin:0 auto;background:#fff;color:#1c1b1a;padding:36px 42px;box-shadow:0 6px 24px rgba(0,0,0,.1);border-radius:4px;font:14px/1.45 "Golos Text",sans-serif}
.rpage .rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #a4262c;padding-bottom:8px;margin-bottom:16px;gap:12px}
.rpage h1{font-size:26px;margin:0;color:#a4262c;line-height:1.1}
.rpage .rdate{font-size:12.5px;color:#666}
.rpage h2{font-size:16px;margin:18px 0 6px;color:#1c1b1a;background:#f6eeee;padding:5px 9px;border-radius:4px}
.rpage table.rt{border-collapse:collapse;width:100%;font-size:13.5px}
.rpage .rt th{text-align:start;border-bottom:1.5px solid #333;padding:5px 6px;font-size:12.5px}
.rpage .rt td{border-bottom:1px solid #e3e0da;padding:5px 6px}
.rpage .rt td.n,.rpage .rt th.n{text-align:end}
.rpage .gsum{font-size:12.5px;color:#555;text-align:end;padding:4px 6px}
.rpage .rbk{border:1px solid #e3e0da;border-radius:6px;padding:8px 10px;margin:6px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 14px;font-size:13.5px}
.rpage .rbk b{color:#666;font-weight:500}
.rpage .rfoot{margin-top:18px;border-top:1px solid #ccc;padding-top:6px;font-size:12.5px;color:#555;display:flex;justify-content:space-between}
/* project */
.proj{padding:16px;display:grid;gap:16px;max-width:1100px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:16px}
.score{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.big{font-size:44px;font-weight:700;color:var(--acc);line-height:1}
.stat{font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.chk{display:grid;gap:6px}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:7px 8px;border-radius:8px;border:1px solid var(--line)}
.ck.done{background:var(--okb);border-color:transparent}
.ck .m{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:13px;font-weight:700}
.ck.done .m{background:var(--ok);border-color:var(--ok);color:#fff}
.ck small{display:block;color:var(--mut)}
.stage{font-size:12px;font-weight:700;color:var(--accd);margin:8px 0 2px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.theme{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--panel2);text-align:start;font-size:13px}
.theme b{display:block;font-size:14px;margin-bottom:2px}
.theme.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--acc2)}
/* welcome & start */
.welcome{padding:22px;max-width:980px}
.welcome h2{font-size:28px;margin:0 0 6px;line-height:1.1}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:16px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);display:grid;gap:6px;align-content:start}
.step .n{font-weight:700;color:var(--acc);font-size:13px}
.step b{font-size:15px}
.step p{margin:0;font-size:13.5px;color:var(--mut)}
#start{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto}
.sthead{background:var(--acc);color:#fff;padding:clamp(24px,5vw,56px) max(5vw,16px) 28px}
.sthead h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px;line-height:1.05}
.sthead p{margin:0;max-width:640px;opacity:.92;font-size:16px}
.stbody{padding:24px max(5vw,16px);display:grid;gap:22px;max-width:1240px}
.stcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stc{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:start;display:grid;gap:8px;align-content:start;min-height:150px}
.stc:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(164,38,44,.12)}
.stc svg.i{width:34px;height:34px;color:var(--acc)}
.stc b{font-size:16px}
.stc span{font-size:13.5px;color:var(--mut)}
.recent{display:grid;gap:6px}
.rec{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 6px 6px 12px}
.rec .rn{flex:1}
.rec small{color:var(--mut);display:block}
.warnbox{border-inline-start:4px solid var(--key);background:light-dark(#fff8e6,#2b2618);padding:10px 14px;border-radius:6px;font-size:14px}
/* modal & toasts */
#modal{position:fixed;inset:0;background:rgba(20,16,16,.45);display:grid;place-items:center;z-index:100;padding:12px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:14px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(760px,100%)}
.mbox h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:17px}
.mbody{padding:14px 18px;display:grid;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.fld{display:grid;gap:4px;font-size:13.5px}
.fld .inp,.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbl{display:flex;gap:8px;align-items:center;font-size:14px;min-height:30px}
.cbl input{width:18px;height:18px;accent-color:var(--acc)}
.merr{color:var(--bad);margin:0;font-size:13.5px}
.mnote{font-size:13px;color:var(--mut);margin:0}
.prev{overflow:auto;max-height:200px;border:1px solid var(--line);border-radius:8px}
.prev table{border-collapse:collapse;font-size:12.5px}
.prev td,.prev th{border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
#toasts{position:fixed;bottom:44px;right:14px;display:grid;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 28px))}
.toast{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--ok);border-radius:8px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:14px;animation:tin .25s ease}
.toast.err{border-inline-start-color:var(--bad)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
footer.status{background:var(--acc);color:#fff;font-size:12.5px;padding:4px 12px;display:flex;gap:14px;overflow:hidden;white-space:nowrap}
footer.status span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
 .main{grid-template-columns:minmax(0,1fr)}
 nav#nav{display:none;position:fixed;top:0;bottom:0;left:0;width:min(290px,85vw);z-index:60;box-shadow:0 0 40px rgba(0,0,0,.3)}
 body.navopen nav#nav{display:block}
 #navToggle{display:inline-block}
 .fsplit,.pgrid{grid-template-columns:minmax(0,1fr)}
 .fpanel{border-inline-end:0;border-bottom:1px solid var(--line)}
 .savest{display:none}
}
@media (max-width:600px){.rpage{padding:20px 16px}.row2{grid-template-columns:1fr}.fbody.two{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.rpage,.rpage *{visibility:visible}.rpage{position:absolute;left:0;top:0;box-shadow:none}}

<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssq=s=>window.CSS&&CSS.escape?CSS.escape(s):String(s).replace(/["\\]/g,'\\$&');
const uid=()=>Math.random().toString(36).slice(2,10);
const TYPES=['Лічильник','Короткий текст','Довгий текст','Число','Грошова одиниця','Дата/час','Так/Ні'];
const NUMT=['Лічильник','Число','Грошова одиниця'];
const AGG=['Sum','Avg','Min','Max','Count'];
const TOTALS=['Групування',...AGG,'Умова'];
const ICO={
 table:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>',
 query:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>',
 form:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 report:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 15h7"/></svg>',
 rels:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="8" height="7" rx="1.5"/><rect x="14" y="13" width="8" height="7" rx="1.5"/><path d="M10 7.5h3a2 2 0 0 1 2 2v3.5"/></svg>',
 project:'<svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
 key:'<svg class="i k" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg>',
 tip:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
 open:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
 sch:'<svg class="i" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6-9 6z"/><path d="M7 12.5V17c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"/></svg>'
};
let DB=null,DBID=null;
const S={tabs:[],active:null,focus:null,lastCrit:null};
const T=n=>DB.tables.find(t=>t.name===n),Q=n=>DB.queries.find(q=>q.name===n),F=n=>DB.forms.find(f=>f.name===n),R=n=>DB.reports.find(r=>r.name===n);
const fieldOf=(t,n)=>t&&t.fields.find(f=>f.name===n);
const cur=()=>S.tabs.find(t=>t.id===S.active);
const label=n=>String(n).replace(/_/g,' ');

/* ---------- storage ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function save(now){clearTimeout(save.t);const go=()=>{if(!DB)return;DB.meta.saved=Date.now();const ok=LS.set('bazalab:db:'+DBID,DB);const idx=LS.get('bazalab:index')||{};idx[DBID]={name:DB.name,saved:DB.meta.saved,student:DB.meta.student||''};LS.set('bazalab:index',idx);$('#saveState').textContent=ok?'Збережено на цьому комп’ютері · '+new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'Браузер не зберігає — натисніть «Зберегти файл»'};now?go():save.t=setTimeout(go,350)}
function getDL(){if(getDL.p)return getDL.p;if(!(window.claude&&window.claude.use))return Promise.resolve(null);getDL.p=Promise.resolve().then(()=>window.claude.use('downloads')).catch(()=>null);return getDL.p}
function freeName(base,list){if(!list.includes(base))return base;let i=2;while(list.includes(base+' '+i))i++;return base+' '+i}
async function downloadFile(filename,data,copyText){
 const d=await getDL();
 if(d){try{await d.save({filename,data});toast(`Файл «${filename}» збережено. Шукайте його в папці «Завантаження».`);return true}catch(e){if(e&&e.code==='declined'){toast('Збереження скасовано.');return false}}}
 if(copyText!=null){showCopy(filename,copyText);return false}
 toast('У цьому вікні завантаження файлів недоступне. Відкрийте БазаЛаб за посиланням у новій вкладці браузера.','err');return false}
function showCopy(filename,text){modal({title:'Збережіть вміст вручну',wide:true,ok:null,cancel:'Закрити',body:`<p class="mnote">Завантаження тут недоступне. Скопіюйте текст і збережіть у Блокноті як <b>${esc(filename)}</b>, потім відкрийте через «Відкрити файл».</p><textarea class="inp" style="width:100%;height:220px;font:12px monospace" readonly>${esc(text)}</textarea><button class="btn pri" type="button" data-copy>Скопіювати</button>`,onOpen:b=>{b.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Скопійовано')}catch(e){const ta=b.querySelector('textarea');ta.select();toast('Натисніть Ctrl+C, щоб скопіювати','err')}}}})}

/* ---------- ui utils ---------- */
function toast(msg,kind){const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),kind==='err'?7000:4000)}
function err(msg){if(DB){DB.meta.errors=(DB.meta.errors||0)+1;save()}toast(msg,'err')}
function modal({title,body,ok='OK',cancel='Скасувати',wide,onOpen,validate}){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="mbox ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mfoot">${cancel?`<button class="btn" type="button" data-m="0">${cancel}</button>`:''}${ok?`<button class="btn pri" type="button" data-m="1">${ok}</button>`:''}</div></div>`;m.hidden=false;const box=m.firstChild;
 const close=v=>{m.hidden=true;m.innerHTML='';document.removeEventListener('keydown',kd,true);res(v)};
 const go=()=>{const v=collect(box);if(validate){const e=validate(v,box);if(e){let p=box.querySelector('.merr');if(!p){p=document.createElement('p');p.className='merr';box.querySelector('.mbody').appendChild(p)}p.textContent=e;return}}close(v)};
 const kd=ev=>{if(ev.key==='Escape'){ev.stopPropagation();close(null)}else if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='checkbox'&&ok){ev.preventDefault();go()}};
 box.addEventListener('click',ev=>{const pv=ev.target.closest('[data-pickv]');if(pv){close({pick:pv.dataset.pickv});return}const b=ev.target.closest('[data-m]');if(b)b.dataset.m==='1'?go():close(null)});
 document.addEventListener('keydown',kd,true);onOpen&&onOpen(box);const f=box.querySelector('input:not([type=checkbox]):not([readonly]),select');(f||box.querySelector('.btn.pri')||box.querySelector('.btn'))?.focus()})}
function collect(box){const v={};box.querySelectorAll('[name]').forEach(i=>{if(i.type==='checkbox'){if(i.dataset.multi!=null){v[i.name]=v[i.name]||[];if(i.checked)v[i.name].push(i.value)}else v[i.name]=i.checked}else if(i.type==='radio'){if(i.checked)v[i.name]=i.value}else v[i.name]=i.value});return v}
async function askText(title,lbl,def='',validate){const r=await modal({title,body:`<label class="fld"><span>${esc(lbl)}</span><input class="inp" name="v" value="${esc(def)}"></label>`,validate:validate?v=>validate(v.v.trim()):null});return r?r.v.trim():null}
async function confirmBox(title,text,ok='Видалити'){return !!(await modal({title,body:`<p style="margin:0">${text}</p>`,ok}))}
async function pick(title,opts,note=''){const r=await modal({title,ok:null,cancel:'Закрити',body:(note?`<p class="mnote">${note}</p>`:'')+opts.map(o=>`<button class="btn wide" type="button" data-pickv="${esc(o[0])}">${o[1]}</button>`).join('')});return r&&r.pick}

/* ---------- values ---------- */
const pad=n=>String(n).padStart(2,'0');
function toISO(s){if(s==null||s==='')return null;if(s instanceof Date&&!isNaN(s))return `${s.getFullYear()}-${pad(s.getMonth()+1)}-${pad(s.getDate())}`;s=String(s).trim().replace(/^#|#$/g,'');let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/),y,mo,d;if(m){y=+m[1];mo=+m[2];d=+m[3]}else if(m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/)){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}else return null;if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${pad(mo)}-${pad(d)}`}
const today=()=>toISO(new Date());
const isNumLike=v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!isNaN(+v.replace(',','.')));
const num=v=>typeof v==='number'?v:+String(v).replace(',','.');
function eq(a,b){if(a==null||b==null||a===''||b==='')return false;if(typeof a!=='boolean'&&typeof b!=='boolean'&&isNumLike(a)&&isNumLike(b))return num(a)===num(b);return String(a).toLowerCase()===String(b).toLowerCase()}
function cmp(a,b,type){const na=a==null||a==='',nb=b==null||b==='';if(na||nb)return na&&nb?0:na?1:-1;if(typeof a==='boolean'||typeof b==='boolean')return (a?1:0)-(b?1:0);if((NUMT.includes(type)||typeof a==='number')&&isNumLike(a)&&isNumLike(b))return num(a)-num(b);if(type==='Дата/час'){const x=toISO(a)||String(a),y=toISO(b)||String(b);return x<y?-1:x>y?1:0}return String(a).localeCompare(String(b),'uk',{sensitivity:'base',numeric:true})}
function fmt(v,type){if(v==null||v==='')return '';if(typeof v==='boolean'||type==='Так/Ні')return v?'Так':'Ні';if(type==='Дата/час'&&/^\d{4}-\d\d-\d\d/.test(v))return v.slice(8,10)+'.'+v.slice(5,7)+'.'+v.slice(0,4);if(type==='Грошова одиниця'&&isNumLike(v))return num(v).toFixed(2).replace('.',',')+' ₴';if(typeof v==='number')return String(Math.round(v*1000)/1000).replace('.',',');return String(v)}
function conv(f,raw){if(raw===''||raw==null)return {ok:true,v:f.type==='Так/Ні'?false:null};switch(f.type){
 case 'Число':case 'Грошова одиниця':{const s=String(raw).replace(/\s/g,'').replace(',','.').replace(/₴|грн/g,'');const n=Number(s);return s!==''&&isFinite(n)?{ok:true,v:n}:{ok:false,msg:`«${raw}» — не число. Поле «${f.name}» має тип «${f.type}», тут можна вводити лише цифри.`}}
 case 'Лічильник':return {ok:false,msg:'Поле типу «Лічильник» заповнюється автоматично — його не можна змінити.'};
 case 'Так/Ні':return {ok:true,v:typeof raw==='boolean'?raw:/^(так|true|yes|1|-1|істина|\+)$/i.test(String(raw).trim())};
 case 'Дата/час':{const d=toISO(raw);return d?{ok:true,v:d}:{ok:false,msg:`«${raw}» не схоже на дату. Приклад правильного запису: 14.03.2010`}}
 default:{const s=String(raw);if(f.type==='Короткий текст'&&s.length>255)return {ok:false,msg:'«Короткий текст» вміщує до 255 символів. Для довших записів змініть тип поля на «Довгий текст».'};return {ok:true,v:s}}}}
const typeGroup=t=>NUMT.includes(t)?'n':t==='Дата/час'?'d':t==='Так/Ні'?'b':'s';
function validName(n,taken){if(!n)return 'Введіть назву.';if(/[.\[\]!`]/.test(n))return 'У назві не можна використовувати символи . [ ] ! `';if(n.length>64)return 'Назва задовга (до 64 символів).';if(taken&&taken.some(x=>x.toLowerCase()===n.toLowerCase()))return `Об’єкт «${n}» уже існує. Оберіть іншу назву.`;return null}
const allNames=()=>[...DB.tables,...DB.queries].map(o=>o.name);
function uniq(base,list){let i=1;while(list.some(n=>n.toLowerCase()===(base+i).toLowerCase()))i++;return base+i}

function drawRels(){const c=$('#rc'),svg=$('#rsvg');if(!c||!svg)return;const cr=c.getBoundingClientRect();let W=0,H=0;$$('.tbox',c).forEach(b=>{W=Math.max(W,b.offsetLeft+b.offsetWidth+40);H=Math.max(H,b.offsetTop+b.offsetHeight+40)});svg.setAttribute('width',W);svg.setAttribute('height',H);c.style.minHeight=Math.max(440,H)+'px';

function reportHTML(r,data){const ix=n=>data.cols.findIndex(c=>c.name===n);const fields=r.fields.filter(n=>ix(n)>=0&&n!==r.group);const ty=n=>data.cols[ix(n)].type;

 const isN=n=>NUMT.includes(ty(n))&&!/^ID/i.test(n)&&!fieldIsKey(n);

 let html='';if(gi>=0){const groups=new Map();rows.forEach(x=>{const k=fmt(x[gi],data.cols[gi].type)||'(порожньо)';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});groups.forEach((rs,k)=>{html+=`<h2>${esc(label(r.group))}: ${esc(k)}</h2>${body(rs)}${sum(rs)}`})}else html=body(rows)+sum(rows);
 return `<div class="rpage"><div class="rhead"><h1>${esc(r.title||r.name)}</h1><div class="rdate">${fmt(today(),'Дата/час')}</div></div>${rows.length?html:'<p>Немає даних.</p>'}<div class="rfoot"><span>Усього записів: ${rows.length}${DB.meta.student?' · Підготував(-ла): '+esc(DB.meta.student):''}</span><span>Сторінка 1 з 1</span></div></div>`}

/* ---------- import / export ---------- */
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('x'));s.onerror=()=>rej(new Error('Не вдалося завантажити модуль Excel. Збережіть файл як CSV і спробуйте ще раз.'));document.head.appendChild(s)})}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length;const d=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"')q=true;else if(c===d){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
 if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function inferType(vals){const v=vals.filter(x=>x!=null&&String(x).trim()!=='');if(!v.length)return 'Короткий текст';if(v.every(x=>x instanceof Date||(typeof x==='string'&&toISO(x)&&/[.\-\/]/.test(x))))return 'Дата/час';if(v.every(x=>typeof x==='boolean'||/^(так|ні|true|false)$/i.test(String(x).trim())))return 'Так/Ні';if(v.every(x=>typeof x==='number'||(isNumLike(String(x))&&!/^0\d/.test(String(x).trim())&&!/^\+/.test(String(x).trim()))))return 'Число';return v.some(x=>String(x).length>255)?'Довгий текст':'Короткий текст'}
async function doImport(file){let aoa;try{if(/\.xlsx?$/i.test(file.name)){const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];aoa=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null})}else aoa=parseCSV(await file.text())}catch(e){err(e.message||'Не вдалося прочитати файл.');return}
 aoa=(aoa||[]).filter(r=>r&&r.some(x=>x!=null&&String(x).trim()!==''));if(!aoa.length){err('Файл порожній.');return}
 const base=file.name.replace(/\.[^.]+$/,'').replace(/[.\[\]!`]/g,'_').slice(0,40)||'Імпорт';
 const r=await modal({title:'Імпорт даних: '+file.name,wide:true,ok:'Імпортувати',body:`<div class="prev"><table>${aoa.slice(0,6).map(row=>`<tr>${row.map(c=>`<td>${esc(c instanceof Date?toISO(c):c)}</td>`).join('')}</tr>`).join('')}</table></div><p class="mnote">Показано перші рядки, усього рядків: ${aoa.length}.</p>
 <label class="cbl"><input type="checkbox" name="hdr" checked>Перший рядок містить назви полів</label>
 <label class="cbl"><input type="radio" name="mode" value="new" checked>Створити нову таблицю</label><label class="fld" style="margin-inline-start:26px"><span>Назва нової таблиці</span><input class="inp" name="tname" value="${esc(DB.tables.some(t=>t.name===base)?uniq(base,allNames()):base)}"></label>
 <label class="cbl" style="margin-inline-start:26px"><input type="checkbox" name="addid" checked>Додати ключове поле ID (Лічильник)</label>
 ${DB.tables.length?`<label class="cbl"><input type="radio" name="mode" value="append">Додати записи до наявної таблиці (стовпчики за назвами полів)</label><select class="inp" name="target" style="margin-inline-start:26px">${DB.tables.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select>`:''}`,
 validate:v=>v.mode==='new'?validName(v.tname.trim(),allNames()):null});
 if(!r)return;const hdr=r.hdr?aoa[0].map((h,i)=>String(h??'').trim().replace(/\s+/g,'_').replace(/[.\[\]!`]/g,'')||'Поле'+(i+1)):aoa[0].map((h,i)=>'Поле'+(i+1));const data=r.hdr?aoa.slice(1):aoa;
 hdr.forEach((h,i)=>{let n=h,k=2;while(hdr.slice(0,i).includes(n))n=h+'_'+k++;hdr[i]=n});
 if(r.mode==='append'){const t=T(r.target);let bad=0,added=0;const map=hdr.map(h=>t.fields.find(f=>f.name.toLowerCase()===h.toLowerCase()));if(!map.some(Boolean)){err('Жодна назва стовпчика не збігається з полями таблиці «'+t.name+'».');return}
  data.forEach(row=>{const o=newRow(t);map.forEach((f,i)=>{if(!f||f.type==='Лічильник')return;const c=conv(f,row[i] instanceof Date?toISO(row[i]):row[i]);if(c.ok)o[f.name]=c.v;else bad++});const kf=t.fields.find(f=>f.key&&f.type!=='Лічильник');if(kf&&(o[kf.name]==null||t.rows.some(x=>eq(x[kf.name],o[kf.name])))){bad++;return}t.rows.push(o);added++});
  DB.meta.flags.imported=true;save();renderNav();open('table',t.name,'data');toast(`Додано записів: ${added}${bad?` · пропущено значень з помилками: ${bad}`:''}`);return}
 const types=hdr.map((h,i)=>inferType(data.map(row=>row[i])));const fields=[];if(r.addid&&!hdr.some(h=>/^id$/i.test(h)))fields.push(['ID','Лічильник',1]);hdr.forEach((h,i)=>fields.push([h,types[i],!r.addid&&i===0]));
 const t=mkTable(r.tname.trim(),fields);let bad=0;data.forEach(row=>{const o=newRow(t);hdr.forEach((h,i)=>{const f=fieldOf(t,h);if(f.type==='Лічильник')return;const c=conv(f,row[i] instanceof Date?toISO(row[i]):row[i]);if(c.ok)o[h]=c.v;else bad++});t.rows.push(o)});
 DB.tables.push(t);DB.meta.flags.imported=true;save();renderNav();open('table',t.name,'data');toast(`Створено таблицю «${t.name}»: ${t.rows.length} записів.${bad?' Значень з помилками: '+bad:''} Перевірте типи даних у Конструкторі.`)}
async function doExport(){const objs=[...DB.tables.map(t=>['T:'+t.name,'Таблиця: '+t.name]),...DB.queries.map(q=>['Q:'+q.name,'Запит: '+q.name])];if(!objs.length){err('Немає що експортувати — створіть таблицю.');return}
 const c=cur();const pre=c&&(c.obj==='table'?'T:'+c.name:c.obj==='query'?'Q:'+c.name:'');
 const r=await modal({title:'Експорт даних',ok:'Експортувати',body:`<label class="fld"><span>Що експортувати</span><select class="inp" name="src">${objs.map(o=>`<option value="${esc(o[0])}" ${o[0]===pre?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>
 <label class="cbl"><input type="radio" name="fmt" value="xlsx" checked>Excel (.xlsx)</label><label class="cbl"><input type="radio" name="fmt" value="csv">CSV (.csv, відкривається в Excel і Google Таблицях)</label>`});if(!r)return;
 let data;try{const ps=srcParams(r.src);let p={};if(ps.length){p=await askParams(ps);if(!p)return}data=srcData(r.src,p)}catch(e){err(e.message);return}
 const name=r.src.slice(2).replace(/[\\/:*?"<>|]/g,'_');
 if(r.fmt==='csv'){const q=v=>{const s=String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};const txt='\ufeff'+[data.cols.map(c=>q(c.name)).join(';'),...data.rows.map(row=>row.map((v,i)=>q(fmt(v,data.cols[i].type).replace(' ₴',''))).join(';'))].join('\r\n');if(await downloadFile(name+'.csv',txt,txt)){DB.meta.flags.exported=true;save()}return}
 try{const X=await loadXLSX();const aoa=[data.cols.map(c=>c.name),...data.rows.map(row=>row.map((v,i)=>{const t=data.cols[i].type;if(v==null)return null;if(t==='Дата/час'&&/^\d{4}-\d\d-\d\d/.test(v)){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}if(typeof v==='boolean')return v?'Так':'Ні';return v}))];
  const ws=X.utils.aoa_to_sheet(aoa,{cellDates:true});ws['!cols']=data.cols.map((c,i)=>({wch:Math.min(40,Math.max(c.name.length,...data.rows.map(r=>fmt(r[i],c.type).length))+2)}));const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,name.slice(0,31));const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  if(await downloadFile(name+'.xlsx',new Uint8Array(buf))){DB.meta.flags.exported=true;save()}}catch(e){err(e.message||'Помилка експорту.')}}

ACT.newQuery=async()=>{if(!DB.tables.length){err('Спочатку створіть таблицю.');return}const q={name:uniq('Запит',allNames()),tables:[],cols:[],totals:false};const r=await modal({title:'Додавання таблиць',ok:'Додати вибрані таблиці',body:`<p class="mnote">Оберіть таблиці для запиту:</p>${DB.tables.map((t,i)=>`<label class="cbl"><input type="checkbox" name="ts" data-multi value="${esc(t.name)}" ${i===0?'checked':''}>${esc(t.name)}</label>`).join('')}`});if(!r)return;q.tables=r.ts;DB.queries.push(q);save();open('query',q.name,'design')};
ACT.newForm=async()=>{if(!DB.tables.length){err('Спочатку створіть таблицю.');return}const c=cur();const r=await modal({title:'Нова форма',ok:'Створити',body:`<label class="fld"><span>Для якої таблиці форма?</span><select class="inp" name="t">${DB.tables.map(t=>`<option ${c&&c.obj==='table'&&c.name===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>`});if(!r)return;const name=freeName('Форма '+r.t,DB.forms.map(f=>f.name));DB.forms.push({name,source:r.t,title:r.t,size:24,color:'#a4262c',layout:'one',items:T(r.t).fields.map(x=>({f:x.name}))});save();open('form',name,'data')};

ACT.objmenu=async b=>{const k=b.dataset.k,n=b.dataset.n;const names={table:'таблицю',query:'запит',form:'форму',report:'звіт'};const v=await pick(n,[['open','Відкрити'],['design','Конструктор'],['rename','Перейменувати'],['copy','Копіювати'],['delete','Видалити '+names[k]]]);if(!v)return;
 if(v==='open')open(k,n,defView(k,n));else if(v==='design')open(k,n,'design');else if(v==='rename')renameObj(k,n);else if(v==='copy')copyObj(k,n);else if(v==='delete')deleteObj(k,n)};
function listOf(k){return {table:DB.tables,query:DB.queries,form:DB.forms,report:DB.reports}[k]}
function takenFor(k,except){return (k==='table'||k==='query'?allNames():listOf(k).map(o=>o.name)).filter(x=>x!==except)}
async function renameObj(k,n){const nn=await askText('Перейменувати','Нова назва',n,v=>v===n?null:validName(v,takenFor(k,n)));if(!nn||nn===n)return;doRename(k,n,nn)}
function doRename(k,n,nn){const o=listOf(k).find(x=>x.name===n);if(!o)return false;const er=validName(nn,takenFor(k,n));if(er){err(er);return false}o.name=nn;
 if(k==='table'){DB.rels.forEach(r=>{if(r.pt===n)r.pt=nn;if(r.ct===n)r.ct=nn});DB.queries.forEach(q=>{q.tables=q.tables.map(x=>x===n?nn:x);q.cols.forEach(c=>{if(c.field.startsWith(n+'.'))c.field=nn+c.field.slice(n.length)})});DB.forms.forEach(f=>{if(f.source===n)f.source=nn});DB.reports.forEach(r=>{if(r.source==='T:'+n)r.source='T:'+nn});if(DB.layout[n]){DB.layout[nn]=DB.layout[n];delete DB.layout[n]}}
 if(k==='query')DB.reports.forEach(r=>{if(r.source==='Q:'+n)r.source='Q:'+nn});
 S.tabs.forEach(t=>{if(t.obj===k&&t.name===n)t.name=nn});save();renderTabs();renderNav();renderView();return true}
function copyObj(k,n){const o=listOf(k).find(x=>x.name===n);const c=JSON.parse(JSON.stringify(o));c.name=freeName(n+' копія',takenFor(k));if(k==='table')c.rows.forEach(r=>r._id=uid());listOf(k).push(c);save();renderNav();open(k,c.name)}
async function deleteObj(k,n){const extra=k==='table'?' Разом із нею буде видалено її зв’язки.':'';if(!await confirmBox('Видалити «'+n+'»?','Цю дію не можна скасувати.'+extra))return;const L=listOf(k);L.splice(L.findIndex(x=>x.name===n),1);if(k==='table'){DB.rels=DB.rels.filter(r=>r.pt!==n&&r.ct!==n);delete DB.layout[n]}S.tabs.filter(t=>t.obj===k&&t.name===n).forEach(t=>closeTab(t.id));save();renderNav();renderView()}

 let row=el.dataset.row==='new'?null:t.rows.find(r=>r._id===el.dataset.row);const isNew=!row;if(isNew&&(c.v==null||c.v===false))return;
 if(!isNew&&eq(row[f.name],c.v)&&typeof c.v!=='boolean')return;
 const m=checkSet(t,row,f,c.v);if(m){err(m);rerender();return}

 row[f.name]=c.v;save();if(isNew){const fi=t.fields.indexOf(f);const nx=t.fields.slice(fi+1).find(x=>x.type!=='Лічильник')||f;S.focus={row:row._id,f:nx.name};renderView()}else if(el.closest('tr'))el.closest('tr').classList.toggle('warn',!!t.fields.find(x=>x.key&&(row[x.name]==null||row[x.name]==='')))};

CH.fname=el=>{const t=curT();const i=+el.dataset.i;const f=t.fields[i];const nn=el.value.trim();if(nn===f.name)return;const e=validName(nn,t.fields.filter(x=>x!==f).map(x=>x.name));if(e){err(e.replace('Об’єкт','Поле'));el.value=f.name;return}const old=f.name;f.name=nn;t.rows.forEach(r=>{r[nn]=r[old];delete r[old]});
 DB.rels.forEach(r=>{if(r.pt===t.name&&r.pf===old)r.pf=nn;if(r.ct===t.name&&r.cf===old)r.cf=nn});DB.queries.forEach(q=>q.cols.forEach(c=>{if(c.field===t.name+'.'+old)c.field=t.name+'.'+nn}));DB.forms.forEach(fm=>{if(fm.source===t.name)fm.items.forEach(it=>{if(it.f===old)it.f=nn})});DB.reports.forEach(r=>{if(r.source==='T:'+t.name){r.fields=r.fields.map(x=>x===old?nn:x);if(r.group===old)r.group=nn;if(r.sort===old)r.sort=nn}});save()};
CH.fdesc=el=>{curT().fields[+el.dataset.i].desc=el.value;save()};
CH.ftype=el=>{const t=curT();const f=t.fields[+el.dataset.i];const nt=el.value;if(nt==='Лічильник'){if(t.fields.some(x=>x!==f&&x.type==='Лічильник')){err('У таблиці може бути лише одне поле типу «Лічильник».');el.value=f.type;return}if(t.rows.length){err('Не можна змінити тип на «Лічильник», коли в таблиці вже є записи. Створіть нове поле.');el.value=f.type;return}}
 if(DB.rels.some(r=>(r.pt===t.name&&r.pf===f.name)||(r.ct===t.name&&r.cf===f.name))&&typeGroup(nt)!==typeGroup(f.type)){err('Це поле бере участь у зв’язку. Спочатку видаліть зв’язок у Схемі даних.');el.value=f.type;return}
 let lost=0;const g={...f,type:nt};t.rows.forEach(r=>{const v=r[f.name];if(v==null||v==='')return;const c=conv(g,typeof v==='boolean'?(v?'так':''):f.type==='Дата/час'?fmt(v,'Дата/час'):v);if(c.ok)r[f.name]=c.v;else{r[f.name]=null;lost++}});f.type=nt;save();if(lost)toast(`Тип змінено. ${lost} значень не підходять до типу «${nt}» і були очищені.`,'err');else toast('Тип поля «'+f.name+'»: '+nt)};
ACT.togkey=b=>{const t=curT();const f=t.fields[+b.dataset.i];if(f.key){f.key=false;save();renderView();return}
 if(f.type!=='Лічильник'){const vals=t.rows.map(r=>r[f.name]);if(vals.some(v=>v==null||v==='')){err(`Поле «${f.name}» не може бути ключовим: у деяких записах воно порожнє.`);return}if(new Set(vals.map(v=>String(v).toLowerCase())).size!==vals.length){err(`Поле «${f.name}» не може бути ключовим: значення повторюються.`);return}}
 t.fields.forEach(x=>x.key=false);f.key=true;save();renderView()};

ACT.fdel=async b=>{const t=curT();const f=t.fields[+b.dataset.i];if(DB.rels.some(r=>(r.pt===t.name&&r.pf===f.name)||(r.ct===t.name&&r.cf===f.name))){err('Поле бере участь у зв’язку. Спочатку видаліть зв’язок у Схемі даних.');return}if(!await confirmBox(`Видалити поле «${f.name}»?`,'Усі дані цього поля буде втрачено.'))return;t.fields.splice(t.fields.indexOf(f),1);t.rows.forEach(r=>delete r[f.name]);save();renderView()};

/* report */
const curR=()=>R(cur().name);
CH.rprop=el=>{const r=curR();const k=el.dataset.k;r[k]=el.type==='checkbox'?el.checked:el.value;if(k==='source'){r.fields=srcCols(r.source).map(c=>c.name).filter(n=>!fieldIsKey(n));r.group='';r.sort='';cur().st.params=null}save();rerender()};
ACT.rfadd=b=>{curR().fields.push(b.dataset.v);save();renderView()};
ACT.rfdel=b=>{curR().fields.splice(+b.dataset.i,1);save();renderView()};
ACT.rfmv=b=>{const r=curR();const i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>=r.fields.length)return;[r.fields[i],r.fields[j]]=[r.fields[j],r.fields[i]];save();renderView()};
ACT.rlayout=b=>{curR().layout=b.dataset.v;save();renderView()};
ACT.rparams=()=>{cur().st.params=null;renderView()};
CH.rrename=el=>{const r=curR();if(!doRename('report',r.name,el.value.trim()))el.value=r.name};
let REPCSS='';try{REPCSS=[...document.querySelector('style').sheet.cssRules].filter(r=>r.selectorText&&r.selectorText.includes('.rpage')).map(r=>r.cssText).join('\n')}catch(e){}
ACT.rdl=()=>{const r=curR();const d=repData(cur(),r);if(!d.data){err(d.error||'Спочатку введіть параметри.');return}const html=`<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><title>${esc(r.title||r.name)}</title><style>body{margin:0;padding:24px;background:#eee;font-family:system-ui,sans-serif}${REPCSS}@media print{body{background:#fff;padding:0}.rpage{box-shadow:none}}</style></head><body>${reportHTML(r,d.data)}</body></html>`;downloadFile((r.title||r.name).replace(/[\\/:*?"<>|]/g,'_')+'.html',html,html)};
/* project */
CH.meta=el=>{DB.meta[el.dataset.k]=el.value.trim();save();if(el.dataset.k==='theme')rerender()};
ACT.theme=b=>{DB.meta.theme=b.dataset.v;save();renderView()};
ACT.sendTeacher=async()=>{const m=DB.meta;if(!m.student||!m.cls){err('Впишіть прізвище, ім’я та клас — інакше вчитель не знатиме, чия це робота.');return}const ev=evalProject();m.lastCheck={at:Date.now(),done:ev.n,score:ev.score,items:ev.res.map(c=>({t:c.t,done:c.done}))};save(true);const txt=JSON.stringify(DB);await downloadFile(`${m.cls}_${m.student.replace(/\s+/g,'_')}_проєкт_БД.bazalab.json`,txt,txt)};
CH.dbname=el=>{if(!DB)return;DB.name=el.value.trim()||DB.name;el.value=DB.name;save();if(!cur())renderView()};

/* ---------- global events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f&&(DB||/^(start|delRecent|openFile)/.test(b.dataset.act)))f(b,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch]&&DB)CH[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in],[data-ch]');if(!el||!DB)return;const k=el.dataset.in||el.dataset.ch;if(IN[k])IN[k](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('#view .ci[data-ch="cell"]')){e.preventDefault();e.target.blur();const td=e.target.closest('td');const tr=td&&td.parentElement;if(!tr)return;const idx=[...tr.children].indexOf(td);const nx=tr.nextElementSibling;const n=nx&&nx.children[idx]&&nx.children[idx].querySelector('input');setTimeout(()=>{const m=n&&document.contains(n)?n:$('#view tr.newr')?.children[idx]?.querySelector('input');m&&m.focus()},0)}});
$('#fileDB').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const db=JSON.parse(await f.text());if(!db||!Array.isArray(db.tables))throw new Error();loadDB(db);toast(`Відкрито «${db.name}»${db.meta&&db.meta.student?' · '+db.meta.student:''}`);if(db.meta&&db.meta.student)open('project')}catch(x){toast('Це не файл бази БазаЛаб (.json).','err')}});
$('#fileImp').addEventListener('change',e=>{const f=e.target.files[0];if(f&&DB)doImport(f)});
let lastAct=Date.now();['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(DB&&!document.hidden&&Date.now()-lastAct<120000){DB.meta.activeMs=(DB.meta.activeMs||0)+15000;save()}},15000);
setTimeout(getDL,1500);
renderStart();
}
</script>
</body>
</html>
