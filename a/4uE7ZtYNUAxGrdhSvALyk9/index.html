function compute(){
  const exPts=L.ex.reduce((s,e,i)=>s+((S.ex[i]&&S.ex[i].pts)||0),0), exErr=L.ex.reduce((s,e,i)=>s+Math.min(2,(S.ex[i]&&S.ex[i].tries)||0),0);

  if(!rows.length){ tb.append(el("tr",{},el("td",{colspan:"4",class:"muted"},"Поки порожньо. Будь першим!"))); return; }
  rows.forEach((r,i)=>tb.append(el("tr",{},el("td",{},String(i+1)),el("td",{},String(r.nick||"?")),el("td",{},String(r.xp|0)),el("td",{},String(r.m|0)+"%")))); }
(async()=>{ try{ if(!window.claude||!claude.use) throw 0; const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) throw 0; DB=db; ME=await user.id();
  db.collection("board").onSnapshot(s=>drawRank(s.docs),()=>{ $("#rankBody").innerHTML='<tr><td colspan="4" class="muted">Рейтинг зараз недоступний.</td></tr>'; }); }
  catch(e){ $("#rankBody").innerHTML='<tr><td colspan="4" class="muted">Рейтинг працює, коли сторінку відкрито з увійденим акаунтом.</td></tr>'; $("#saveRank").disabled=true; } })();
$("#saveRank").addEventListener("click",async()=>{ const nick=$("#nick").value.trim().slice(0,16); if(!nick){ $("#rankMsg").textContent="Введи нікнейм."; return; }
  if(!DB||!ME){ $("#rankMsg").textContent="Рейтинг недоступний."; return; }
  try{ await DB.collection("board").doc(ME).set({nick,xp:S.xp,m:Math.round((S.m.score||0)*100),at:new Date().toISOString()}); $("#rankMsg").textContent="Збережено! ⭐"; }catch(e){ $("#rankMsg").textContent="Не вдалося зберегти. Спробуй пізніше."; } });

renderWarm(); renderEx(); renderCards(); showTab("warm"); hud();
