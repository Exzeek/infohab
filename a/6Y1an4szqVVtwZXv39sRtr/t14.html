<style>

['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(hintFn)idle(hintFn);},true));

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));idle(null);hand.style.display='none';}
function sayBox(html,cls){return `<div class="talk ${cls||''}">${ROBOT}<div class="bubble">${html} <button class="say" title="Прочитати">🔊</button></div></div>`;}
function wireSay(root,text){root.querySelectorAll('.say').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(text&&(!Array.isArray(text)||text.length)?text:b.parentNode.textContent,true);});}

/* intro */
function intro(){const s=$('#intro');s.innerHTML=`${ROBOT}<h1>${G.title}</h1>
  <div class="bubble" style="max-width:52rem">${G.intro} <button class="say">🔊</button></div>

  <button class="big" id="go">Вирушаймо! 🚀</button>`;

  $('#go').onclick=()=>{sesStart();speak(G.mapSay);openMap();};show('intro');}

/* map */
function openMap(){const s=$('#map');const st=G.stages;
  const SM=(innerWidth<=900||innerHeight<=600),T0=innerWidth<600?310:(innerHeight<=600?235:185),MH=Math.max(document.querySelector('main').clientHeight,T0+60+st.length*118);s.style.height=SM?MH+'px':'';const pts=SM?Array.from({length:st.length+1},(_,i)=>[i%2?72:28,(T0+i*118)/MH*100]):(G.mapPts||Array.from({length:st.length+1},(_,i)=>[10+i*(80/st.length), i%2?48:80]));
  const nextI=st.findIndex((_,i)=>!S.done.includes(i));
  let d='M '+pts.map(p=>p[0]+' '+p[1]).join(' L ');
  s.innerHTML=`<svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#e9d8b0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:28px"/>
  <path d="${d}" fill="none" stroke="#fff" stroke-dasharray="2 18" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:6px"/></svg>
  <div id="mapTalk">${sayBox(nextI<0?G.mapDone:G.mapSay)}</div>`;
  st.forEach((g,i)=>{const b=el('button','stop',`<span class="emo">${g.icon}</span>${g.name}`);
    const done=S.done.includes(i),open=done||i===nextI;
    b.classList.add(done?'done':(i===nextI?'next':'lock'));b.style.left=pts[i][0]+'%';b.style.top=pts[i][1]+'%';
    b.onclick=()=>{if(!open){fact('🔒 Спершу пройдіть попередню зупинку');sNo();return;}openStage(i);};s.appendChild(b);});
  const fin=el('button','stop'+(nextI<0?' next':' lock'),`<span class="emo">${G.finIcon||'🔋'}</span>${G.finName||'Повний заряд'}`);
  fin.style.left=pts[st.length][0]+'%';fin.style.top=pts[st.length][1]+'%';
  fin.onclick=()=>{if(nextI>=0){fact('🔋 Спершу пройдіть усі зупинки');sNo();return;}finale();};s.appendChild(fin);
  const rb=el('div');rb.id='mapRobot';rb.innerHTML=ROBOT;s.appendChild(rb);
  const at=nextI<0?st.length:nextI, from=S.justDone!=null?Math.max(0,at-1):at;
  rb.style.left=pts[from][0]+'%';rb.style.top=pts[from][1]+'%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{rb.style.left=pts[at][0]+'%';rb.style.top=pts[at][1]+'%';}));
  S.justDone=null;wireSay(s,nextI<0?G.mapDone:G.mapSay);show('map');
  const tgt=nextI<0?fin:s.querySelectorAll('.stop')[nextI];idle(()=>showHand(tgt));}

/* stage shell */
let cur=-1;
function openStage(i){cur=i;stT=Date.now();const g=G.stages[i],s=$('#stage');
  s.innerHTML=`<div class="top"><button class="back" id="sBack">← Мапа</button><div style="flex:1" id="sTalk"></div><button class="hintbtn" id="sRe" title="Почати цю вправу заново">🔄 Заново</button><button class="hintbtn" id="sHint">💡 Підказка</button></div>
   <div class="arena" id="arena"></div><div class="dots" id="dots"></div>`;
  $('#sBack').onclick=openMap;$('#sRe').onclick=()=>{if(window.__clearT)window.__clearT();idle(null);try{speechSynthesis.cancel()}catch(e){};const h=document.getElementById('hand');if(h)h.style.display='none';document.querySelectorAll('.ring,.chip.ghost').forEach(x=>x.remove());const f=document.getElementById('fact');if(f)f.classList.remove('on');openStage(i);};show('stage');
  STAGE_FN[g.type](g,$('#arena'));}
function setTalk(html,say){$('#sTalk').innerHTML=sayBox(html);wireSay($('#sTalk'),say||html);speak(say||html);}
function setDots(n,k){$('#dots').innerHTML=Array.from({length:n},(_,j)=>`<i class="${j<k?'on':''}"></i>`).join('');}
function stageDone(){const g=G.stages[cur];logStage(cur,Math.round((Date.now()-stT)/1000));if(!S.done.includes(cur))S.done.push(cur);S.justDone=cur;save();sWin();confetti();
  idle(null);setTalk(`${g.done||G.T.done}${g.sticker?`<br><span class="stkl">🏺 Новий експонат: <span class="emo">${g.sticker.e}</span> ${g.sticker.t}</span>`:''} <br><button class="big" id="toMap" style="margin-top:.6rem;font-size:1.1rem">Далі мапою ➜</button>`,g.done);
  robotDo($('#sTalk'),'dance');$('#toMap').onclick=openMap;}

/* -------- FIND -------- */
function stFind(g,a){const sc=el('div','scene');if(g.bg)sc.style.background=g.bg;a.appendChild(sc);
  g.items.forEach((it,j)=>{const b=it.t?el('button','it tx',it.t):el('button','it emo',it.e);b.style.left=it.x+'%';b.style.top=it.y+'%';if(it.s)b.style.fontSize=it.s+'rem';b.dataset.k=it.k||'';b.title=it.n||'';
    sc.appendChild(b);b.onclick=()=>pick(b,it);});
  let k=0,miss=0;
  const ask=()=>{if(k>=g.asks.length){stageDone();return;}miss=0;const q=g.asks[k];setTalk(q.q);setDots(g.asks.length,k);
    idle(()=>{const t=sc.querySelector(`[data-k="${q.k}"]:not(.found)`);showHand(t);});};
  function pick(b,it){const q=g.asks[k];if(!q||b.classList.contains('found'))return;
    if(it.k===q.k){sc.querySelectorAll(`[data-k="${q.k}"]`).forEach(x=>x.classList.add('found'));sOk();addStar();const l=el('div','lbl',it.n);l.style.left=b.style.left;l.style.top=`calc(${b.style.top} + 2.6rem)`;sc.appendChild(l);
      fact('✅ '+q.ok);speak(q.ok);robotDo($('#sTalk'),'hop');k++;setDots(g.asks.length,k);setTimeout(ask,2600);}
    else{miss++;logMiss(g.name,q.q.replace(/<[^>]+>/g,'')+' ('+(it.n||'?')+')');sNo();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);
      const h=miss>=2?(q.hint2||G.T.hand):(q.hint||G.T.no);fact('🤔 '+(it.n?it.n+' — ':'')+h);speak(h);
      if(miss>=2){const t=sc.querySelector(`[data-k="${q.k}"]:not(.found)`);showHand(t);}}}
  ask();}

/* -------- PAIRS -------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stPairs(g,a){let cards=[];g.pairs.forEach((p,j)=>{cards.push({j,e:p.a,n:p.an});cards.push({j,e:p.b,n:p.bn});});cards=shuffle(cards);
  const cols=Math.ceil(cards.length/2),grid=el('div','grid');
  const fit=()=>{const W=a.clientWidth,H=a.clientHeight,w=Math.min((W-(cols-1)*16)/cols,(H-16)/2*0.85);grid.style.gridTemplateColumns=`repeat(${cols},${w}px)`;grid.style.gridTemplateRows=`repeat(2,${w/0.85}px)`;};
  a.appendChild(grid);
  let open=[],got=0,busy=false;setTalk(g.say);setDots(g.pairs.length,0);
  cards.forEach(c=>{const b=el('button','card',`<div class="in"><div class="f">?</div><div class="b"><span class="emo">${c.e}</span><span>${c.n}</span></div></div>`);
    c.b=b;grid.appendChild(b);b.onclick=()=>{if(busy||b.classList.contains('open')||b.classList.contains('got'))return;
      b.classList.add('open');tone([[520,.08]]);open.push(c);
      if(open.length===2){busy=true;const[x,y]=open;
        if(x.j===y.j){setTimeout(()=>{x.b.classList.add('got');y.b.classList.add('got');sOk();addStar();got++;setDots(g.pairs.length,got);
          const p=g.pairs[x.j];fact('✅ '+p.why);speak(p.why);robotDo($('#sTalk'),'hop');open=[];busy=false;if(got===g.pairs.length)setTimeout(stageDone,2400);},450);}
        else{logMiss(g.name,x.n+' + '+y.n);setTimeout(()=>{x.b.classList.add('nope');y.b.classList.add('nope');sNo();},500);
          setTimeout(()=>{x.b.classList.remove('open','nope');y.b.classList.remove('open','nope');open=[];busy=false;},1500);}}};});
  fit();addEventListener('resize',fit);
  idle(()=>{const c=cards.find(c=>!c.b.classList.contains('got'));if(c){c.b.classList.add('open');const m=cards.find(d=>d!==c&&d.j===c.j);m.b.classList.add('open');
    showHand(c.b,m.b);setTimeout(()=>{if(!c.b.classList.contains('got')){c.b.classList.remove('open');m.b.classList.remove('open');}},2200);}});
}

/* -------- SORT -------- */
function stSort(g,a){const w=el('div','sortwrap');w.innerHTML=`<div class="tray" id="tray"></div>${g.root?`<div class="rootn"><span class="emo">${g.root.e}</span>${g.root.n}</div>`:''}<div class="baskets${g.root?' tree':''}${g.venn?' venn':''}">${g.venn?'<i class="vc vl"></i><i class="vc vr"></i>':''}${g.baskets.map((b,j)=>
  `<div class="basket" data-j="${j}"><h3>${b.e?`<span class="emo">${b.e}</span>`:''}${b.n}</h3><div class="got"></div></div>`).join('')}</div>`;a.appendChild(w);
  const tray=w.querySelector('#tray'),bs=[...w.querySelectorAll('.basket')];let left=g.items.length,sel=null,miss={};
  setTalk(g.say);setDots(g.items.length,0);
  shuffle(g.items).forEach(it=>{const c=el('div','chip',`<span class="emo">${it.e}</span>${it.n}`);c._it=it;tray.appendChild(c);
    c.addEventListener('pointerdown',ev=>startDrag(ev,c));});
  bs.forEach(b=>b.addEventListener('click',()=>{if(sel)drop(sel,b);}));
  function drop(c,b){const it=c._it,j=+b.dataset.j;if(sel)sel.classList.remove('sel');sel=null;
    if(it.to===j){b.querySelector('.got').appendChild(c);c.style.pointerEvents='none';sOk();addStar();left--;setDots(g.items.length,g.items.length-left);
      fact('✅ '+(it.why||G.T.ok));speak(it.why||G.T.ok);robotDo($('#sTalk'),'hop');if(!left)setTimeout(stageDone,2400);}
    else{miss[it.n]=(miss[it.n]||0)+1;logMiss(g.name,it.n+' → '+g.baskets[j].n);sNo();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);
      const h=it.hint||G.T.think;fact('🤔 '+h);speak(h);if(miss[it.n]>=2)showHand(c,bs[it.to]);}}
  function startDrag(ev,c){ev.preventDefault();const sx=ev.clientX,sy=ev.clientY;let gh=null,moved=false,over=null;
    const mv=e=>{if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=true;gh=c.cloneNode(true);gh.classList.add('ghost');document.body.appendChild(gh);c.style.opacity=.3;}
      if(!gh)return;gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';
      over=bs.find(b=>{const r=b.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;})||null;
      bs.forEach(b=>b.classList.toggle('hot',b===over));};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(gh){gh.remove();c.style.opacity='';bs.forEach(b=>b.classList.remove('hot'));if(over)drop(c,over);}
      else{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');tone([[520,.06]]);}};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);}
  idle(()=>{const c=tray.querySelector('.chip');if(c)showHand(c,bs[c._it.to]);});}

/* ======== extra stage types ======== */
function opts(list,onPick,cls){const w=el('div','opts '+(cls||''));list.forEach((o,i)=>{const b=el('button','opt',`<span class="emo">${o.e}</span><span>${o.n}</span>`);b.onclick=()=>onPick(i,b);w.appendChild(b);});return w;}
function bad(b){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);sNo();}
function good(t){sOk();addStar();fact('✅ '+t);speak(t);robotDo($('#sTalk'),'hop');}

/* ---- BOX: Чарівна скринька ---- */
function stBox(g,a){let k=0,miss=0,shown=1;const w=el('div','boxw');a.appendChild(w);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];miss=0;shown=1;setDots(g.rounds.length,k);
    w.innerHTML=`<div class="chest"><span class="emo lid">🎁</span><div class="out emo"></div></div><div class="clues"></div><div class="cbtn"><button class="hintbtn" id="more">🔍 Ще підказка</button></div>`;
    const clues=w.querySelector('.clues');const draw=()=>{clues.innerHTML=R.clues.slice(0,shown).map((c,i)=>`<div class="clue">${i+1}. ${c}</div>`).join('');
      w.querySelector('#more').style.visibility=shown<R.clues.length?'visible':'hidden';};draw();
    setTalk((k===0&&g.say?g.say+'<br>':'')+'🔍 '+R.clues[0],(k===0&&g.say)?[g.say,R.clues[0]]:[R.clues[0]]);
    w.querySelector('#more').onclick=()=>{shown++;draw();speak(R.clues[shown-1],true);};
    const o=opts(R.opts,(i,b)=>{if(i===R.a){w.querySelector('.lid').classList.add('open');const out=w.querySelector('.out');out.textContent=R.opts[i].e;out.classList.add('on');
        b.classList.add('ok');good(R.ok);k++;setDots(g.rounds.length,k);setTimeout(round,2900);}
      else{miss++;logMiss(g.name,R.opts[i].n+' замість '+R.opts[R.a].n);bad(b);const h=R.hint||G.T.think;fact('🤔 '+h);speak(h);
        if(shown<R.clues.length){shown++;draw();}if(miss>=2)showHand(o.children[R.a]);}});
    w.appendChild(o);idle(()=>{if(shown<R.clues.length)showHand(w.querySelector('#more'));else showHand(o.children[R.a]);});};
  round();}

/* ---- TF: Правда чи вигадка ---- */
function stTf(g,a){let k=0;const w=el('div','tfw');a.appendChild(w);setTalk(g.say,[g.say,g.items[0].t]);
  const next=()=>{if(k>=g.items.length){stageDone();return;}const it=g.items[k];setDots(g.items.length,k);
    w.innerHTML=`<div class="tfcard"><span class="emo">${it.e}</span><div>${it.t}</div><button class="say">🔊</button></div>
     <div class="tfb"><button class="tfy">✅ Правда</button><button class="tfn">❌ Вигадка</button></div>`;
    w.querySelector('.say').onclick=()=>speak(it.t,true);if(k>0)speak(it.t);
    const ans=(v,b)=>{if(v===it.a){b.classList.add('ok');good(it.why);k++;setTimeout(next,3200);}
      else{logMiss(g.name,it.t);bad(b);fact('🤔 '+(it.hint||G.T.think));speak(it.hint||G.T.think);}};
    w.querySelector('.tfy').onclick=e=>ans(true,e.currentTarget);w.querySelector('.tfn').onclick=e=>ans(false,e.currentTarget);
    idle(()=>showHand(w.querySelector(it.a?'.tfy':'.tfn')));};
  next();}

/* ---- COUNT: Перелічи ---- */
function stCount(g,a){let k=0;const w=el('div','cntw');a.appendChild(w);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];setDots(g.rounds.length,k);setTalk(R.q);let c=0;
    w.innerHTML=`<div class="pile"></div><div class="cnum">Порахували: <b>0</b></div>`;const pile=w.querySelector('.pile');
    R.pos.forEach(([x,y],i)=>{const b=el('button','cube emo',R.e);b.style.left=x+'%';b.style.top=y+'%';b.style.zIndex=100-Math.round(y);
      b.onclick=()=>{if(b.dataset.n)return;c++;b.dataset.n=c;b.classList.add('on');b.insertAdjacentHTML('beforeend',`<i>${c}</i>`);tone([[400+c*60,.08]]);w.querySelector('.cnum b').textContent=c;};pile.appendChild(b);});
    const nums=shuffle([R.pos.length-1,R.pos.length,R.pos.length+1]).map(n=>({e:'',n:String(n)}));
    const o=opts(nums,(i,b)=>{if(+nums[i].n===R.pos.length){b.classList.add('ok');good(R.ok);k++;setTimeout(round,2800);}
      else{logMiss(g.name,R.q.replace(/<[^>]+>/g,'')+' → '+nums[i].n);bad(b);fact('🤔 '+G.T.recount);speak(G.T.recount);}},'num');w.appendChild(o);
    idle(()=>{const nx=[...pile.children].find(x=>!x.dataset.n);showHand(nx||o.children[nums.findIndex(n=>+n.n===R.pos.length)]);});};

/* ---- ORDER: Порядок дій ---- */
function stOrder(g,a){let k=0;const w=el('div','ordw');a.appendChild(w);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];setDots(g.rounds.length,k);setTalk(R.q);let n=0;
    w.innerHTML='<div class="ordc"></div>';const box=w.querySelector('.ordc');

      b.onclick=()=>{if(b.classList.contains('ok'))return;if(s.i===n){n++;b.classList.add('ok');b.querySelector('.no').textContent=n;tone([[500+n*90,.12]]);
          if(n===R.steps.length){good(R.ok);k++;setTimeout(round,3000);}}
        else{logMiss(g.name,s.t+' (крок '+(s.i+1)+', а треба '+(n+1)+')');bad(b);const h=R.hint||G.T.first;fact('🤔 '+h);speak(h);}};box.appendChild(b);});
    idle(()=>{const nx=[...box.children].find(b=>!b.classList.contains('ok')&&b.textContent.includes(R.steps[n].t));showHand(nx);});};

/* ---- MOUSE: Тренажер миші ---- */
function stMouse(g,a){let k=0;const w=el('div','msw');a.appendChild(w);
  w.innerHTML=`<div class="desk"><button class="ico"><span class="emo">${g.icon2||'📁'}</span><span>${g.label||'Мої малюнки'}</span></button><div class="win"><div class="wt">${g.label||'Мої малюнки'}<b>✖</b></div><div class="wc emo">${g.inside||'🌻 🐱 🏠'}</div></div></div>`;
  const ico=w.querySelector('.ico'),win=w.querySelector('.win');let hovT=null;
  const step=()=>{if(k>=g.steps.length){stageDone();return;}setDots(g.steps.length,k);setTalk(g.steps[k].q);idle(()=>showHand(ico));};
  const done=()=>{good(g.steps[k].ok);k++;setTimeout(step,2600);};
  ico.addEventListener('pointerenter',()=>{if(g.steps[k]&&g.steps[k].act==='hover'){ico.classList.add('hov');clearTimeout(hovT);hovT=setTimeout(()=>{if(g.steps[k]&&g.steps[k].act==='hover')done();},700);}});
  ico.addEventListener('pointerleave',()=>{ico.classList.remove('hov');clearTimeout(hovT);});
  let lastT=0,clickT=null;
  ico.addEventListener('click',()=>{const s=g.steps[k];if(!s)return;const now=Date.now(),dbl=now-lastT<450;lastT=now;
    if(s.act==='hover'){ico.classList.add('hov');setTimeout(()=>{if(g.steps[k]===s)done();},300);return;}
    if(s.act==='click'){clearTimeout(clickT);clickT=setTimeout(()=>{if(g.steps[k]===s){ico.classList.add('sel');done();}},460);if(dbl){clearTimeout(clickT);fact('🤔 '+G.T.once);speak(G.T.once);logMiss(g.name,'двічі замість одного разу');}return;}
    if(s.act==='dbl'){if(dbl){ico.classList.add('sel');win.classList.add('on');done();}else{clearTimeout(clickT);clickT=setTimeout(()=>{if(g.steps[k]===s&&!win.classList.contains('on')){fact('🤔 '+G.T.twice);speak(G.T.twice);logMiss(g.name,'один клік замість двох');}},700);}}});
  win.querySelector('b').onclick=()=>win.classList.remove('on');
  step();}

/* ---- CRAFT: Майстерня (поклади деталі на місця) ---- */
function stCraft(g,a){const w=el('div','crw');w.innerHTML=`<div class="tray" id="ctray"></div><div class="board" style="${g.bg?'background:'+g.bg:''}"></div>`;a.appendChild(w);
  const tray=w.querySelector('#ctray'),board=w.querySelector('.board');let left=g.parts.length;setTalk(g.say);setDots(g.parts.length,0);
  const slots=g.slots.map((s,j)=>{const d=el('div','slot',`<span class="emo ghost">${s.e}</span><b>${s.label||''}</b>`);d.dataset.j=j;Object.assign(d.style,{left:s.x+'%',top:s.y+'%',width:s.w+'%',height:s.h+'%'});
    d.querySelector('.ghost').style.fontSize=(s.fs||5)+'rem';board.appendChild(d);return d;});
  let sel=null;
  shuffle(g.parts).forEach(p=>{const c=el('div','chip',`<span class="emo">${p.e}</span>${p.n}`);c._p=p;tray.appendChild(c);c.addEventListener('pointerdown',ev=>drag(ev,c));});
  slots.forEach(s=>s.addEventListener('click',()=>{if(sel)put(sel,s);}));
  function put(c,s){const p=c._p,j=+s.dataset.j;if(sel)sel.classList.remove('sel');sel=null;
    if(p.to===j){s.classList.add('fill');s.querySelector('.ghost').textContent=p.e;s.querySelector('.ghost').classList.remove('ghost');c.remove();left--;setDots(g.parts.length,g.parts.length-left);good(p.why||G.T.ok);
      if(!left){board.classList.add('alive');if(g.final)setTimeout(()=>{fact('✨ '+g.final);speak(g.final);},2200);setTimeout(stageDone,g.final?5200:2400);}}
    else{logMiss(g.name,p.n+' → '+(g.slots[j].label||j));bad(s);const h=p.hint||G.T.think;fact('🤔 '+h);speak(h);}}
  function drag(ev,c){ev.preventDefault();const sx=ev.clientX,sy=ev.clientY;let gh=null,over=null;
    const mv=e=>{if(!gh&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){gh=c.cloneNode(true);gh.classList.add('ghost');document.body.appendChild(gh);c.style.opacity=.3;}
      if(!gh)return;gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';
      over=slots.find(b=>{const r=b.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom&&!b.classList.contains('fill');})||null;slots.forEach(b=>b.classList.toggle('hot',b===over));};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(gh){gh.remove();c.style.opacity='';slots.forEach(b=>b.classList.remove('hot'));if(over)put(c,over);}else{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');tone([[520,.06]]);}};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);}
  idle(()=>{const c=tray.querySelector('.chip');if(c)showHand(c,slots[c._p.to]);});}

/* ---- FACE: Склади смайлик ---- */
const FP={eyes:{dot:'<circle cx="70" cy="85" r="10"/><circle cx="130" cy="85" r="10"/>',happy:'<path d="M58 88 Q70 72 82 88" class="ln"/><path d="M118 88 Q130 72 142 88" class="ln"/>',wide:'<circle cx="70" cy="82" r="15" fill="#fff" stroke="#2b2100" stroke-width="5"/><circle cx="70" cy="82" r="6"/><circle cx="130" cy="82" r="15" fill="#fff" stroke="#2b2100" stroke-width="5"/><circle cx="130" cy="82" r="6"/>',closed:'<path d="M58 84 Q70 94 82 84" class="ln"/><path d="M118 84 Q130 94 142 84" class="ln"/>'},
 mouth:{smile:'<path d="M60 125 Q100 165 140 125" class="ln"/>',frown:'<path d="M65 150 Q100 118 135 150" class="ln"/>',o:'<ellipse cx="100" cy="140" rx="14" ry="18" fill="#2b2100"/>',flat:'<path d="M70 138 L130 138" class="ln"/>'},
 brows:{none:'',up:'<path d="M55 58 Q70 46 85 58" class="ln"/><path d="M115 58 Q130 46 145 58" class="ln"/>',sad:'<path d="M55 62 L85 52" class="ln"/><path d="M115 52 L145 62" class="ln"/>',angry:'<path d="M55 52 L85 64" class="ln"/><path d="M115 64 L145 52" class="ln"/>'}};

function faceSvg(f){return `<svg viewBox="0 0 200 200" class="face"><circle cx="100" cy="100" r="92" fill="#ffd43b" stroke="#e67700" stroke-width="6"/><g fill="#2b2100">${FP.brows[f.brows]}${FP.eyes[f.eyes]}${FP.mouth[f.mouth]}</g></svg>`;}
function stFace(g,a){let k=0;const w=el('div','facew');a.appendChild(w);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];setDots(g.rounds.length,k);setTalk(R.q);
    const f={eyes:'dot',mouth:'flat',brows:'none'};
    w.innerHTML=`<div class="fl"><div class="fview"></div><div class="who emo">${R.e||''}</div></div><div class="fr"></div>`;
    const view=w.querySelector('.fview'),fr=w.querySelector('.fr');const draw=()=>view.innerHTML=faceSvg(f);draw();
    Object.keys(FP).forEach(cat=>{const row=el('div','frow',`<b>${FN[cat]}</b>`);Object.keys(FP[cat]).forEach(v=>{const t={eyes:'dot',mouth:'flat',brows:'none'};t[cat]=v;
      const b=el('button','fopt'+(f[cat]===v?' on':''),faceSvg(t));b.onclick=()=>{f[cat]=v;row.querySelectorAll('.fopt').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw();tone([[600,.06]]);};row.appendChild(b);});fr.appendChild(row);});
    const ok=el('button','big','Готово ✓');ok.style.fontSize='1.1rem';fr.appendChild(ok);
    ok.onclick=()=>{const wrong=Object.keys(R.target).filter(c=>f[c]!==R.target[c]);
      if(!wrong.length){view.classList.add('pop');good(R.ok);k++;setTimeout(round,3000);}
      else{logMiss(g.name,R.q.replace(/<[^>]+>/g,'')+' ('+wrong.map(c=>FN[c]).join(', ')+')');bad(ok);const h=R.hints&&R.hints[wrong[0]]||G.T.think;fact('🤔 '+h);speak(h);}};
    idle(()=>{const c=Object.keys(R.target).find(c=>f[c]!==R.target[c]);if(c){const row=[...fr.querySelectorAll('.frow')][Object.keys(FP).indexOf(c)];showHand(row.children[1+Object.keys(FP[c]).indexOf(R.target[c])]);}else showHand(ok);});};
  round();}

/* ---- GALLERY: Перегляд зображень ---- */
function stGallery(g,a){let k=0,i=0;const w=el('div','galw');a.appendChild(w);
  w.innerHTML=`<button class="gnav" id="gp">◀</button><div class="gframe"><div class="gpic emo"></div><div class="gcap"></div><div class="gnum"></div></div><button class="gnav" id="gn">▶</button>`;
  const pic=w.querySelector('.gpic'),cap=w.querySelector('.gcap'),num=w.querySelector('.gnum'),fr=w.querySelector('.gframe');
  const show=d=>{i=(i+d+g.pics.length)%g.pics.length;const P=g.pics[i];pic.textContent=P.e;fr.style.background=P.bg||'#fff';cap.textContent=P.n;num.textContent=(i+1)+' / '+g.pics.length;
    if(!reduce)pic.animate([{transform:`translateX(${d*40}px)`,opacity:0},{transform:'none',opacity:1}],{duration:300});};
  w.querySelector('#gp').onclick=()=>show(-1);w.querySelector('#gn').onclick=()=>show(1);
  let sx=null;fr.addEventListener('pointerdown',e=>sx=e.clientX);fr.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60)show(dx<0?1:-1);else pick();});
  const ask=()=>{if(k>=g.asks.length){stageDone();return;}setDots(g.asks.length,k);setTalk(g.asks[k].q);
    idle(()=>showHand(i===g.asks[k].k?fr:w.querySelector('#gn')));};
  function pick(){const A=g.asks[k];if(!A)return;if(i===A.k){fr.classList.add('okf');setTimeout(()=>fr.classList.remove('okf'),900);good(A.ok);k++;setTimeout(ask,2600);}
    else{logMiss(g.name,A.q.replace(/<[^>]+>/g,'')+' → '+g.pics[i].n);bad(fr);fact('🤔 '+G.T.flip);speak(G.T.flip);}}
  show(0);ask();}

/* ---- LISTEN: Хто це звучить? ---- */
function stListen(g,a){let k=0;const w=el('div','lsw');a.appendChild(w);setTalk(g.say,[]);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];setDots(g.rounds.length,k);
    w.innerHTML=`<button class="play">🔊<span>Послухати</span></button>`;const pl=w.querySelector('.play');pl.onclick=()=>{speak(R.snd,true);pl.classList.add('ping');setTimeout(()=>pl.classList.remove('ping'),600);};
    if(k===0)speak([g.say,R.snd]);else setTimeout(()=>speak(R.snd),300);
    const o=opts(R.opts,(i,b)=>{if(i===R.a){b.classList.add('ok');good(R.ok);k++;setTimeout(round,2800);}else{logMiss(g.name,R.snd+' → '+R.opts[i].n);bad(b);fact('🤔 '+G.T.listen);speak(G.T.listen);}});w.appendChild(o);

/* ---- TYPE: Друкуємо на клавіатурі ---- */
const KB=[['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х','Ї'],['Ф','І','В','А','П','Р','О','Л','Д','Ж','Є'],['Я','Ч','С','М','И','Т','Ь','Б','Ю','Ґ',"'"]];
function stType(g,a){let k=0;const lines=[''];const w=el('div','tyw');a.appendChild(w);
  w.innerHTML=`<div class="page"></div><div class="kb">${KB.map(r=>`<div class="kr">${r.map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}
   <div class="kr"><button class="key wide" data-k="SPACE">Пропуск</button><button class="key mid" data-k="BACK">⌫</button><button class="key mid" data-k="ENTER">Enter ↵</button></div></div>`;
  const page=w.querySelector('.page');const keyEl=c=>w.querySelector(`.key[data-k="${c}"]`);
  const draw=()=>{page.innerHTML=lines.map((l,i)=>`<div class="ln">${l.replace(/ /g,'&nbsp;')}${i===lines.length-1?'<i class="caret"></i>':''}</div>`).join('');};
  const need=()=>{const T=g.tasks[k];if(!T)return null;if(T.key)return T.key;const cur=lines[lines.length-1];const want=T.want;
    if(!want.startsWith(cur))return 'BACK';return want[cur.length]===' '?'SPACE':want[cur.length]||null;};
  const glow=()=>{w.querySelectorAll('.key.next').forEach(x=>x.classList.remove('next'));const n=need();if(n&&keyEl(n))keyEl(n).classList.add('next');};
  const task=()=>{if(k>=g.tasks.length){stageDone();return;}setDots(g.tasks.length,k);setTalk(g.tasks[k].q);if(g.tasks[k].glow!==false)glow();idle(()=>{glow();showHand(keyEl(need()));});};
  const press=c=>{const T=g.tasks[k];if(!T)return;const n=need();const b=keyEl(c);if(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),150);}
    if(c!==n&&!(c==='BACK')){logMiss(g.name,'клавіша '+(c==='SPACE'?'Пропуск':c)+' замість '+(n==='SPACE'?'Пропуск':n));sNo();fact('🤔 '+G.T.key);if(keyEl(n)){keyEl(n).classList.add('next');showHand(keyEl(n));}return;}
    tone([[700,.04]]);
    if(c==='BACK'){lines[lines.length-1]=lines[lines.length-1].slice(0,-1);}else if(c==='ENTER'){lines.push('');}else lines[lines.length-1]+=(c==='SPACE'?' ':c);
    draw();glow();
    if((T.key&&c===T.key)||(!T.key&&lines[lines.length-1]===T.want)){good(T.ok);k++;w.querySelectorAll('.key.next').forEach(x=>x.classList.remove('next'));setTimeout(task,2400);}};
  w.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k));
  const onKey=e=>{if(!document.body.contains(w)){removeEventListener('keydown',onKey);return;}let c=e.key;if(c===' ')c='SPACE';else if(c==='Enter')c='ENTER';else if(c==='Backspace')c='BACK';else c=c.toUpperCase();
    if(c==='SPACE'||c==='ENTER'||c==='BACK'||KB.flat().includes(c)){e.preventDefault();press(c);}};addEventListener('keydown',onKey);
  draw();task();}

/* ---- GRID: Робот на клітинках ---- */
const DIR={'↑':[0,-1],'↓':[0,1],'←':[-1,0],'→':[1,0]};
function stGrid(g,a){let k=0;const w=el('div','grw');a.appendChild(w);
  const level=()=>{if(k>=g.levels.length){stageDone();return;}const L=g.levels[k];setDots(g.levels.length,k);setTalk(L.q);const prog=[];let busy=false,fails=0;
    w.innerHTML=`<div class="grid2" style="grid-template-columns:repeat(${L.w},1fr);aspect-ratio:${L.w}/${L.h}"></div><div class="gside"><div class="prog"></div>
      <div class="arrows">${Object.keys(DIR).map(d=>`<button class="arr" data-d="${d}">${d}</button>`).join('')}</div>
      <div class="gbt"><button class="hintbtn" id="gdel">⌫ Стерти</button><button class="big" id="grun" style="font-size:1.1rem">▶ Пуск</button></div></div>`;
    const gr=w.querySelector('.grid2'),pg=w.querySelector('.prog');
    for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){const c=el('div','cell');c.dataset.xy=x+','+y;
      if((L.walls||[]).some(([a,b])=>a===x&&b===y))c.innerHTML=`<span class="emo">${L.wallE||'🌳'}</span>`,c.classList.add('wall');
      if(L.goal[0]===x&&L.goal[1]===y)c.innerHTML=`<span class="emo">${L.goalE||'🏁'}</span>`,c.classList.add('goal');gr.appendChild(c);}
    const bot=el('div','gbot',ROBOT);gr.appendChild(bot);
    const place=(x,y)=>{bot.style.left=(x/L.w*100)+'%';bot.style.top=(y/L.h*100)+'%';bot.style.width=(100/L.w)+'%';bot.style.height=(100/L.h)+'%';};place(...L.start);
    const drawP=()=>{pg.innerHTML=prog.length?prog.map((d,i)=>`<span class="pc">${d}</span>`).join(''):`<span class="ph">${G.T.prog}</span>`;};drawP();
    w.querySelectorAll('.arr').forEach(b=>b.onclick=()=>{if(busy||prog.length>=14)return;prog.push(b.dataset.d);tone([[520,.06]]);drawP();});
    w.querySelector('#gdel').onclick=()=>{if(busy)return;prog.pop();drawP();};
    w.querySelector('#grun').onclick=async()=>{if(busy||!prog.length)return;busy=true;let [x,y]=L.start;place(x,y);const pcs=pg.querySelectorAll('.pc');
      for(let i=0;i<prog.length;i++){pcs.forEach(p=>p.classList.remove('cur'));pcs[i].classList.add('cur');const [dx,dy]=DIR[prog[i]];const nx=x+dx,ny=y+dy;
        await new Promise(r=>setTimeout(r,reduce?150:520));
        if(nx<0||ny<0||nx>=L.w||ny>=L.h||(L.walls||[]).some(([a,b])=>a===nx&&b===ny)){bad(bot);fails++;logMiss(g.name,'рівень '+(k+1)+': врізався');const h=L.hint||G.T.bump;fact('🤔 '+h);speak(h);
          setTimeout(()=>{place(...L.start);busy=false;pcs.forEach(p=>p.classList.remove('cur'));if(fails>=2)showSol();},900);return;}
        x=nx;y=ny;place(x,y);tone([[440+i*30,.05]]);}
      if(x===L.goal[0]&&y===L.goal[1]){gr.querySelector('.goal').classList.add('got');good(L.ok);k++;setTimeout(level,3000);}
      else{fails++;logMiss(g.name,'рівень '+(k+1)+': не дійшов');sNo();fact('🤔 '+G.T.notyet);speak(G.T.notyet);setTimeout(()=>{place(...L.start);busy=false;pcs.forEach(p=>p.classList.remove('cur'));if(fails>=2)showSol();},900);}};
    const showSol=()=>{if(!L.sol)return;fact('💡 Підказка: '+L.sol.join(' '));};
    idle(()=>{if(L.sol){const want=L.sol[prog.length]||null;if(want&&prog.every((d,i)=>d===L.sol[i]))showHand(w.querySelector(`.arr[data-d="${want}"]`));else if(!want)showHand(w.querySelector('#grun'));else showHand(w.querySelector('#gdel'));}});};
  level();}

/* ---- BLOCKS: Скретч-блоки на сцені ---- */
const XB={f:{t:'➡ крок',c:'mv'},l:{t:'↺ ліворуч',c:'tn'},r:{t:'↻ праворуч',c:'tn'},p:{t:'✏ олівець',c:'pn'},s:{t:'🐾 штамп',c:'pn'},

      const seq=[];for(let i=0;i<prog.length;i++){const b=prog[i];if(/^r\d/.test(b)){const n=+b[1],nx=prog[i+1];if(nx&&!/^r\d/.test(nx)){for(let j=0;j<n;j++)seq.push([nx,i+1]);i++;}continue;}seq.push([b,i]);}

    sel('.evs','e',v=>ev=v);sel('.acs','a',v=>ac=v);sel('.rps','r',v=>rep=+v);
    const fire=e=>{if(ev===e&&ac){let n=0;const max=rep==null?1:rep||3;const blink=()=>{show(ac);tone([[700,.08]]);setTimeout(()=>{n++;if(n<max){show('empty');setTimeout(blink,250)}},450)};blink();}else{show('empty');fact('Micro:Bit нічого не робить — для цієї події немає команди.');}};

/* ======== 4th-grade stage types ======== */
function KBhtml(digits){const rows=(digits?[['1','2','3','4','5','6','7','8','9','0']]:[]).concat(KB);
  return `<div class="kb">${rows.map(r=>`<div class="kr">${r.map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}
   <div class="kr"><button class="key wide" data-k="SPACE">Пропуск</button><button class="key mid" data-k="BACK">⌫</button><button class="key mid" data-k="ENTER">Enter ↵</button></div></div>`;}
const norm=s=>String(s).toUpperCase().replace(/[’'`]/g,"'").replace(/\s+/g,' ').trim();

/* ---- ANSWER: відповідь з клавіатури ---- */
function stAnswer(g,a){let k=0,txt='',miss=0;const w=el('div','anw');a.appendChild(w);
  const q=()=>{if(k>=g.items.length){stageDone();return;}const it=g.items[k];txt='';miss=0;setDots(g.items.length,k);setTalk(it.q);
    w.innerHTML=`<div class="anq">${it.e?`<span class="emo">${it.e}</span>`:''}<div class="aline"><span class="atx"></span><i class="caret"></i></div><button class="big" id="aok">Перевірити ↵</button></div>${KBhtml(g.digits||it.digits||it.a.some(x=>/\d/.test(x)))}`;
    draw();w.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k));w.querySelector('#aok').onclick=()=>press('ENTER');
    idle(()=>{const want=norm(it.a[0]);const nx=want[txt.length];if(norm(txt)===want)showHand(w.querySelector('#aok'));else if(want.startsWith(norm(txt))&&nx)showHand(w.querySelector(`.key[data-k="${nx===' '?'SPACE':nx}"]`));});};
  const draw=()=>{w.querySelector('.atx').textContent=txt;};
  const press=c=>{const it=g.items[k];if(!it)return;const b=w.querySelector(`.key[data-k="${c}"]`);if(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),150);}
    if(c==='BACK'){txt=txt.slice(0,-1);draw();return;}if(c==='SPACE'){txt+=' ';draw();return;}
    if(c!=='ENTER'){if(txt.length<28){txt+=c;tone([[700,.03]]);draw();}return;}
    if(!txt.trim())return;
    if(it.a.some(x=>norm(x)===norm(txt))){w.querySelector('.aline').classList.add('okl');good(it.ok);k++;setTimeout(q,2800);}
    else{miss++;logMiss(g.name,it.q.replace(/<[^>]+>/g,'')+' → '+txt);bad(w.querySelector('.aline'));const want=norm(it.a[0]);
      const h=miss===1?(it.hint||G.T.think):miss===2?G.T.first1+' «'+want.slice(0,1)+'»':G.T.answer+' '+want;fact('🤔 '+h);speak(miss<3?(miss===1?(it.hint||G.T.think):G.T.first1x):G.T.answerx);
      if(miss>=3){txt='';draw();}}};
  const onKey=e=>{if(!document.body.contains(w)){removeEventListener('keydown',onKey);return;}let c=e.key;if(c===' ')c='SPACE';else if(c==='Enter')c='ENTER';else if(c==='Backspace')c='BACK';else c=c.toUpperCase();
    if(c==='SPACE'||c==='ENTER'||c==='BACK'||KB.flat().includes(c)||/^[0-9]$/.test(c)){e.preventDefault();press(c);}};addEventListener('keydown',onKey);
  q();}

/* ---- CHOOSE: вибір з поясненням ---- */
function stChoose(g,a){let k=0;const w=el('div','chw');a.appendChild(w);
  const q=()=>{if(k>=g.items.length){stageDone();return;}const it=g.items[k];setDots(g.items.length,k);setTalk(k===0&&g.say?g.say:it.q,k===0&&g.say?[g.say,it.q]:it.q);

    order.forEach(i=>{const b=el('button','chopt',it.opts[i]);b.onclick=()=>{if(i===it.a){b.classList.add('ok');good(it.why);k++;setTimeout(q,3600);}
      else{miss++;logMiss(g.name,it.q.replace(/<[^>]+>/g,'')+' → '+it.opts[i]);bad(b);b.disabled=true;b.classList.add('off');const h=it.hint||G.T.think;fact('🤔 '+h);speak(h);}};box.appendChild(b);});

/* ---- CTX: контекстне меню / «Зберегти як» ---- */
function stCtx(g,a){let k=0;const w=el('div','cxw');a.appendChild(w);
  const round=()=>{if(k>=g.rounds.length){stageDone();return;}const R=g.rounds[k];setDots(g.rounds.length,k);setTalk(R.q);let phase='open',miss=0;
    const win=R.win||'browser';
    w.innerHTML=`<div class="mwin ${win}"><div class="mbar">${win==='browser'?`<span class="dots3">● ● ●</span><span class="addr">${R.addr||'https://'}</span><button class="kebab" title="Налаштування">⋮</button>`:`<span>📁 ${R.title||'Провідник'}</span>`}</div>
      <div class="mbody"><button class="tgt"><span class="emo">${R.target.e}</span><span>${R.target.n}</span></button>${R.extra||''}</div></div>`;
    const tgt=w.querySelector('.tgt'),mw=w.querySelector('.mwin');let pressT=null;
    const err=h=>{miss++;logMiss(g.name,R.q.replace(/<[^>]+>/g,'')+' → '+h);sNo();const t=R.hint||G.T.think;fact('🤔 '+t);speak(t);};
    const openMenu=(items,x,y,onPick)=>{mw.querySelectorAll('.cmenu').forEach((m,i)=>{if(!m.dataset.keep)m.remove();});const m=el('div','cmenu');
      items.forEach((t,i)=>{const b=el('button','ci',t+(R.subOf===i&&R.sub?' ▸':''));b.onclick=e=>{e.stopPropagation();onPick(i,b,m);};m.appendChild(b);});
      const r=mw.getBoundingClientRect();m.style.left=Math.min(x-r.left,r.width-260)+'px';m.style.top=Math.min(y-r.top,r.height-items.length*44-10)+'px';mw.appendChild(m);return m;};
    const main=(x,y)=>{if(phase!=='open')return;phase='menu';tone([[600,.05]]);
      const m=openMenu(R.menu,x,y,(i,b,m)=>{if(i!==R.pick){bad(b);err(R.menu[i]);return;}b.classList.add('ok');
        if(R.sub){m.dataset.keep=1;const rb=b.getBoundingClientRect();openMenu(R.sub.menu,rb.right-10,rb.top,(j,b2)=>{if(j!==R.sub.pick){bad(b2);err(R.sub.menu[j]);return;}b2.classList.add('ok');next();});}
        else next();});idle(()=>showHand(m.children[R.pick]));};
    const next=()=>{mw.querySelectorAll('.cmenu').forEach(m=>m.remove());if(!R.dialog){win_ok();return;}phase='dlg';const D=R.dialog;let sel=-1;
      const d=el('div','dlg',`<div class="dt">💾 ${D.title||'Збереження'}</div><div class="dcols"><div class="dl">${D.folders.map((f,i)=>`<button class="df" data-i="${i}">${f}</button>`).join('')}</div>
        <div class="dr"><div>Ім'я файлу:</div><div class="fname">${D.name||''}</div><button class="big" id="dsave" style="font-size:1rem">Зберегти</button></div></div>`);mw.appendChild(d);
      d.querySelectorAll('.df').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;d.querySelectorAll('.df').forEach(x=>x.classList.remove('on'));b.classList.add('on');tone([[520,.05]]);});
      d.querySelector('#dsave').onclick=()=>{if(sel!==D.pick){err(sel<0?'папку не вибрано':D.folders[sel]);bad(d.querySelector('.dl'));if(miss>=2)showHand(d.querySelectorAll('.df')[D.pick]);return;}d.remove();win_ok();};
      idle(()=>showHand(sel===D.pick?d.querySelector('#dsave'):d.querySelectorAll('.df')[D.pick]));};
    const win_ok=()=>{phase='done';if(R.after)mw.querySelector('.mbody').insertAdjacentHTML('beforeend',`<div class="after">${R.after}</div>`);good(R.ok);k++;setTimeout(round,3200);};
    if(R.open==='kebab'){w.querySelector('.kebab').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();main(r.left-200,r.bottom);};tgt.onclick=()=>err('клік по зображенню');idle(()=>showHand(w.querySelector('.kebab')));}
    else{tgt.addEventListener('contextmenu',e=>{e.preventDefault();main(e.clientX,e.clientY);});
      tgt.addEventListener('pointerdown',e=>{if(e.button!==0)return;const x=e.clientX,y=e.clientY;pressT=setTimeout(()=>main(x,y),650);});
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>tgt.addEventListener(ev,()=>clearTimeout(pressT)));
      tgt.addEventListener('click',()=>{if(phase==='open'){fact('🖱️ '+G.T.rclick);speak(G.T.rclick);}});
      const kb=w.querySelector('.kebab');if(kb)kb.onclick=()=>err('меню браузера');
      idle(()=>{if(phase==='open'){showHand(tgt);fact('🖱️ '+G.T.rclick);}});}};
  round();}

  idle(()=>{const i=g.rows.findIndex((r,j)=>v[j]!==r.v);if(i<0)showHand(w.querySelector('#chk'));else showHand(cols[i].querySelector(`.bbtn button[data-d="${v[i]<g.rows[i].v?1:-1}"]`));});}

    html+=`<h3>Останній урок: ${new Date(S0.t).toLocaleString('uk-UA')} · тривалість ${fmtT(dur)} ${S0.fin?'· ✅ пройдено до кінця':'· ⏸ не завершено'}</h3>
    <table><tr><th>Зупинка</th><th>Час</th></tr>${G.stages.map(g=>`<tr><td>${g.icon} ${g.name}</td><td>${S0.st[g.name]!=null?fmtT(S0.st[g.name]):'—'}</td></tr>`).join('')}</table>
    <h3>Де клас помилявся найчастіше</h3>${tm.length?`<table>${tm.slice(0,8).map(([k,v])=>`<tr><td>${k}</td><td style="width:40%"><span class="bar" style="width:${v/mx*80}%"></span>${v}</td></tr>`).join('')}</table>`:'<p>Жодної помилки — тема засвоєна легко. Можна ускладнити наступного разу.</p>'}
    <h3>Настрій класу у фіналі</h3><p style="font-size:1.1rem">😀 ${S0.mood[0]} &nbsp; 🙂 ${S0.mood[1]} &nbsp; 🤔 ${S0.mood[2]}</p>`;
    if(last.length>1){html+=`<h3>Усі проходження (${last.length})</h3><table><tr><th>Коли</th><th>Тривалість</th><th>Помилок</th><th>Настрій</th><th>Кінець</th></tr>${last.map(x=>`<tr><td>${new Date(x.t).toLocaleString('uk-UA')}</td><td>${fmtT(((x.end||x.t)-x.t)/1000)}</td><td>${Object.values(x.miss).reduce((a,b)=>a+b,0)}</td><td>😀${x.mood[0]} 🙂${x.mood[1]} 🤔${x.mood[2]}</td><td>${x.fin?'✅':'—'}</td></tr>`).join('')}</table>`;}}
  html+=`<div class="row"><button id="tpCsv">📋 Скопіювати таблицею</button><button id="tpClr">🗑️ Очистити статистику</button><button id="tpX">✖ Закрити</button></div>`;
  box.innerHTML=html;$('#tp').classList.add('on');
  $('#tpX').onclick=()=>$('#tp').classList.remove('on');
  $('#tpClr').onclick=()=>{if(confirm('Видалити всю статистику цього уроку на цьому комп’ютері?')){LOG=[];SES=null;lsave();tpOpen();}};
  $('#tpCsv').onclick=()=>{const rows=[['Коли','Тривалість, с','Помилок','😀','🙂','🤔','Завершено','Найважче']];
    LOG.forEach(x=>{const tm=Object.entries(x.miss).sort((a,b)=>b[1]-a[1]);rows.push([new Date(x.t).toLocaleString('uk-UA'),Math.round(((x.end||x.t)-x.t)/1000),Object.values(x.miss).reduce((a,b)=>a+b,0),x.mood[0],x.mood[1],x.mood[2],x.fin?'так':'ні',tm[0]?tm[0][0]:''])});
    const t=rows.map(r=>r.join('\t')).join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>fact('📋 Скопійовано — вставте в Google Таблицю'),()=>fact('Не вдалося скопіювати'));};}
$('#tp').addEventListener('click',e=>{if(e.target.id==='tp')$('#tp').classList.remove('on');});
$('#bTeach').onclick=tpOpen;
if(G.year){const y=$('#bYear');y.href=G.year;y.style.display='flex';}
/* header */
$('#hClass').textContent=G.cls;$('#hTitle').textContent=G.title;drawBatt();
$('#bVoice').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.setAttribute('aria-pressed',voiceOn);if(!voiceOn){if(curA)curA.pause();if('speechSynthesis' in window)speechSynthesis.cancel();}};
$('#bSnd').onclick=e=>{sndOn=!sndOn;e.currentTarget.setAttribute('aria-pressed',sndOn);};
$('#bMap').onclick=openMap;
$('#bTeamB').onclick=e=>{TEAM.on=!TEAM.on;TEAM.score=[0,0];TEAM.cur=0;e.currentTarget.setAttribute('aria-pressed',TEAM.on);teamDraw();fact(TEAM.on?'👥 Командна гра: хід команди 🟣. Команди відповідають по черзі.':'Командну гру вимкнено');};
$('#bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
document.addEventListener('click',e=>{if(e.target.id==='sHint'&&hintFn)hintFn();});
intro();
})();
</script>
</body>
</html>
