/* Великий екран: телевізійне табло «категорія × бали» → питання на весь екран → табло команд унизу */
:root{--bg:#0A1C2B;--tile:#123651;--tile2:#184566;--line:#24577D;--fg:#F4F8FB;--muted:#9DB8CC;--gold:#FFB703;--ok:#2EC27E;--bad:#FF5D5D;

.tb.minus{background:transparent!important;border:2px solid currentColor;padding:8px 12px}
/* scoreboard */
.scores{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:clamp(6px,1vw,14px)}
.sc{border-radius:14px;padding:clamp(8px,1.4vh,14px) 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#0A1C2B;font-weight:800;min-width:0}
.sc .nm{font-size:clamp(.9rem,1.5vw,1.35rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .pt{font-family:var(--fd);font-size:clamp(1.2rem,2.6vw,2.3rem);font-variant-numeric:tabular-nums}

.final{flex:1;display:grid;gap:20px;align-content:center;justify-items:center;text-align:center}
.final h1{font-family:var(--fd);font-size:clamp(2rem,5vw,4rem);margin:0}
.podium{display:flex;align-items:flex-end;gap:clamp(10px,2vw,28px);justify-content:center;width:100%;max-width:900px}
.pd{flex:1;display:grid;gap:8px;animation:rise 1s both}

canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.hint{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

];
const VALS=[100,200,300,400,500];
const DEF_TEAMS=[["🦊 Лисиці"],["🦉 Сови"],["🐺 Вовки"],["🐻 Ведмеді"]];
const QTIME=30;
let G=load()||fresh(3);
function fresh(n){const cells=[];CATS.forEach((c,ci)=>VALS.forEach((v,vi)=>cells.push(ci+"-"+vi)));const bonus=shuffle(cells.filter(k=>!k.endsWith("-0"))).slice(0,2);
  return{phase:"setup",n,names:DEF_TEAMS.map(x=>x[0]),score:[0,0,0,0],done:{},bonus,cur:null};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem("quiz8v1",JSON.stringify(G))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("quiz8v1"));return s&&s.names?s:null}catch(e){return null}}
const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let timer=null,left=QTIME,revealed=false,awarded=false;

function scores(bump){
  const s=$("#scores");if(G.phase==="setup"){s.innerHTML="";return}
  s.innerHTML=G.names.slice(0,G.n).map((nm,i)=>`<div class="sc c${i}${bump===i?" bump":""}"><span class="nm">${esc(nm)}</span><span class="pt">${G.score[i]}</span></div>`).join("");
}
function tools(){
  const t=$("#tools");
  if(G.phase==="setup"){t.innerHTML="";return}
  t.innerHTML=`${G.phase==="q"?'<button class="btn ghost" id="toBoard">◀ До табло</button>':""}<button class="btn ghost" id="fs" title="На весь екран">⛶</button>${G.phase==="board"?'<button class="btn ghost" id="fin">Фінал 🏆</button><button class="btn ghost" id="reset">Нова гра</button>':""}`;
  const fs=$("#fs");if(fs)fs.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
  const tb=$("#toBoard");if(tb)tb.onclick=toBoard;
  const fin=$("#fin");if(fin)fin.onclick=()=>{G.phase="final";save();render()};
  const rs=$("#reset");if(rs)rs.onclick=()=>{if(rs.dataset.sure){G=fresh(G.n);save();render()}else{rs.dataset.sure=1;rs.textContent="Точно? Натисніть ще раз"}};
}
function render(){tools();scores();
  if(G.phase==="setup")return setup();
  if(G.phase==="board")return board();
  if(G.phase==="q")return question();
  if(G.phase==="final")return final();
}
function setup(){
  main.innerHTML=`<div class="setup"><div class="box">
   <h1>Інфо-битва: загальна вікторина 8 класу</h1>
   <p>30 питань у 6 категоріях. Команди по черзі обирають категорію й бали, клас радиться і відповідає. Чим дорожче питання, тим складніше. Питання за 500 — «🔥 у тренді»: про те, що змінилося у світі останнім часом. Десь сховані два бонуси ×2.</p>
   <div class="cats">${CATS.map(c=>`<span>${c.ic} ${c.n}</span>`).join("")}</div>
   <div><div class="hint" style="margin-bottom:8px">Скільки команд?</div><div class="teamsel">${[2,3,4].map(k=>`<button data-n="${k}" aria-pressed="${G.n===k}">${k} команди</button>`).join("")}</div></div>
   <div class="names">${G.names.slice(0,G.n).map((nm,i)=>`<input id="tn${i}" value="${esc(nm)}" maxlength="18" aria-label="Назва команди ${i+1}" style="border-color:var(--t${i})">`).join("")}</div>
   <button class="btn" id="start" style="font-size:clamp(1.1rem,1.8vw,1.6rem);padding:14px 30px">Почати гру ▶</button>
   <p class="hint">Клавіші: Пробіл — показати відповідь, Esc — до табло. Гра зберігається в цьому браузері, тож оновлення сторінки її не зітре.</p>
  </div></div>`;
  main.querySelectorAll(".teamsel button").forEach(b=>b.onclick=()=>{readNames();G.n=+b.dataset.n;render()});
  $("#start").onclick=()=>{readNames();G.phase="board";save();render()};
}
function readNames(){for(let i=0;i<G.n;i++){const el=$("#tn"+i);if(el)G.names[i]=el.value.trim()||DEF_TEAMS[i][0]}}
function board(){
  let h=CATS.map(c=>`<div class="ch"><span class="ic">${c.ic}</span><b>${c.n}</b></div>`).join("");
  VALS.forEach((v,vi)=>CATS.forEach((c,ci)=>{const k=ci+"-"+vi,d=G.done[k];
    h+=d!=null?`<button class="cell won${d<0?"":" c"+d}" disabled style="${d<0?"":""}">${d<0?"—":esc(G.names[d])}</button>`
      :`<button class="cell" data-k="${k}" data-ic="${c.ic}" aria-label="${c.n}, ${v} балів">${v}${vi===4?'<span class="fire">🔥</span>':""}</button>`;}));
  main.innerHTML=`<div class="board">${h}</div>`;
  main.querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>openQ(b.dataset.k));
  if(Object.keys(G.done).length===30&&!G.endShown){G.endShown=true;save();setTimeout(()=>{G.phase="final";save();render()},600)}
}
function openQ(k){G.cur=k;G.phase="q";revealed=false;awarded=false;left=QTIME;save();render();startTimer()}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(revealed)return clearInterval(timer);left=Math.max(0,left-.25);paintTimer();if(left<=0){clearInterval(timer)}},250)}
function paintTimer(){const i=$("#tbar i"),n=$("#tnum"),w=$("#tbar");if(!i)return;i.style.width=(left/QTIME*100)+"%";n.textContent=Math.ceil(left);w.classList.toggle("low",left<=10);if(left<=0)n.textContent="⏰"}
function question(){
  const [ci,vi]=G.cur.split("-").map(Number),c=CATS[ci],q=c.qs[vi],val=VALS[vi]*(G.bonus.includes(G.cur)?2:1),isB=G.bonus.includes(G.cur);
  const picKey=revealed&&q.picA?q.picA:q.pic;
  const pic=picKey?`<div class="pic">${PIC[picKey]}</div>`:`<div class="pic"><span class="emo" aria-hidden="true">${q.emo||c.ic}</span></div>`;
  let opts="";
  if(q.t==="mc"){const order=G.order&&G.order[G.cur]||(G.order=Object.assign(G.order||{},{[G.cur]:shuffle(q.o.map((_,i)=>i))}))[G.cur];
    opts=`<div class="opts">${order.map((oi,pos)=>`<div class="opt o${pos}${revealed?(oi===q.a?" win":" dim"):""}">${SH[pos]}<span>${esc(q.o[oi])}</span></div>`).join("")}</div>`;}
  else if(q.t==="tf")opts=`<div class="opts">${[["Правда",1],["Неправда",0]].map(([t,col],j)=>`<div class="opt o${col}${revealed?(j===q.a?" win":" dim"):""}">${SH[col]}<span>${t}</span></div>`).join("")}</div>`;
  main.innerHTML=`<div class="qv">
    <div class="qhead"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag">${c.ic} ${c.n}</span><span class="tag val">${val}</span>${q.trend?'<span class="tag trend">🔥 У тренді</span>':""}${isB?'<span class="tag bonus">⭐ Бонус ×2</span>':""}</div>
      ${q.t==="open"&&!revealed?'<span class="tag">🗣️ Відповідаємо вголос</span>':""}</div>
    <div class="qbody"><h2 class="qtext">${esc(q.q)}</h2>${pic}</div>
    ${opts}
    ${revealed?`<div class="reveal">${q.ans?`Відповідь: <b>${esc(q.ans)}</b><br>`:""}${esc(q.why)}</div>`:""}
    <div class="ctrl">
      ${revealed?`<div class="award"><span class="lbl">Бали:</span>${G.names.slice(0,G.n).map((nm,i)=>`<button class="tb c${i}" data-t="${i}">+${val} ${esc(nm)}</button>`).join("")}<button class="btn ghost" data-t="-1">Ніхто</button>${G.names.slice(0,G.n).map((nm,i)=>`<button class="tb minus" style="color:var(--t${i})" data-m="${i}" title="Штраф ${esc(nm)}">−${val/2}</button>`).join("")}</div>`
      :`<div style="display:flex;gap:12px;align-items:center;flex:1"><div class="timer" id="tbar"><i style="width:${left/QTIME*100}%"></i></div><span class="tnum" id="tnum">${Math.ceil(left)}</span>
        <button class="btn ghost" id="more">+15 с</button></div><button class="btn" id="rev">Показати відповідь</button>`}
    </div></div>`;
  paintTimer();
  const rev=$("#rev");if(rev)rev.onclick=doReveal;
  const more=$("#more");if(more)more.onclick=()=>{left=Math.min(QTIME+30,left+15);paintTimer();startTimer()};
  main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>award(+b.dataset.t,val));
  main.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m;G.score[i]-=val/2;save();scores(i);b.disabled=true});
}
function doReveal(){revealed=true;clearInterval(timer);question()}
function award(t,val){G.done[G.cur]=t;if(t>=0)G.score[t]+=val;const bump=t;G.phase="board";G.cur=null;save();render();if(bump>=0){scores(bump);burst(bump)}}
function toBoard(){clearInterval(timer);G.phase="board";G.cur=null;save();render()}
function final(){
  const R=G.names.slice(0,G.n).map((n,i)=>({n,i,s:G.score[i]})).sort((a,b)=>b.s-a.s);
  const order=[R[1],R[0],R[2]].filter(Boolean);const H={0:"clamp(140px,32vh,320px)",1:"clamp(100px,22vh,220px)",2:"clamp(70px,15vh,150px)"};
  main.innerHTML=`<div class="final"><h1>🏆 Переможці Інфо-битви</h1><div class="podium">${order.map(r=>{const place=R.indexOf(r);return `<div class="pd" style="animation-delay:${(2-place)*.6}s"><div class="who">${esc(r.n)}</div><div class="pts">${r.s} балів</div><div class="blk c${r.i}" style="height:${H[place]}">${place+1}</div></div>`}).join("")}</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" id="back">◀ До табло</button><button class="btn" id="new">Нова гра</button></div></div>`;
  $("#back").onclick=()=>{G.phase="board";save();render()};$("#new").onclick=()=>{G=fresh(G.n);save();render()};
  confetti();
}
function burst(i){const el=document.querySelectorAll(".sc")[i];if(!el)return;const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top,60,1400)}
function confetti(x0,y0,n=200,ms=4500){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#FF6B6B","#4DABF7","#69DB7C","#FFA94D","#FFB703","#ffffff"];
  const P=Array.from({length:n},()=>x0!=null?{x:x0,y:y0,vx:(Math.random()-.5)*10,vy:-4-Math.random()*8,r:0,vr:(Math.random()-.5)*.4,c:cols[Math.random()*6|0],w:6+Math.random()*5,h:9+Math.random()*6}
    :{x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*6|0],w:7+Math.random()*6,h:10+Math.random()*8});
  const t0=performance.now();(function f(t){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=x0!=null?.3:.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t-t0<ms)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(t0);
}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(G.phase==="q"&&e.code==="Space"&&!revealed){e.preventDefault();doReveal()}
  if(G.phase==="q"&&e.key==="Escape")toBoard();});
if(G.phase==="q"){revealed=false;left=QTIME;startTimer()}
render();
</script>
