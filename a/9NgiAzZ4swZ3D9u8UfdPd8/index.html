<script>"use strict";

function confetti(){if(reduce)return;const c=$("#conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#e0233f","#ffb020","#2f9e4f","#2b86c8","#fff"];
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,a:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*5|0]}));let f=0;
 (function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.beginPath();x.arc(p.x+Math.sin(p.a)*8,p.y,p.s/2,0,7);x.fill()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

 if(kind==="emoji"){x.font="24px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(val,W/2,H/2+1)}
 else{let fs=22;x.font=`900 ${fs}px Arial Black, Arial, sans-serif`;while(x.measureText(val).width>W-2&&fs>8){fs--;x.font=`900 ${fs}px Arial Black, Arial, sans-serif`}x.textAlign="center";x.textBaseline="middle";x.fillText(val,W/2,H/2+1)}
 const d=x.getImageData(0,0,W,H).data,m=[];for(let i=0;i<W*H;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2],a=d[i*4+3];m.push(a>60&&(r+g+b)/3<170?1:0)}return m}
function shares(mask,seed){let s=seed||12345;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};const A=[],B=[];
 mask.forEach(v=>{const p=rnd()<.5?0:1;A.push(p);B.push(v?1-p:p)});return [A,B]}
function drawShare(cv,sh,color){cv.width=W*2*SP;cv.height=H*2*SP;const x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);x.fillStyle=color;
 for(let y=0;y<H;y++)for(let i=0;i<W;i++){const p=sh[y*W+i],X=i*2*SP,Y=y*2*SP;if(p===0){x.fillRect(X,Y,SP,SP);x.fillRect(X+SP,Y+SP,SP,SP)}else{x.fillRect(X+SP,Y,SP,SP);x.fillRect(X,Y+SP,SP,SP)}}}
const LEVELS=[["emoji","🎄","Ялинка"],["emoji","⭐","Зірка"],["word","ДИВО","Слово"]];
function envs(){$("#envs").innerHTML=["Картка 1","Картка 2","Картка 3","Моя листівка"].map((t,i)=>`<button class="env${i===S.lv?" on":""}${S.done[i]?" done":""}" data-i="${i}" ${i===0||S.done[i-1]?"":"disabled"}><span>${S.done[i]?"💌":i===3?"✏️":"🃏"}</span>${t}</button>`).join("");
 $("#envs").querySelectorAll(".env").forEach(b=>b.onclick=()=>{S.lv=+b.dataset.i;save();render()})}
function render(){envs();S.lv<3?puzzle():own()}
// ===== Наклади картки =====
function overlayHtml(id){return `<div class="ov" id="${id}"><canvas class="sh a"></canvas><canvas class="sh m" aria-hidden="true"></canvas><canvas class="sh b" tabindex="0" aria-label="Верхня картка: тягни її на нижню"></canvas><span class="hand" aria-hidden="true">👆</span></div>`}
function setupOverlay(id,mask,seed,onDone,startOff){const box=$("#"+id),a=box.querySelector(".a"),b=box.querySelector(".b");const[A,B]=shares(mask,seed);
 drawShare(a,A,"#1b2333");drawShare(b,B,"#1b2333");const mc=box.querySelector(".m");mc.width=W*2*SP;mc.height=H*2*SP;{const x=mc.getContext("2d");x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--cls").trim()||"#c2255c";for(let y=0;y<H;y++)for(let i=0;i<W;i++)if(mask[y*W+i])x.fillRect(i*2*SP,y*2*SP,2*SP,2*SP)}const h=a.getBoundingClientRect().height||150;box.style.height=Math.round(h*1.8)+"px";let off=startOff===0?{x:0,y:0}:{x:Math.round(h*.15),y:Math.round(h*.72)};let done=false;
 const place=()=>{b.style.transform=`translate(${off.x}px,${off.y}px)`;const near=Math.abs(off.x)<10&&Math.abs(off.y)<10;box.classList.toggle("near",near)};place();
 let drag=null;b.onpointerdown=e=>{if(done)return;drag={x:e.clientX-off.x,y:e.clientY-off.y};b.setPointerCapture(e.pointerId);box.querySelector(".hand").hidden=true};
 b.onpointermove=e=>{if(!drag)return;off={x:e.clientX-drag.x,y:e.clientY-drag.y};place()};
 const end=()=>{if(!drag)return;drag=null;if(Math.abs(off.x)<14&&Math.abs(off.y)<14){off={x:0,y:0};place();done=true;box.classList.add("magic");onDone&&onDone()}};
 b.onpointerup=end;b.onpointercancel=end;
 b.onkeydown=e=>{const k={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(!k||done)return;e.preventDefault();off={x:off.x+k[0],y:off.y+k[1]};place();if(Math.abs(off.x)<14&&Math.abs(off.y)<14){drag={};end()}};
 return {snap(){off={x:0,y:0};place();done=true;box.classList.add("magic")}}}
function puzzle(){const L=LEVELS[S.lv],done=S.done[S.lv];
 $("#stage").innerHTML=`<h2>🃏 Картка ${S.lv+1}</h2><p class="tip">${done?`Ось що було заховано: <b>${L[0]==="emoji"?L[1]+" "+L[2]:L[1]}</b>!`:"👆 Візьми <b>верхню картку</b> пальцем або мишкою й посунь точно на нижню. Коли крапки зійдуться — з'явиться малюнок!"}</p>
 ${overlayHtml("ov1")}<div class="fbx" id="fbx"></div>
 <div class="row" style="justify-content:center"><button class="btn" id="next" ${done?"":"hidden"}>${S.lv<2?"Наступна картка 🃏":"Зроби свою листівку ✏️"}</button></div>`;
 const o=setupOverlay("ov1",maskFrom(L[0],L[1]),101+S.lv*77,()=>{S.done[S.lv]=true;save();envs();confetti();$("#fbx").innerHTML="✨ Магія! Бачиш, що там?";$("#next").hidden=false},done?0:null);
 if(done)o.snap();
 $("#next").onclick=()=>{S.lv++;save();render()}}
// ===== Своя листівка =====
const PICS=["🎄","⭐","❤️","🎁","⛄","🔔","🕯️","❄️"];
function own(){$("#stage").innerHTML=`<h2>✏️ Моя чарівна листівка</h2><p class="tip">Обери малюнок <b>або</b> напиши коротке слово (до 6 літер). Програма зробить дві картки: окремо вони — просто крапки!</p>
 <div class="pics">${PICS.map(p=>`<button data-p="${p}" class="${S.own===p?"on":""}">${p}</button>`).join("")}</div>
 <div class="row" style="justify-content:center;margin:10px 0"><input type="text" id="word" maxlength="6" placeholder="СЛОВО" value="${PICS.includes(S.own)?"":S.own}" style="max-width:200px;text-transform:uppercase;font-size:22px;text-align:center"><button class="btn" id="mk">Зробити</button></div>
 <div id="res"></div>`;
 $("#stage").querySelector(".pics").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.own=b.dataset.p;save();own();make()};
 $("#mk").onclick=()=>{const w=$("#word").value.trim().toUpperCase();if(!w)return;S.own=w;save();make()};if(S.own)make()}
function make(){const isPic=PICS.includes(S.own);const mask=maskFrom(isPic?"emoji":"word",S.own);const seed=Math.floor(Math.random()*1e6)+1;
 $("#res").innerHTML=`<div class="two"><div><div class="lab">Картка А</div><canvas id="cA" class="solo"></canvas></div><div><div class="lab">Картка Б</div><canvas id="cB" class="solo"></canvas></div></div>
 <p class="tip" style="text-align:center">Окремо — нічого не видно. А тепер наклади!</p>${overlayHtml("ov2")}
 <div class="row" style="justify-content:center"><button class="btn" id="show">🖥 Показати на великому екрані</button></div>`;
 const[A,B]=shares(mask,seed);drawShare($("#cA"),A,"#1b2333");drawShare($("#cB"),B,"#1b2333");
 setupOverlay("ov2",mask,seed,()=>{if(!S.done[3]){S.done[3]=true;save();envs()}confetti()});
 $("#show").onclick=()=>{$("#bigBox").innerHTML=overlayHtml("ov3");$("#bigShow").hidden=false;setupOverlay("ov3",mask,seed,()=>confetti())}}
$("#bigClose").onclick=()=>{$("#bigShow").hidden=true};
$("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("infohab-theme",JSON.stringify(document.documentElement.dataset.theme))}catch(e){}};
try{const th=JSON.parse(localStorage.getItem("infohab-theme"));if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
</script>
</body>
