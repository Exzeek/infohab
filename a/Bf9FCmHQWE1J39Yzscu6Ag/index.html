<script>
{
const IC={"серце":["01010","11111","11111","01110","00100"],"смайлик":["00000","01010","00000","10001","01110"],"сумний":["00000","01010","00000","01110","10001"],"так":["00000","00001","00010","10100","01000"],"ні":["10001","01010","00100","01010","10001"],"стрілка вгору":["00100","01110","10101","00100","00100"],"будиночок":["00100","01110","11111","01110","01110"],"сніжинка":["10101","01110","11111","01110","10101"]};
const DIG={0:["111","101","101","101","111"],1:["010","110","010","010","111"],2:["111","001","111","100","111"],3:["111","001","111","001","111"],4:["101","101","111","001","001"],5:["111","100","111","001","111"],6:["111","100","111","101","111"],7:["111","001","010","010","010"],8:["111","101","111","101","111"],9:["111","101","111","001","111"],"-":["000","000","111","000","000"]};
const EV={start:"при старті",A:"при натисканні A",B:"при натисканні B",shake:"при струшуванні"};
const ACT={icon:"показати піктограму",num:"показати число",dice:"показати випадкове 1–6",temp:"показати температуру",light:"показати рівень світла",pause:"пауза",clear:"очистити екран",loop:"повторити … разів"};
const TASKS=[
 {t:"Серце музею",d:"Коли плату вмикають, хай вона покаже <b>серце</b>. Блоки: <code>при старті</code> → <code>показати піктограму</code> (серце).",c:p=>has(p.start,a=>a.k==="icon"&&a.v==="серце")},
 {t:"Настрій відвідувача",d:"Кнопка <b>A</b> показує <b>смайлик</b>, кнопка <b>B</b> — <b>сумний</b> смайлик.",c:p=>has(p.A,a=>a.k==="icon"&&a.v==="смайлик")&&has(p.B,a=>a.k==="icon"&&a.v==="сумний")},
 {t:"Кубик Сортика",d:"Коли плату <b>струснути</b>, вона показує <b>випадкове число від 1 до 6</b>.",c:p=>has(p.shake,a=>a.k==="dice")},
 {t:"Термометр зали",d:"Кнопка <b>A</b> показує <b>температуру</b>. Посунь повзунок температури й перевір!",c:p=>has(p.A,a=>a.k==="temp")},
 {t:"Блимання (повторення)",d:"<code>При старті</code> → <code>повторити 3 рази</code>, а всередині: серце, пауза, очистити екран, пауза.",c:p=>has(p.start,a=>a.k==="loop"&&a.n==3&&a.in.some(b=>b.k==="icon")&&a.in.some(b=>b.k==="clear")&&a.in.some(b=>b.k==="pause"))},
 {t:"Нічник-датчик",d:"Кнопка <b>B</b> показує <b>рівень світла</b>. Затемни повзунок світла й натисни B.",c:p=>has(p.B,a=>a.k==="light")}
];
function has(list,f){return (list||[]).some(a=>f(a)||(a.k==="loop"&&a.in.some(f)))}
const REAL=[
 {t:"Відкрий MakeCode",d:"У браузері відкрий <b>makecode.microbit.org</b> → <b>Новий проєкт</b>, назви його <b>Сортик</b>. Акаунт не потрібен."},
 {t:"Серце при старті",d:"З розділу <b>Основне</b> перетягни <code>показати піктограму</code> в <code>при запуску</code>. Подивись на плату-симулятор зліва."},
 {t:"Кнопка A",d:"З розділу <b>Введення</b> візьми <code>при натисканні кнопки A</code> і додай <code>показати число</code>. Натисни A на симуляторі."},
 {t:"Повторення",d:"З розділу <b>Цикли</b> візьми <code>повторити 4 рази</code> і зроби, щоб серце блимало. Покажи вчителеві!"}
];
let S={cur:0,ok:{},prog:{start:[]},sel:"start",selLoop:null,real:{}};
try{const s=JSON.parse(localStorage.getItem("mbit4")||"null");if(s&&s.prog)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("mbit4",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const leds=$("#leds");leds.innerHTML=Array.from({length:25},()=>'<div class="led"></div>').join("");
const L=[...leds.children];
function draw(rows){rows.forEach((r,y)=>[...r].forEach((c,x)=>L[y*5+x].classList.toggle("on",c==="1")))}
const blank=["00000","00000","00000","00000","00000"];
function digitRows(ch){const d=DIG[ch]||DIG[0];return d.map(r=>"0"+r+"0")}
let runId=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function showNum(n,id){const s=String(n);for(const ch of s){if(id!==runId)return;draw(digitRows(ch));await sleep(s.length>1?650:500)}}
async function exec(list,id){for(const a of list){if(id!==runId)return;
 if(a.k==="icon")draw(IC[a.v]);else if(a.k==="clear")draw(blank);else if(a.k==="pause")await sleep(+a.n||500);
 else if(a.k==="num")await showNum(a.n,id);else if(a.k==="dice")await showNum(1+Math.floor(Math.random()*6),id);
 else if(a.k==="temp")await showNum($("#tmp").value,id);else if(a.k==="light")await showNum($("#lig").value,id);
 else if(a.k==="loop"){for(let i=0;i<(+a.n||1);i++){await exec(a.in,id);if(id!==runId)return}}
 await sleep(120)}}
function fire(ev){const id=++runId;exec(S.prog[ev]||[],id)}
$("#run").onclick=()=>{draw(blank);fire("start")};$("#bA").onclick=()=>fire("A");$("#bB").onclick=()=>fire("B");$("#shake").onclick=()=>fire("shake");
["tmp","lig"].forEach(k=>$("#"+k).oninput=e=>$("#"+k+"O").textContent=e.target.value);
function newAct(k){return k==="icon"?{k,v:"серце"}:k==="num"?{k,n:5}:k==="pause"?{k,n:500}:k==="loop"?{k,n:3,in:[]}:{k}}
function pal(){
 $("#palE").innerHTML=Object.entries(EV).map(([k,v])=>`<button class="blk ev" data-ev="${k}">${v}</button>`).join("");
 $("#palA").innerHTML=Object.entries(ACT).map(([k,v])=>`<button class="blk ${k==="loop"?"loop":"act"}" data-a="${k}">${v}</button>`).join("");
 document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{const k=b.dataset.ev;if(!S.prog[k])S.prog[k]=[];S.sel=k;S.selLoop=null;save();prog()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(!S.sel||!S.prog[S.sel]){S.prog.start=S.prog.start||[];S.sel="start"}
  const a=newAct(b.dataset.a);const list=S.selLoop!=null&&S.prog[S.sel][S.selLoop]&&S.prog[S.sel][S.selLoop].k==="loop"?S.prog[S.sel][S.selLoop].in:S.prog[S.sel];
  if(a.k==="loop"&&list!==S.prog[S.sel]){return}list.push(a);if(a.k==="loop")S.selLoop=S.prog[S.sel].length-1;save();prog()});
}
function actHTML(a,path){const opt=Object.keys(IC).map(n=>`<option${n===a.v?" selected":""}>${n}</option>`).join("");
 const ctl=a.k==="icon"?`<select data-p="${path}" data-f="v" aria-label="Піктограма">${opt}</select>`:a.k==="num"?`<input type="number" min="0" max="99" value="${a.n}" data-p="${path}" data-f="n" aria-label="Число" style="width:70px">`:a.k==="pause"?`<select data-p="${path}" data-f="n" aria-label="Пауза">${[250,500,1000].map(n=>`<option value="${n}"${n==a.n?" selected":""}>${n} мс</option>`).join("")}</select>`:a.k==="loop"?`<input type="number" min="1" max="9" value="${a.n}" data-p="${path}" data-f="n" aria-label="Скільки разів" style="width:60px">`:"";
 const name=a.k==="loop"?"повторити":ACT[a.k];
 return `<div class="ab${a.k==="loop"?" loop":""}"><span>${name}</span>${ctl}${a.k==="loop"?"<span>разів</span>":""}<span class="sp"></span><button data-del="${path}" aria-label="Видалити блок">✕</button>${a.k==="loop"?`<div class="inner${S.selLoop!=null&&path===S.sel+"."+S.selLoop?" sel":""}" data-loop="${path}">${a.in.length?a.in.map((b,j)=>actHTML(b,path+"."+j)).join(""):'<span style="opacity:.85;font-size:15px">натисни сюди, а потім блоки-дії</span>'}</div>`:""}</div>`}
function get(path){const p=path.split(".");let list=S.prog[p[0]],o=null;for(let i=1;i<p.length;i++){o=list[+p[i]];if(i<p.length-1)list=o.in}return{o,list,idx:+p[p.length-1]}}
function prog(){const keys=Object.keys(S.prog);
 $("#prog").innerHTML=keys.length?keys.map(k=>`<div class="evb"><header><span>${EV[k]}</span><button data-dev="${k}" aria-label="Видалити подію">✕</button></header><div class="slot${S.sel===k&&S.selLoop==null?" sel":""}" data-slot="${k}">${S.prog[k].length?S.prog[k].map((a,i)=>actHTML(a,k+"."+i)).join(""):'<span class="empty">порожньо — додай блоки-дії</span>'}</div></div>`).join(""):'<p class="empty">Програма порожня.</p>';
 document.querySelectorAll("[data-slot]").forEach(s=>s.onclick=e=>{if(e.target!==s&&!e.target.classList.contains("empty"))return;S.sel=s.dataset.slot;S.selLoop=null;save();prog()});
 document.querySelectorAll("[data-loop]").forEach(s=>s.onclick=e=>{if(e.target.closest("button,select,input"))return;e.stopPropagation();const p=s.dataset.loop.split(".");S.sel=p[0];S.selLoop=+p[1];save();prog()});
 document.querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{const{o}=get(c.dataset.p);o[c.dataset.f]=c.dataset.f==="v"?c.value:+c.value;save()});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();const{list,idx}=get(b.dataset.del);list.splice(idx,1);S.selLoop=null;save();prog()});
 document.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>{delete S.prog[b.dataset.dev];if(S.sel===b.dataset.dev){S.sel=null;S.selLoop=null}save();prog()});
}
const JOKES=["Чому робот не застудився? Бо має антивірус! 😄","Сортик сказав: «Мої світлодіоди сяють від радості!»","Що їсть робот на сніданок? Мікросхемки з чипсами! 🤖"];
function mission(){const t=TASKS[S.cur];$("#mT").textContent="Завдання "+(S.cur+1)+": "+t.t;$("#mD").innerHTML=t.d;
 $("#steps").innerHTML=TASKS.map((x,i)=>`<button class="${S.ok[i]?"ok":""}" aria-current="${i===S.cur}" data-s="${i}" aria-label="Завдання ${i+1}">${S.ok[i]?"⭐":i+1}</button>`).join("");
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.s;save();mission();$("#fb").hidden=true})}
$("#chk").onclick=()=>{const f=$("#fb");f.hidden=false;if(TASKS[S.cur].c(S.prog)){S.ok[S.cur]=true;f.className="fb ok";f.textContent="⭐ Чудово! Запусти плату й подивись, як працює. "+(Object.keys(S.ok).length===TASKS.length?JOKES[Math.floor(Math.random()*3)]:"");const nx=TASKS.findIndex((t,i)=>!S.ok[i]);save();mission();if(nx>=0&&nx!==S.cur)setTimeout(()=>{S.cur=nx;save();mission()},1600)}else{f.className="fb no";f.textContent="🤔 Ще не все. Прочитай завдання ще раз: потрібна правильна подія й правильний блок."}};
$("#clr").onclick=()=>{S.prog={start:[]};S.sel="start";S.selLoop=null;save();prog();draw(blank)};
function real(){$("#real").innerHTML=`<p style="margin:0">Тепер — справжнє середовище програмування Micro:Bit. Виконай кроки й постав галочку.</p>`+REAL.map((r,i)=>`<div class="card"><h2>Крок ${i+1}. ${r.t}</h2><p style="margin:0">${r.d}</p><label><input type="checkbox" data-r="${i}"${S.real[i]?" checked":""}> Зроблено!</label></div>`).join("");
 document.querySelectorAll("[data-r]").forEach(c=>c.onchange=()=>{S.real[c.dataset.r]=c.checked;save()})}
function res(){const a=Object.keys(S.ok).length,b=Object.values(S.real).filter(Boolean).length,stars=a+b,max=TASKS.length+REAL.length;
 $("#res").innerHTML=`<h2>Мої зірки</h2><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(max-stars)}</div><p>Майстерня: <b>${a} з ${TASKS.length}</b> · Справжній MakeCode: <b>${b} з ${REAL.length}</b></p><p>${stars===max?"🏆 Ти справжній майстер роботів! "+JOKES[stars%3]:"Повертайся до завдань — зірок ще можна зібрати!"}</p><button class="btn" id="again">↺ Почати з початку</button>`;
 $("#again").onclick=()=>{S={cur:0,ok:{},prog:{start:[]},sel:"start",selLoop:null,real:{}};save();prog();mission();real();res();draw(blank)}}
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));["lab","real","res"].forEach(x=>$("#t-"+x).hidden=x!==t);if(t==="res")res()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
pal();prog();mission();real();draw(blank);
window.__mb={S,TASKS,fire,L};
}
</script>
</body></html>
