  else if(q.t==="order"){const pool=G.order[Q.k]||(G.order[Q.k]=shuffle(q.items.map((_,i)=>i)));
    opts=Q.done?`<div class="seq">${q.items.map((t,i)=>`<div class="si ok"><b>${i+1}</b>${esc(t)}</div>`).join("")}</div>`:
    `<div class="seq" id="seq">${Q.seq.length?Q.seq.map((ix,n)=>`<div class="si${Q.badPos&&Q.badPos.includes(n)?" bad":""}"><b>${n+1}</b>${esc(q.items[ix])}</div>`).join(""):'<div class="hint">Натискайте картки внизу в правильному порядку</div>'}</div>
     <div class="pool">${pool.filter(ix=>!Q.seq.includes(ix)).map(ix=>`<button class="pi" data-pi="${ix}">${esc(q.items[ix])}</button>`).join("")}</div>
     <div class="openbox"><button class="btn" id="ordChk" ${Q.seq.length===q.items.length?"":"disabled"}>Перевірити порядок</button><button class="btn ghost" id="ordReset">Скинути</button></div>`;}
  else if(q.t==="sort"){Q.put=Q.put||{};const left=q.items.map((_,i)=>i).filter(i=>Q.put[i]==null);const pool=(G.order[Q.k]||(G.order[Q.k]=shuffle(q.items.map((_,i)=>i)))).filter(i=>Q.put[i]==null);
    opts=`<div class="pool">${Q.done?"":pool.map(ix=>`<button class="pi${Q.pick===ix?" sel":""}" data-sp="${ix}">${esc(q.items[ix][0])}</button>`).join("")||'<span class="hint">Усе розкладено!</span>'}</div>
     <div class="bins">${q.buckets.map((b,bi)=>`<button class="bin" data-bin="${bi}" ${Q.done?"disabled":""}><b>${esc(b)}</b><span>${q.items.map((it,ix)=>Q.done?(it[1]===bi?`<i class="ok">${esc(it[0])}</i>`:""):(Q.put[ix]===bi?`<i class="${Q.badSort&&Q.badSort.includes(ix)?"bad":""}">${esc(it[0])}</i>`:"")).join("")}</span></button>`).join("")}</div>
     ${Q.done?"":`<div class="openbox"><span class="hint">Натисни файл, потім папку.</span><button class="btn" id="sortChk" ${left.length?"disabled":""}>Перевірити</button><button class="btn ghost" id="sortReset">Скинути</button></div>`}`;}
  else opts=Q.done?"":`<div class="openbox"><input id="ans" autocomplete="off" placeholder="Впишіть відповідь команди…" aria-label="Відповідь"><button class="btn" id="chk">Перевірити</button>
     <span class="hint">або вчитель:</span><button class="tb ok" id="okT">✔ Зараховано</button><button class="tb no" id="noT">✘ Ні</button></div>`;
  const who=Q.done?"":`<span class="tag who c${Q.team}">${Q.stealing?"Допомагає":"Відповідає"}: ${esc(G.names[Q.team])} · ${ST(Q.stealing?stealVal:val)}</span>`;
  const steal=!Q.done&&Q.stage==="steal"?`<div class="stealbar">😬 Помилка! <b>Допомога друзів за ${ST(stealVal)}:</b> ${G.names.slice(0,G.n).map((nm,i)=>i===Q.first?"":`<button class="tb c${i}" data-steal="${i}">${esc(nm)}</button>`).join("")}<button class="btn ghost" id="nobody">Ніхто — показати відповідь</button></div>`:"";
  main.innerHTML=`<div class="qv">
    <div class="qhead"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag">${c.ic} ${esc(c.n)}</span><span class="tag val">${ST(VALS[Q.vi])}</span>${q.trend?'<span class="tag trend">🔥 У тренді</span>':""}${Q.spec?`<span class="tag bonus">${SPEC[Q.spec].ic} ${SPEC[Q.spec].nm}</span>`:""}</div>${who}</div>
    <div class="qbody"><h2 class="qtext">${esc(q.q)} <button class="say" id="say" title="Прочитати вголос" aria-label="Прочитати питання вголос">🔊</button></h2>${pic}</div>
    ${opts}${steal}
    ${Q.msg?`<div class="flash ${Q.result==="ok"?"good":"badm"}">${Q.msg}</div>`:""}
    ${Q.done?`<div class="reveal">${q.ans?`Відповідь: <b>${esc(q.ans)}</b><br>`:""}${esc(q.why)}</div>`:""}
    <div class="ctrl">${Q.done?`<span></span><button class="btn" id="nx">Далі ▶</button>`:
      `<div style="display:flex;gap:12px;align-items:center;flex:1"><div class="timer" id="tbar"><i style="width:${Q.left/Q.max*100}%"></i></div><span class="tnum" id="tnum">${Math.ceil(Q.left)}</span><button class="btn ghost" id="more">+15 с</button>
       ${q.t==="mc"&&G.joker[Q.team]&&!Q.cut.size?`<button class="btn ghost" id="joker">🦉 Підказка</button>`:""}</div><button class="btn ghost" id="giveup">Показати відповідь</button>`}</div></div>`;
  paintTimer();
  main.querySelectorAll(".opt[data-o]").forEach(b=>b.onclick=()=>choose(+b.dataset.o,b));
  const chk=$("#chk");if(chk){const inp=$("#ans");inp.focus();const go=()=>{if(!inp.value.trim())return;checkOpen(q.acc.map(norm).includes(norm(inp.value)))};chk.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
    $("#okT").onclick=()=>checkOpen(true);$("#noT").onclick=()=>checkOpen(false);}
  main.querySelectorAll("[data-steal]").forEach(b=>b.onclick=()=>{Q.team=+b.dataset.steal;Q.stealing=true;Q.stage="q";Q.msg="";Q.left=Math.max(Q.left,15);render();startTimer()});
  main.querySelectorAll("[data-pi]").forEach(b=>b.onclick=()=>{Q.seq.push(+b.dataset.pi);Q.badPos=null;SND.pop();render()});
  const oc=$("#ordChk");if(oc)oc.onclick=()=>{const bad=Q.seq.map((ix,n)=>ix===n?-1:n).filter(n=>n>=0);if(!bad.length)return correct();Q.badPos=bad;const s=$("#seq");if(s)s.classList.add("shake");setTimeout(()=>{Q.seq=[];Q.badPos=null;wrong(null)},900);render()};
  const orr=$("#ordReset");if(orr)orr.onclick=()=>{Q.seq=[];Q.badPos=null;render()};
  main.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{Q.pick=+b.dataset.sp;SND.pop();render()});
  main.querySelectorAll("[data-bin]").forEach(b=>b.onclick=()=>{if(Q.pick==null)return;Q.put[Q.pick]=+b.dataset.bin;Q.pick=null;Q.badSort=null;SND.pop();render()});
  const sc=$("#sortChk");if(sc)sc.onclick=()=>{const bad=q.items.map((it,ix)=>Q.put[ix]===it[1]?-1:ix).filter(x=>x>=0);if(!bad.length)return correct();Q.badSort=bad;render();setTimeout(()=>{Q.put={};Q.badSort=null;wrong(null)},1000)};
  const sr=$("#sortReset");if(sr)sr.onclick=()=>{Q.put={};Q.pick=null;render()};
  const nb=$("#nobody");if(nb)nb.onclick=()=>finishQ(null);
  const gu=$("#giveup");if(gu)gu.onclick=()=>finishQ(null);
  const nx=$("#nx");if(nx)nx.onclick=next;
  const sy=$("#say");if(sy)sy.onclick=()=>speak(q.q+(q.t==="mc"?". Варіанти: "+(G.order[Q.k]||[]).map(i=>q.o[i]).join("; "):""));
  const more=$("#more");if(more)more.onclick=()=>{Q.left=Math.min(Q.max+30,Q.left+15);Q.max=Math.max(Q.max,Q.left);paintTimer();startTimer()};
  const jk=$("#joker");if(jk)jk.onclick=()=>{G.joker[Q.team]=0;const wr=shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a&&!Q.wrong.has(i))).slice(0,2);wr.forEach(i=>Q.cut.add(i));save();SND.pop();render()};
}
function choose(oi,btn){if(Q.done)return;if(oi===Q.q.a)return correct();btn.classList.add("shake");wrong(oi)}
function checkOpen(ok){if(ok)correct();else wrong(null)}
function correct(){clearInterval(timer);const t=Q.team;let pts=Q.stealing?Math.ceil(baseVal()/2):baseVal();
  G.score[t]+=pts;G.streak.forEach((_,i)=>{if(i!==t)G.streak[i]=Q.stealing?G.streak[i]:G.streak[i]});G.streak[t]++;
  let extra="";if(G.streak[t]>0&&G.streak[t]%3===0){G.score[t]+=1;extra=" 🔥 Серія з "+G.streak[t]+": ще ⭐!"}
  Q.result="ok";Q.msg=`✅ Правильно! ${esc(G.names[t])} отримує +${pts} ⭐.${extra}`;finishQ(t);SND.ok();burst(t);mascot("ok",["Ура!","Супер!","Молодці!","Браво!"][Math.random()*4|0]);}
function wrong(oi){const t=Q.team;if(oi!=null)Q.wrong.add(oi);G.streak[t]=0;
  let pen="";if(Q.spec==="bomb"&&!Q.stealing){G.score[t]-=VALS[Q.vi];pen=` 💣 Бомба: −${VALS[Q.vi]}.`;SND.boom()}else SND.bad();
  Q.result="bad";mascot("bad",["Ой!","Майже!","Спробуємо ще!"][Math.random()*3|0]);
  if(!Q.stealing&&G.n>1){Q.first=t;Q.stage="steal";Q.msg=`❌ Ні!${pen}`;clearInterval(timer);save();render();scores();return}
  Q.msg=`❌ Знову ні.${pen}`;finishQ(null);}
function finishQ(t){clearInterval(timer);Q.done=true;G.done[Q.k]=t==null?-1:t;save();render();scores(t==null?undefined:t)}
function next(){const base=Q?(Q.spec==="cat"?G.turn:G.turn):G.turn;G.turn=(base+1)%G.n;Q=null;G.phase="board";save();render()}

/* ---- фінал зі ставками ---- */
function bet(){
  main.innerHTML=`<div class="splash"><div class="spic">🎰</div><h2>Фінал зі ставками</h2>
   <p class="sptx">Кожна команда таємно вирішує, скільки балів ставить (не більше, ніж має). Правильна відповідь — ставка додається, помилка — віднімається. Відповідь пишуть на папірці!</p>
   <div class="bets">${G.names.slice(0,G.n).map((nm,i)=>{const mx=Math.max(0,G.score[i]);return `<div class="betc c${i}"><b>${esc(nm)}</b><span>має ${G.score[i]}</span>
     <input type="number" id="bet${i}" min="0" max="${mx}" step="50" value="${Math.min(G.bets[i]||0,mx)}" aria-label="Ставка ${esc(nm)}"><span class="hint" style="color:#0A1C2B">макс. ${mx}</span></div>`}).join("")}</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" id="back">◀ До табло</button><button class="btn" id="show">Показати фінальне питання</button></div></div>`;
  $("#back").onclick=()=>{G.phase="board";save();render()};
  $("#show").onclick=()=>{for(let i=0;i<G.n;i++){const v=Math.round(+$("#bet"+i).value||0);G.bets[i]=Math.max(0,Math.min(v,Math.max(0,G.score[i])))}G.fin=[null,null,null,null];G.phase="betq";save();SND.fan();render()};
}
function betq(){
  const all=G.fin.slice(0,G.n).every(x=>x!=null);
  main.innerHTML=`<div class="qv"><div class="qhead"><span class="tag bonus">🎰 Фінал зі ставками</span><span class="tag">Ставки: ${G.names.slice(0,G.n).map((n,i)=>esc(n)+" "+G.bets[i]).join(" · ")}</span></div>
   <div class="qbody"><h2 class="qtext">${esc(FINALQ.q)}</h2><div class="pic"><span class="emo">🧩</span></div></div>
   ${G.revF?`<div class="reveal">Відповідь: <b>${esc(FINALQ.ans)}</b><br>${esc(FINALQ.why)}</div>`:""}
   <div class="award" style="justify-content:center">${G.revF?G.names.slice(0,G.n).map((nm,i)=>`<span class="betc c${i}" style="flex-direction:row;gap:8px"><b>${esc(nm)}</b>
     <button class="tb ok" data-f="${i}" data-v="1" ${G.fin[i]!=null?"disabled":""}>✔ +${G.bets[i]}</button><button class="tb no" data-f="${i}" data-v="0" ${G.fin[i]!=null?"disabled":""}>✘ −${G.bets[i]}</button></span>`).join(""):`<button class="btn" id="revF">Показати відповідь</button>`}</div>
   <div class="ctrl"><span></span>${all?'<button class="btn" id="podium">Подіум 🏆</button>':""}</div></div>`;
  const r=$("#revF");if(r)r.onclick=()=>{G.revF=true;save();render()};
  main.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const i=+b.dataset.f,ok=b.dataset.v==="1";G.fin[i]=ok;G.score[i]+=ok?G.bets[i]:-G.bets[i];save();ok?SND.ok():SND.bad();render();scores(i)});
  const p=$("#podium");if(p)p.onclick=()=>{G.phase="final";save();render()};
}
function final(){
  const R=G.names.slice(0,G.n).map((n,i)=>({n,i,s:G.score[i]})).sort((a,b)=>b.s-a.s);
  const order=[R[1],R[0],R[2]].filter(Boolean),H=["clamp(140px,32vh,320px)","clamp(100px,22vh,220px)","clamp(70px,15vh,150px)"];
  main.innerHTML=`<div class="final"><h1>🏆 Молодці, команди!</h1><div class="podium">${order.map(r=>{const pl=R.indexOf(r);return `<div class="pd" style="animation-delay:${(2-pl)*.6}s"><div class="who">${esc(r.n)}</div><div class="pts">⭐ ${r.s}</div><div class="blk c${r.i}" style="height:${H[pl]}">${pl+1}</div></div>`}).join("")}</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" id="back">◀ До табло</button><button class="btn" id="new">Нова гра</button></div></div>`;
  $("#back").onclick=()=>{G.phase="board";save();render()};$("#new").onclick=()=>{G=fresh(G.n);save();render()};
  SND.fan();confetti();
}
function burst(i){const el=document.querySelectorAll(".sc")[i];if(!el)return;const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top,60,1400)}
function confetti(x0,y0,n=200,ms=4500){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#FF6B6B","#4DABF7","#69DB7C","#FFA94D","#FFB703","#ffffff"];
  const P=Array.from({length:n},()=>x0!=null?{x:x0,y:y0,vx:(Math.random()-.5)*10,vy:-4-Math.random()*8,r:0,vr:(Math.random()-.5)*.4,c:cols[Math.random()*6|0],w:6+Math.random()*5,h:9+Math.random()*6}
    :{x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*6|0],w:7+Math.random()*6,h:10+Math.random()*8});
  const t0=performance.now();(function f(t){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=x0!=null?.3:.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t-t0<ms)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(t0);
}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(G.phase!=="q"||!Q||Q.stage==="splash")return;
  if(Q.done&&(e.key==="Enter"||e.key==="Escape")){e.preventDefault();return next()}
  if(!Q.done&&/^[1-4]$/.test(e.key)&&Q.q.t==="mc"){const b=document.querySelectorAll(".opt")[+e.key-1];if(b&&!b.disabled)b.click()}
  if(!Q.done&&e.code==="Space"){e.preventDefault();const g=$("#giveup");if(g)g.click()}});
function speak(t){try{const S=window.speechSynthesis;if(!S)return;S.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="uk-UA";const v=S.getVoices().find(v=>/^uk/i.test(v.lang));if(v)u.voice=v;u.rate=.92;S.speak(u)}catch(e){}}
function mascot(kind,text){const m=$("#mascot");if(!m)return;m.className="mascot "+kind;m.querySelector(".face").textContent=kind==="ok"?"🤩":"😮";m.querySelector(".bub").textContent=text;void m.offsetWidth;m.classList.add("show");clearTimeout(m._t);m._t=setTimeout(()=>{m.classList.remove("show");m.querySelector(".face").textContent="🤖"},2200)}
if(G.phase==="q")G.phase="board";
render();
</script>

</body></html>
