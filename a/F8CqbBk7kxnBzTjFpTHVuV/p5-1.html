body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-body);font-weight:800;font-size:16px;border:0;border-radius:var(--r-md);padding:10px 18px;cursor:pointer;background:var(--class);color:#fff}

.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)} .fb.info{background:var(--surface-2);color:var(--ink)}
.muted{color:var(--muted);font-size:15px}
.mono{font-family:var(--f-mono);font-size:14px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}

.stat{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-size:13px}

.sendbox{border:2px dashed var(--send);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px}

.mstep{display:flex;gap:10px;align-items:flex-start;font-size:16px}

.win{border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}

.tool{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card,.win,.win-body{min-width:0}.card{grid-template-columns:minmax(0,1fr)}.tblwrap{max-width:100%;overflow-x:auto}
:root{--class:#c2255c}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--class:#f06595}}:root[data-theme="dark"]{--class:#f06595}
/* Міні-таблиця для етапу «sheet» */
