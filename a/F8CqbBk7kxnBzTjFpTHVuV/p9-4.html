const clean=s=>String(s).replace(/[|\n\r]+/g," ").trim();
function line(){ const sc=score(); const tasks=Q.map(x=>x.code+":"+Math.max(0,(ST.tries[x.code]||0)-(ST.ok[x.code]?1:0))+(ST.ok[x.code]?"":"н")).join(",");
  return ["v1",P.grade,P.title,clean(ST.cls),clean(ST.name),ST.attempt||1,"проєкт",sc.done?sc.grade:"—",(Math.round(sc.got*100)/100)+" з "+sc.tot,Math.round(sc.frac*100),sc.err,hm(Date.now()-ST.started),P.span,"проєкт",sc.done===Q.length?"завершено":"не завершено",tasks].join("|"); }
window.PRline=line;
$("#pFab").addEventListener("click",()=>{ $("#pSend").scrollIntoView({block:"center"}); });
render();
</script>
