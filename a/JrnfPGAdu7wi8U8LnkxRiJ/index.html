<script>
"use strict";
const KEY={А:["🍍","ананас"],Б:["🍌","банан"],В:["🐺","вовк"],Г:["🍄","гриб"],Ґ:["🔘","ґудзик"],Д:["🏠","дім"],Е:["🖥️","екран"],Є:["🦝","єнот"],Ж:["🐸","жаба"],З:["🐰","заєць"],И:["❄️","иній"],І:["🦃","індик"],Ї:["🍽️","їжа"],Й:["🥛","йогурт"],К:["🐱","кіт"],Л:["🦁","лев"],М:["🐭","миша"],Н:["🦏","носоріг"],О:["🦌","олень"],П:["🐧","пінгвін"],Р:["🐟","риба"],С:["🐘","слон"],Т:["🐯","тигр"],У:["🐍","удав"],Ф:["📷","фото"],Х:["🍞","хліб"],Ц:["🍬","цукерка"],Ч:["🐢","черепаха"],Ш:["🍫","шоколад"],Щ:["🛡️","щит"],Ь:["🔹","м'який знак"],Ю:["🍲","юшка"],Я:["🍎","яблуко"]};
const AB=Object.keys(KEY);
const CL={k2:["2","#d98a00","#ffc04d","🤖","Робот-дослідник"],k3:["3","#1e8fd6","#5ab6f0","🧒","Тимко"],k4:["4","#7a4fd8","#a98af0","🤖","Сортик"]};
const CK=CL[(location.hash||"").slice(1)]?(location.hash||"").slice(1):"k3";const C=CL[CK];
document.documentElement.style.setProperty("--cls-l",C[1]);document.documentElement.style.setProperty("--cls-d",C[2]);
document.getElementById("eyebrow").textContent="Інформатика · "+C[0]+" клас · Таємна пошта";

document.getElementById("storyTxt").innerHTML=`<b>${C[4]} знайшов три конверти від Святого Миколая!</b> Листи написані картинками. Кожна картинка — це <b>перша літера</b> свого слова: 🐱 кіт — це К. Розгадай листи, а потім напиши свій таємний лист!`;
const MSG=C[0]==="2"?["ПРИВІТ","ЧИТАЙ","Я ПОРУЧ"]:["ПРИВІТ","ПИШИ ЛИСТ","Я ЧЕКАЮ"];
const $=s=>document.querySelector(s);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const LS="myk-posta-"+CK;
function store(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
let S=load()||{lv:0,done:[false,false,false,false],pos:0,wish:""};
function save(){store(S)}
function confetti(){if(reduce)return;const c=$("#conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#e0233f","#ffb020","#2f9e4f","#2b86c8","#fff"];
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,a:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*5|0]}));let f=0;
 (function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.beginPath();x.arc(p.x+Math.sin(p.a)*8,p.y,p.s/2,0,7);x.fill()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
function envs(){$("#envs").innerHTML=["Лист 1","Лист 2","Лист 3","Мій лист"].map((t,i)=>`<button class="env${i===S.lv?" on":""}${S.done[i]?" done":""}" data-i="${i}" ${i===0||S.done[i-1]?"":"disabled"}><span>${S.done[i]?"💌":i===3?"✏️":"✉️"}</span>${t}</button>`).join("");
 $("#envs").querySelectorAll(".env").forEach(b=>b.onclick=()=>{S.lv=+b.dataset.i;S.pos=0;save();render()})}
function keyGrid(){$("#keyGrid").innerHTML=AB.map(l=>`<div class="kc"><span class="ke">${KEY[l][0]}</span><b>${l}</b><small>${KEY[l][1]}</small></div>`).join("")}
function render(){envs();S.lv<3?decode():writeOwn()}
function word(n){return `<span class="nm"><b>${n[0].toUpperCase()}</b>${n.slice(1)}</span>`}
// ===== Розшифрування =====
function decode(){const m=MSG[S.lv],done=S.done[S.lv];const chars=[...m];
 const idxs=chars.map((c,i)=>c===" "?-1:i).filter(i=>i>=0);if(done)S.pos=idxs.length;
 const cur=idxs[S.pos];
 $("#stage").innerHTML=`<h2>✉️ Лист ${S.lv+1}</h2>
 <p class="tip">${done?"Лист розгадано! Прочитай його вголос.":"👆 Подивись на картинку з рамкою. Як вона називається? Знайди внизу <b>першу літеру</b> й натисни."}</p>
 <div class="msg2">${chars.map((c,i)=>c===" "?`<span class="gap"></span>`:`<div class="tl${i===cur?" cur":""}${idxs.indexOf(i)<S.pos?" ok":""}"><span class="em">${KEY[c][0]}</span><span class="lt">${idxs.indexOf(i)<S.pos?c:"?"}</span>${i===cur&&!done?'<span class="hand" aria-hidden="true">👆</span>':""}</div>`).join("")}</div>
 ${done?`<div class="read">${m}</div><div class="row" style="justify-content:center"><button class="btn" id="next">${S.lv<2?"Наступний лист ✉️":"Напиши свій лист ✏️"}</button></div>`:
 `<div class="hintW" id="hintW">${KEY[chars[cur]][0]} — це ${word(KEY[chars[cur]][1])}</div><div class="kbd" id="kbd">${AB.map(l=>`<button data-l="${l}">${l}</button>`).join("")}</div><div id="fbx" class="fbx"></div>`}`;
 if(done){$("#next").onclick=()=>{S.lv++;S.pos=0;save();render();scrollTo({top:0,behavior:reduce?"auto":"smooth"})};return}
 $("#kbd").onclick=e=>{const b=e.target.closest("button");if(!b)return;const want=chars[cur];
  if(b.dataset.l===want){S.pos++;if(S.pos>=idxs.length){S.done[S.lv]=true;save();decode();confetti();return}save();decode()}
  else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);$("#fbx").innerHTML=`Майже! Послухай слово: ${word(KEY[want][1])}. Перша літера — велика.`}}}
// ===== Свій лист =====
function enc(t){return [...t].map(c=>c===" "?"   ":(KEY[c]?KEY[c][0]:c)).join(" ")}
function writeOwn(){const w=S.wish;
 $("#stage").innerHTML=`<h2>✏️ Мій таємний лист</h2>
 <p class="tip">Напиши Миколаю, про що мрієш (наприклад: <b>САНКИ</b>, <b>КНИГА</b>, <b>МИР</b>). Натискай літери — лист сам зашифрується картинками!</p>
 <div class="mine" id="mine">${w?[...w].map(c=>c===" "?`<span class="gap"></span>`:`<div class="tl ok"><span class="em">${KEY[c][0]}</span><span class="lt">${c}</span></div>`).join(""):'<span class="muted">Тут з\'явиться твій лист…</span>'}</div>
 <div class="kbd" id="kbd">${AB.map(l=>`<button data-l="${l}">${l}</button>`).join("")}<button data-l=" " class="wide">␣ пробіл</button><button data-l="⌫" class="wide">⌫ стерти</button></div>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="show" ${w.trim()?"":"disabled"}>🖥 Показати другові без літер</button><button class="btn ghost" id="copy" ${w.trim()?"":"disabled"}>📋 Скопіювати</button></div>
 <div class="fbx" id="fbx">${S.done[3]?"💌 Лист готовий! Покажи його другові — нехай розгадає.":""}</div>`;
 $("#kbd").onclick=e=>{const b=e.target.closest("button");if(!b)return;const l=b.dataset.l;if(l==="⌫")S.wish=S.wish.slice(0,-1);else if(S.wish.length<14)S.wish+=l;save();writeOwn()};
 $("#show").onclick=()=>{$("#bigTxt").textContent=enc(S.wish);$("#bigShow").hidden=false;if(!S.done[3]){S.done[3]=true;save();envs();confetti()}};
 $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(enc(S.wish));$("#copy").textContent="✓ Скопійовано"}catch(e){$("#copy").textContent="Не вдалося"}}}
$("#bigClose").onclick=()=>{$("#bigShow").hidden=true;writeOwn()};
$("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=cur==="dark"?"light":"dark";try{localStorage.setItem("infohab-theme",JSON.stringify(document.documentElement.dataset.theme))}catch(e){}};
try{const th=JSON.parse(localStorage.getItem("infohab-theme"));if(th)document.documentElement.dataset.theme=th}catch(e){}
keyGrid();render();
</script>

</body>
</html>
