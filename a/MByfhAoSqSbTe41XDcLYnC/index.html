<style>
:root{--bg:#f4f6fb;--surface:#fff;--surface-2:#e9edf5;--ink:#18202f;--muted:#5b6578;--line:#dfe4ee;--accent:#2f5bea;--class-5:#c2255c;--ok:#2e7d32;--ok-bg:#e3f3e4;--bad:#b3261e;--bad-bg:#fbe7e5;--warn:#b45309;--send:#ffb020;--send-ink:#2a1a00;
--sea1:#4fb3e8;--sea2:#2b86c8;--fd:"Unbounded","Arial Black",system-ui,sans-serif;--fb:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11141b;--surface:#1a1f2a;--surface-2:#232a38;--ink:#e8ecf4;--muted:#9aa4b6;--line:#2b3242;--accent:#7d9bff;--class-5:#f06595;--ok:#7fd283;--ok-bg:#1f3522;--bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f2b46b;--sea1:#2a6f9e;--sea2:#173f63;color-scheme:dark}}
:root[data-theme=dark]{--bg:#11141b;--surface:#1a1f2a;--surface-2:#232a38;--ink:#e8ecf4;--muted:#9aa4b6;--line:#2b3242;--accent:#7d9bff;--class-5:#f06595;--ok:#7fd283;--ok-bg:#1f3522;--bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f2b46b;--sea1:#2a6f9e;--sea2:#173f63;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--fb)}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 110px}
.eyebrow{font:800 12px/1.3 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,6vw,40px)/1.1 var(--fd);color:#c62828;margin:6px 0 12px}
h2{font:700 20px/1.25 var(--fd);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.card.top::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#c62828}
.story{display:flex;gap:12px;align-items:center}
.story svg{flex:0 0 96px;height:96px}
.story p{margin:0}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.hud span{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:6px;padding:8px 0;margin-bottom:8px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;border-radius:999px;padding:9px 14px;font:800 15px var(--fb);background:var(--surface-2);color:var(--ink);cursor:pointer;position:relative}
.tabs button[aria-selected=true]{background:#c62828;color:#fff}
.dot{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--send);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
button{font-family:var(--fb)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:800 16px var(--fb);cursor:pointer;background:#c62828;color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.msg{border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700;border:2px solid}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.badge{display:inline-block;background:#c62828;color:#fff;border-radius:999px;padding:2px 10px;font:800 13px var(--fb)}
/* маршрут */
.route{width:100%;height:auto;display:block;margin:4px 0 10px}
.route .node{cursor:pointer}
.route .node circle{stroke:var(--surface);stroke-width:3}
.route .cur circle{animation:pulse 1.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18)}}
/* море */
.seaTabs{display:flex;gap:6px;margin:8px 0}
.seaTabs button{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 12px;font:800 14px var(--fb);cursor:pointer}
.seaTabs button.on{border-color:#c62828}
.seaTabs button.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.board{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:14px;touch-action:manipulation}
.boat{transition:transform .26s ease-in-out}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tapcell{cursor:pointer}
.tapcell:hover{fill:rgba(255,255,255,.25)}
.coin{transition:opacity .3s,transform .3s}
/* редактор */
.ed{display:grid;gap:10px;margin-top:12px}
@media(min-width:760px){.ed{grid-template-columns:200px 1fr}}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pal button{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 10px;font:800 15px var(--fb);cursor:pointer}
.pal button.ctl{border-color:#c62828}
.prog{background:var(--surface-2);border-radius:14px;padding:10px;min-height:90px}
.blk{background:var(--surface);border:2px solid var(--line);border-left:6px solid #2b86c8;border-radius:10px;padding:6px 8px;margin:5px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800}
.blk.c{border-left-color:#e0a21b;display:block}
.blk.i{border-left-color:#8e44c9;display:block}
.blk .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.blk.run{box-shadow:0 0 0 3px #c62828}
.blk.picked{box-shadow:0 0 0 3px var(--warn)}
.chip{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:2px 8px;font:800 15px var(--fb);cursor:pointer;min-width:34px}
.chip.num{font-family:var(--fm)}
.x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.body{margin:4px 0 2px 2px;padding-left:6px;border-left:3px dashed var(--line)}
.lab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:6px;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;text-align:center;margin-top:4px;background:none;width:100%}
.slot.on{border-color:#c62828;color:#c62828}
.cnt{font-weight:800}
.cnt.over{color:var(--bad)}
.hp{height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#7b2ff7,#c62828);transition:width .6s}
.stars{font-size:34px;letter-spacing:6px;text-align:center;min-height:44px}
.stars span{display:inline-block;animation:pop .45s both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.fx{position:fixed;font:800 22px var(--fd);color:#c62828;pointer-events:none;animation:up 1.1s forwards;z-index:60}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
/* картки */
.banner{background:#c62828;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.banner b.big{display:block;font:800 19px/1.25 var(--fd);margin:4px 0 8px}
.banner ul{margin:0;padding-left:20px;font-weight:800;text-transform:uppercase;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fc{perspective:800px;height:150px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}
.fc .f{background:var(--surface);font:800 17px/1.2 var(--fd);border-top:5px solid #c62828}
.fc .b{background:var(--surface-2);transform:rotateY(180deg);font-size:15px;font-weight:700}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:#c62828;transition:width .4s}
/* результат */
.big{font:800 64px/1 var(--fd);color:#c62828;text-align:center}
.lvl{text-align:center;font-weight:800;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
input[type=text]{font:700 16px var(--fb);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.warnTxt{color:var(--warn);font-weight:800}
.fab{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--send);color:var(--send-ink);border:0;border-radius:999px;padding:12px 18px;font:800 16px var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .card{max-width:420px;width:100%}
.sendBtn{background:var(--send);color:var(--send-ink)}
.theme{position:absolute;right:14px;top:14px;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}
.head{position:relative}.head h1,.head .eyebrow{padding-right:48px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted);justify-content:center;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.form{display:grid;gap:8px}.form label{display:grid;gap:4px;font-weight:700}
textarea,select,input[type=text]{font:600 16px var(--fb);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
textarea{min-height:110px}
.cert{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.bigw{position:fixed;inset:0;background:#1b1b1b;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.bigw .cert{max-width:min(96vw,150vh)}.bigw .row{justify-content:center}
</style>

<body>
<div class="wrap">
 <header class="head"><button class="theme" id="themeBtn" aria-label="Змінити тему" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">🌓</button>
 <div class="eyebrow">Інтерактивні уроки · Для вчителя</div><h1 style="color:#c62828">Грамоти</h1>
 <p class="muted">Впиши імена переможців (кожне з нового рядка), обери гру — і вручай грамоти на великому екрані, гортаючи стрілками. Дані лишаються лише на цьому комп'ютері.</p></header>
 <div class="card top form">
  <label>Імена (кожне з нового рядка)<textarea id="names" placeholder="Оля К.&#10;Тарас М."></textarea></label>
  <label>Клас<input type="text" id="cls" placeholder="5-А"></label>
  <label>Гра<select id="game"></select></label>
  <label>За що<select id="reason"></select></label>
  <label>Зірки<select id="stars"><option value="1">⭐</option><option value="2">⭐⭐</option><option value="3">⭐⭐⭐</option></select></label>
  <label>Вчитель (прізвище, ініціали)<input type="text" id="teacher"></label>
  <label>Дата<input type="text" id="date"></label>
 </div>
 <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><button class="btn ghost" id="pv">◀</button><b id="pos"></b><button class="btn ghost" id="nx">▶</button></div><div id="prev" style="margin-top:10px"></div>
 <div class="row" style="margin-top:10px;justify-content:center"><button class="btn" id="show">🖥 Вручати на великому екрані</button></div></div>

<script>"use strict";
const $=s=>document.querySelector(s);
const GAMES=["«Козацький острів скарбів»","«Біт-діджей»","«Навчи Біта» · Тиждень ШІ","«Зламай шифр»","«Енігма-міні»","«Логічна майстерня»","«Маленький комп'ютер»","«Мережа мікроферми»","«Майстерня блок-схем»","«Python-лабораторія»","«Конструктор бази кав'ярні»","«Розумна кавомашина»","«Острови чисел»","«Козацькі задачі»","«Таємна пошта Миколая»","«Чарівна листівка»"];
const REASONS=["за перемогу в грі","за проходження без помилок","за найкращий час у класі","за наполегливість і кмітливість","за творчий проєкт"];
let D;try{D=JSON.parse(localStorage.getItem("gramota"))}catch(e){}D=D||{names:"",cls:"",game:GAMES[0],reason:REASONS[0],stars:3,teacher:"",date:new Date().toLocaleDateString("uk-UA"),i:0};
function save(){try{localStorage.setItem("gramota",JSON.stringify(D))}catch(e){}}
const list=()=>D.names.split("\n").map(s=>s.trim()).filter(Boolean);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function border(){let p="";const cell=(x,y,c)=>`<rect x="${x}" y="${y}" width="10" height="10" fill="${c}"/>`;
 const motif=(x,y)=>[[1,0],[0,1],[1,1],[2,1],[1,2]].map(([a,b])=>cell(x+a*10,y+b*10,(a+b)%2?"#c62828":"#18202f")).join("");
 for(let x=20;x<780;x+=40){p+=motif(x,14)+motif(x,546)}for(let y=60;y<530;y+=40){p+=motif(14,y)+motif(756,y)}return p}
function cert(name){const st="⭐".repeat(D.stars);return `<svg viewBox="0 0 800 590" class="cert" role="img" aria-label="Грамота для ${esc(name)}">
 <rect width="800" height="590" fill="#fffaf0"/>${border()}<rect x="56" y="56" width="688" height="478" fill="none" stroke="#c9a227" stroke-width="3"/>
 <text x="400" y="130" text-anchor="middle" font-family="Unbounded,Arial Black" font-weight="800" font-size="58" fill="#c62828" letter-spacing="6">ГРАМОТА</text>
 <text x="400" y="180" text-anchor="middle" font-family="Nunito,Arial" font-size="22" fill="#5b6578">нагороджується</text>
 <text x="400" y="250" text-anchor="middle" font-family="Unbounded,Arial Black" font-weight="800" font-size="${name.length>22?30:40}" fill="#18202f">${esc(name)}</text>
 <text x="400" y="290" text-anchor="middle" font-family="Nunito,Arial" font-size="22" fill="#18202f">${esc(D.cls?"учень / учениця "+D.cls+" класу":"")}</text>
 <text x="400" y="345" text-anchor="middle" font-family="Nunito,Arial" font-weight="700" font-size="24" fill="#0f6e6e">${esc(D.reason)}</text>
 <text x="400" y="385" text-anchor="middle" font-family="Nunito,Arial" font-weight="800" font-size="26" fill="#18202f">${esc(D.game)}</text>
 <text x="400" y="435" text-anchor="middle" font-size="36">${st}</text>
 <text x="120" y="495" font-family="Nunito,Arial" font-size="18" fill="#5b6578">${esc(D.date)}</text>
 <text x="680" y="495" text-anchor="end" font-family="Nunito,Arial" font-size="18" fill="#5b6578">Вчитель інформатики ${esc(D.teacher)}</text>
 <circle cx="400" cy="495" r="26" fill="#c9a227"/><text x="400" y="504" text-anchor="middle" font-size="26">🏅</text></svg>`}
function render(){const L=list();if(D.i>=L.length)D.i=0;const name=L[D.i]||"Ім'я Прізвище";
 $("#prev").innerHTML=cert(name);$("#pos").textContent=L.length?`${D.i+1} з ${L.length}`:"додай імена";$("#bigC").innerHTML=cert(name);$("#bigPos").textContent=L.length?`${D.i+1} / ${L.length}`:""}
function init(){$("#names").value=D.names;$("#cls").value=D.cls;$("#teacher").value=D.teacher;$("#date").value=D.date;
 $("#game").innerHTML=GAMES.map(g=>`<option${g===D.game?" selected":""}>${g}</option>`).join("");$("#reason").innerHTML=REASONS.map(g=>`<option${g===D.reason?" selected":""}>${g}</option>`).join("");$("#stars").value=D.stars;
 ["names","cls","teacher","date"].forEach(id=>$("#"+id).oninput=e=>{D[id]=e.target.value;save();render()});
 ["game","reason"].forEach(id=>$("#"+id).onchange=e=>{D[id]=e.target.value;save();render()});$("#stars").onchange=e=>{D.stars=+e.target.value;save();render()};
 const mv=d=>{const n=list().length||1;D.i=(D.i+d+n)%n;save();render()};$("#pv").onclick=()=>mv(-1);$("#nx").onclick=()=>mv(1);$("#bpv").onclick=()=>mv(-1);$("#bnx").onclick=()=>mv(1);
 $("#show").onclick=()=>{$("#big").hidden=false;render()};$("#close").onclick=()=>{$("#big").hidden=true};
 document.addEventListener("keydown",e=>{if($("#big").hidden)return;if(e.key==="ArrowRight")mv(1);if(e.key==="ArrowLeft")mv(-1);if(e.key==="Escape")$("#big").hidden=true});render()}
init();
</script>
