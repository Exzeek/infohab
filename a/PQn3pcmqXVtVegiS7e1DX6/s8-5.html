<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ігротека: 8 клас · Сайт і його верстка</title>
<style>
:root{--cl:#e0661b;--cd:#f59152;--bg:#f6f7fb;--ink:#1f2433;--muted:#5c6378;--card:#fff;--line:#e3e6ee;--ok:#2b8a3e;--bad:#c92a2a;--A:#1c7ed6;--B:#e8590c;--C:#2f9e44;--D:#9c36b5;--r:16px;
  font-size:clamp(15px,1.45vw,26px)}
@media (prefers-color-scheme:dark){:root{--bg:#14161d;--ink:#eef0f6;--muted:#a3a9b8;--card:#1e212b;--line:#2c303c;--cl:var(--cd)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit}
h1,h2,h3{margin:0;line-height:1.15}
.top{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;background:var(--cl);color:#fff;flex-wrap:wrap}
.top .t{flex:1;min-width:12rem}
.top small{opacity:.85;display:block;font-size:.75rem}
.top b{font-size:1.1rem}
.hb{background:#ffffff26;color:#fff;border-radius:999px;padding:.35rem .8rem;font-weight:800;font-size:.85rem}
.hb[aria-pressed=false]{opacity:.55}
main{padding:1rem;max-width:1500px;margin:0 auto}
.screen[hidden]{display:none!important}
/* setup */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin:1rem 0}
.mode{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:1rem;text-align:left;display:flex;flex-direction:column;gap:.4rem;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode[aria-pressed=true]{border-color:var(--cl);box-shadow:0 4px 0 var(--cl)}
.mode .ic{font-size:2.6rem}
.mode h3{font-size:1.15rem}
.mode p{margin:0;color:var(--muted);font-size:.85rem}
.mode .tag{font-size:.7rem;font-weight:800;color:var(--cl);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.4rem .9rem;font-weight:700}
.pill[aria-pressed=true]{background:var(--cl);border-color:var(--cl);color:#fff}
.teamname{border:2px solid var(--line);border-radius:12px;padding:.4rem .7rem;font:inherit;font-weight:800;width:11rem;background:var(--card);color:var(--ink)}
.big{background:var(--cl);color:#fff;border-radius:999px;padding:.7rem 2rem;font-size:1.25rem;font-weight:900;box-shadow:0 5px 0 #0003}
.big:disabled{opacity:.5}
.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:.5rem 1.2rem;font-weight:800}
.lead{color:var(--muted);margin:.3rem 0 0}
/* scorebar */
.scores{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.sc{flex:1;min-width:9rem;background:var(--card);border-radius:var(--r);padding:.5rem .9rem;border:3px solid transparent;display:flex;align-items:center;gap:.6rem;box-shadow:0 3px 0 var(--line)}
.sc.on{border-color:var(--tc)}
.sc .dot{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--tc)}
.sc .nm{font-weight:800;flex:1}
.sc .pt{font-size:1.6rem;font-weight:900;color:var(--tc)}
.status{font-weight:800;margin:.2rem 0 .8rem;font-size:1.05rem}
/* question modal */
.qm{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.qm[hidden]{display:none}
.qbox{background:var(--card);border-radius:22px;max-width:62rem;width:100%;padding:1.4rem 1.6rem;box-shadow:0 20px 50px #0006;border-top:10px solid var(--tc,var(--cl))}
.qbox .who{font-weight:900;color:var(--tc,var(--cl));font-size:.95rem}
.qbox .topic{color:var(--muted);font-size:.8rem}
.qbox .q{font-size:1.45rem;font-weight:800;margin:.5rem 0 1rem;white-space:pre-line}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.opt{background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:.8rem 1rem;font-size:1.15rem;font-weight:700;text-align:left;display:flex;gap:.6rem;align-items:center}
.opt b{background:var(--cl);color:#fff;border-radius:8px;min-width:2rem;text-align:center;padding:.1rem .3rem}
.opt.ok{border-color:var(--ok);background:#d3f9d8;color:#123}
.opt.bad{border-color:var(--bad);background:#ffe3e3;color:#300}
.timer{height:.5rem;background:var(--line);border-radius:9px;overflow:hidden;margin-top:1rem}
.timer i{display:block;height:100%;background:var(--tc,var(--cl));width:100%}
.verdict{font-size:1.3rem;font-weight:900;margin-top:.8rem;min-height:1.6rem}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
/* BLOCK */
.bwrap{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.bteam{display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.55;transition:opacity .3s}
.bteam.on{opacity:1}
.bteam h3{color:var(--tc)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--line);padding:6px;border-radius:14px;width:min(40vw,30rem);aspect-ratio:1}
.cell{background:var(--card);border-radius:5px;position:relative}
.cell.f{background:var(--tc);box-shadow:inset 0 -4px 0 #0003}
.cell.v{background:#868e96;box-shadow:inset 0 -4px 0 #0003}
.cell.pv{background:color-mix(in srgb,var(--tc) 40%,var(--card))}
.cell.no{background:#ffc9c9}
.cell.clr{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25);background:#ffd43b}}
.tray{display:flex;gap:1rem;align-items:center;min-height:6rem;justify-content:center;flex-wrap:wrap}
.piece{display:grid;gap:3px;padding:.4rem;border-radius:12px;border:3px dashed transparent;background:var(--card)}
.piece.sel{border-color:var(--tc)}
.piece i{width:1.4rem;height:1.4rem;border-radius:4px}
.piece i.f{background:var(--tc)}
/* RUNNER */
.run{position:relative;width:min(92vw,56rem);height:min(60vh,34rem);min-height:20rem;margin:0 auto;border-radius:20px;overflow:hidden;background:linear-gradient(#1b2a4a,#23395d)}
.lane{position:absolute;top:0;bottom:0;width:33.333%;border-left:2px dashed #ffffff22}
.runner{position:absolute;bottom:4%;width:12%;aspect-ratio:1;font-size:3.2rem;display:flex;align-items:center;justify-content:center;transition:left .18s;transform:translateX(-50%)}
.gate{position:absolute;width:30%;transform:translateX(-50%);background:#fff;color:#1f2433;border-radius:14px;padding:.4rem .5rem;font-weight:800;font-size:.95rem;text-align:center;box-shadow:0 6px 0 #0004;min-height:3.2rem;display:flex;align-items:center;justify-content:center}
.gate.wall{background:#495057;color:#fff}
.gate.ok{background:#8ce99a}.gate.bad{background:#ffa8a8}
.coin{position:absolute;font-size:1.6rem;transform:translate(-50%,-50%)}
.rq{position:absolute;left:0;right:0;top:0;padding:.6rem 1rem;background:#000a;color:#fff;font-weight:800;font-size:1.15rem;text-align:center;z-index:3;white-space:pre-line}
.rhud{position:absolute;right:.8rem;bottom:.6rem;color:#fff;font-weight:900;z-index:3;font-size:1.1rem}
.rbtns{display:flex;justify-content:center;gap:1rem;margin-top:.8rem}
.rbtns button{font-size:1.6rem;padding:.4rem 1.6rem}
.ovl{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:6;font-size:1.5rem!important;padding:.8rem 1.8rem!important;box-shadow:0 8px 30px #0008}
.ovl[hidden]{display:none}
.hold{position:absolute;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:1.05rem;background:#0009;border-radius:999px;padding:.15rem .8rem;z-index:3;white-space:nowrap}
/* LUDO */
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:64rem;margin:0 auto}
.tc{aspect-ratio:1;background:var(--card);border-radius:12px;border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.tc small{position:absolute;left:5px;top:3px;font-size:.6rem;color:var(--muted);font-weight:800}
.tc.start{background:#e7f5ff}.tc.fin{background:#fff3bf}
.tokens{position:absolute;inset:auto 2px 2px 2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.tok{width:1.15rem;height:1.15rem;border-radius:50%;background:var(--tc);border:2px solid #fff;box-shadow:0 2px 3px #0005;transition:all .3s}
.dice{font-size:4rem;line-height:1;display:inline-block}
.dice.roll{animation:rl .6s}
@keyframes rl{25%{transform:rotate(90deg) scale(1.2)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) scale(1.2)}}
.ludo-ctl{display:flex;gap:1.2rem;align-items:center;justify-content:center;margin:1rem 0}
.legend{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:.6rem}
/* HOLE */
.hole{position:relative;width:min(94vw,64rem);height:min(60vh,34rem);min-height:20rem;margin:0 auto;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#e9f5ff,#cfe3f7);touch-action:none;cursor:crosshair}
@media (prefers-color-scheme:dark){.hole{background:radial-gradient(circle at 30% 30%,#24304a,#182033)}}
.hq{position:absolute;left:0;right:0;top:0;padding:.5rem 1rem;background:#000b;color:#fff;font-weight:800;text-align:center;z-index:3;font-size:1.1rem;white-space:pre-line}
.hobj{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#1f2433;border-radius:14px;padding:.35rem .6rem;font-weight:800;font-size:.9rem;box-shadow:0 4px 0 #0003;max-width:14rem;text-align:center;transition:opacity .25s,transform .25s}
.hobj.gone{opacity:0;transform:translate(-50%,-50%) scale(.1)}
.hh{position:absolute;border-radius:50%;background:radial-gradient(circle,#000 55%,#222 70%,#555 100%);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--tc),0 0 30px #0008;z-index:2}
.hhud{position:absolute;right:.8rem;bottom:.6rem;font-weight:900;z-index:3;background:#fffd;color:#1f2433;border-radius:999px;padding:.2rem .8rem}
.float{position:absolute;font-weight:900;font-size:1.4rem;z-index:4;pointer-events:none;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-3rem);opacity:0}}
/* results */
.res{text-align:center}
.res .win{font-size:2.4rem;font-weight:900;margin:.6rem 0}
.podium{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.podium div{background:var(--card);border-radius:var(--r);padding:1rem 1.4rem;border-top:8px solid var(--tc);min-width:10rem}
.podium b{display:block;font-size:2rem;color:var(--tc)}
.review{max-width:52rem;margin:1rem auto;text-align:left;background:var(--card);border-radius:var(--r);padding:1rem 1.2rem}
.review li{margin:.3rem 0}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const p=el("div","piece sel");p.style.gridTemplateColumns=`repeat(${piece[0].length},1.4rem)`;piece.forEach(r=>r.forEach(v=>p.appendChild(el("i",v?"f":""))));tr.appendChild(p);
  const rb=el("button","ghost","⟳ Повернути");rb.onclick=()=>{piece=rot(piece);trayDraw()};tr.appendChild(rb);
  tr.appendChild(el("span","lead","Клацніть клітинку на полі — туди стане лівий верхній кут фігури."))};
 const hover=(i,k,on)=>{if(!piece||i!==cur)return;const r=k>>3,c=k&7,ok=fits(i,piece,r,c);piece.forEach((row,y)=>row.forEach((v,x)=>{if(!v)return;const rr=r+y,cc=c+x;if(rr<8&&cc<8){const cell=els[i].b.children[rr*8+cc];if(on)cell.classList.add(ok?"pv":"no");else cell.classList.remove("pv","no")}}))};
 els.forEach((e,i)=>{[...e.b.children].forEach(c=>{const k=+c.dataset.k;c.onmouseenter=()=>hover(i,k,true);c.onmouseleave=()=>hover(i,k,false);c.onclick=()=>place(i,k)})});
 function place(i,k){if(!piece||i!==cur)return;const r=k>>3,c=k&7;if(!fits(i,piece,r,c)){sBad();return}
  let n=0;piece.forEach((row,y)=>row.forEach((v,x)=>{if(v){B[i][r+y][c+x]=1;n++}}));piece=null;trayDraw();
  // clear lines
  const rows=[],cols=[];for(let y=0;y<8;y++)if(B[i][y].every(v=>v))rows.push(y);for(let x=0;x<8;x++)if(B[i].every(row=>row[x]))cols.push(x);
  const L=rows.length+cols.length;let pts=n;if(L){pts+=L*10*L;tone([[523,.1],[659,.1],[784,.1],[1047,.2]]);rows.forEach(y=>{for(let x=0;x<8;x++){B[i][y][x]=0;els[i].b.children[y*8+x].classList.add("clr")}});cols.forEach(x=>{for(let y=0;y<8;y++){B[i][y][x]=0;els[i].b.children[y*8+x].classList.add("clr")}})}
  T[i].score+=pts;const rc=els[i].b.getBoundingClientRect();float(document.body,rc.left+rc.width/2,rc.top+rc.height/2,"+"+pts+(L>1?` комбо ×${L}!`:""));
  draw();setTimeout(()=>turnDone&&turnDone(),L?600:250)}
 async function loop(){
  while(round<=ROUNDS){for(let i=0;i<T.length;i++){cur=i;draw();status(`Раунд ${round} з ${ROUNDS} · хід команди «${esc(T[i].name)}»`);
   const {ok}=await ask(i,{lead:`раунд ${round}`});if(!running)return;
   if(ok){let sh=SHAPES[rnd(SHAPES.length)];for(let t=0;t<4&&!anyFit(i,sh);t++)sh=rot(sh);if(!anyFit(i,sh))sh=[[1]];
    if(!anyFit(i,sh)){status("Поле заповнене — фігура не влазить!");await new Promise(r=>setTimeout(r,1500));continue}
    piece=sh;trayDraw();status(`«${esc(T[i].name)}» ставить фігуру на своє поле`);await new Promise(r=>turnDone=r);turnDone=null}
   else{const empty=[];for(let k=0;k<64;k++)if(!B[i][k>>3][k&7])empty.push(k);if(empty.length){const k=empty[rnd(empty.length)];B[i][k>>3][k&7]=2;draw();els[i].b.children[k].classList.add("clr")}await new Promise(r=>setTimeout(r,700))}
  }round++}
  finish("Бали: клітинка фігури +1, кожна зібрана лінія +10 (дві лінії разом — ×2, комбо!).")}
 running={stop(){running=null;turnDone&&turnDone()}};draw();loop()}

/* ================= RUNNER ================= */
function Runner(){
 const GATES=8;let ti=0;
 const st=$("#stage");st.innerHTML=`<div class="run" id="run"><div class="rq" id="rq"></div><div class="lane" style="left:0;border:0"></div><div class="lane" style="left:33.33%"></div><div class="lane" style="left:66.66%"></div><div class="runner" id="me">🏃</div><div class="rhud" id="rh"></div><button class="big ovl" id="startRun">▶ Старт забігу</button></div><div class="rbtns"><button class="ghost" id="L">⬅</button><button class="ghost" id="R">➡</button></div>`;
 const run=$("#run"),me=$("#me");let lane=1,raf=null,alive=false;
 const setLane=l=>{lane=Math.max(0,Math.min(2,l));me.style.left=(16.66+lane*33.33)+"%"};setLane(1);
 $("#L").onclick=()=>setLane(lane-1);$("#R").onclick=()=>setLane(lane+1);
 run.onpointerdown=e=>{const r=run.getBoundingClientRect();setLane(Math.floor((e.clientX-r.left)/r.width*3))};
 const kh=e=>{if(e.key==="ArrowLeft"||e.key==="a"){setLane(lane-1);e.preventDefault()}if(e.key==="ArrowRight"||e.key==="d"){setLane(lane+1);e.preventDefault()}};addEventListener("keydown",kh);
 const begin=()=>{cur=ti;scores();T[ti].extra="❤️❤️❤️";T[ti].lives=3;scores();status(`Біжить команда «${esc(T[ti].name)}» · ${GATES} воріт · ← → або торкніться доріжки`);$("#startRun").hidden=false;$("#startRun").disabled=false;$("#startRun").textContent="▶ Старт забігу «"+T[ti].name+"»";try{run.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}$("#rq").textContent="Натисніть «Старт», коли команда готова";};
 $("#startRun").onclick=e=>{e.stopPropagation();$("#startRun").hidden=true;go()};$("#startRun").onpointerdown=e=>e.stopPropagation();
 function go(){alive=true;let gate=0,speed=.05,objs=[],last=performance.now(),spawnIn=0;
  const H=()=>run.clientHeight;
  const spawnGate=()=>{const q=nextQ();const opts=q.o.length>=3?shuffle([0,...shuffle(q.o.map((_,i)=>i).slice(1)).slice(0,2)]):null;
   let lanes;if(opts)lanes=opts; else {lanes=shuffle([0,1]);lanes.splice(1,0,-1)}
   $("#rq").textContent=q.q.replace(/\n/g," ");
   const rd=Math.min(10000,Math.max(4000,2500+40*(q.q.length+q.o.join("").length)));const hl=el("div","hold","");run.appendChild(hl);
   const row={y:-60,hold:rd,hl,q,items:lanes.map((oi,l)=>{const g=el("div","gate"+(oi<0?" wall":""),oi<0?"🧱":esc(q.o[oi]));g.style.left=(16.66+l*33.33)+"%";run.appendChild(g);return{g,oi}}),hit:false};objs.push(row);
   for(let k=0;k<3;k++){const c=el("div","coin","🪙");c.style.left=(16.66+rnd(3)*33.33)+"%";run.appendChild(c);objs.push({coin:c,y:-260-k*90})}};
  spawnGate();gate++;
  const step=t=>{if(!alive)return;const dt=Math.min(50,t-last);last=t;const h=H(),py=h*.84;
   objs.forEach(o=>{o.y+=speed*dt*(h/600);const el_=o.coin||null;if(o.coin){o.coin.style.top=o.y+"px";const cl=Math.round((parseFloat(o.coin.style.left)-16.66)/33.33);if(!o.got&&Math.abs(o.y-py)<30&&cl===lane){o.got=true;o.coin.remove();T[ti].score+=1;tone([[1320,.05]]);scores()}}
    else{if(o.hold>0){const stop=h*.2;if(o.y>=stop){o.y=stop;o.hold-=dt;o.hl.textContent="⏳ Читай і обирай доріжку: "+Math.ceil(o.hold/1000)+" с";o.hl.style.top=(o.y+70)+"px"}else o.y=Math.min(stop,o.y+speed*dt*(h/600)*4);if(o.hold<=0)o.hl.remove()}
     o.items.forEach(it=>it.g.style.top=o.y+"px");if(!o.hit&&o.y+30>py-20){o.hit=true;const it=o.items[lane];const ok=it.oi===0;o.items.forEach(x=>{if(x.oi===0)x.g.classList.add("ok");else if(x===it)x.g.classList.add("bad")});
      const r=run.getBoundingClientRect();if(ok){T[ti].score+=10;sOk();float(run,me.offsetLeft,me.offsetTop,"+10")}else{T[ti].lives--;MISS.push(o.q);sBad();float(run,me.offsetLeft,me.offsetTop,"💥","#c92a2a");me.animate&&me.animate([{transform:"translateX(-50%) rotate(0)"},{transform:"translateX(-50%) rotate(25deg)"},{transform:"translateX(-50%) rotate(0)"}],{duration:400})}
      T[ti].extra="❤️".repeat(Math.max(0,T[ti].lives))+"🖤".repeat(3-Math.max(0,T[ti].lives));scores();speed*=1.05}}});
   objs=objs.filter(o=>{if(o.y>h+80){if(o.coin)o.coin.remove();else{o.items.forEach(x=>x.g.remove());o.hl&&o.hl.remove()}return false}return true});
   $("#rh").textContent=`Ворота ${Math.min(gate,GATES)}/${GATES}`;
   const gatesLeft=objs.some(o=>!o.coin);
   if(!gatesLeft){if(T[ti].lives<=0||gate>=GATES){alive=false;endRun();return}spawnGate();gate++}
   raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
 function endRun(){[...run.querySelectorAll(".gate,.coin")].forEach(x=>x.remove());const bonus=T[ti].lives>0?T[ti].lives*5:0;T[ti].score+=bonus;T[ti].extra="";scores();
  $("#rq").textContent=`Фініш! «${T[ti].name}»: ${T[ti].score} балів`+(bonus?` (бонус за життя +${bonus})`:"");ti++;
  if(ti>=T.length)setTimeout(()=>finish("Бали: правильні ворота +10, монетка +1, кожне збережене життя +5."),1600);else setTimeout(begin,1800)}
 running={stop(){alive=false;cancelAnimationFrame(raf);removeEventListener("keydown",kh)}};begin()}

/* ================= LUDO ================= */
function Ludo(){
 const N=30;const SP={4:"⭐",9:"🌀",13:"⚡",17:"⭐",21:"🌀",25:"⚡",27:"🌀"};
 const pos=T.map(()=>0);let turns=0;const MAXT=12*T.length;
 const st=$("#stage");
 const order=[];for(let r=0;r<3;r++){const row=[];for(let c=0;c<10;c++)row.push(r*10+c);if(r%2)row.reverse();order.push(...row)}
 st.innerHTML=`<div class="track" id="tr"></div><div class="ludo-ctl"><span class="dice" id="dice">🎲</span><button class="big" id="roll">Кинути кубик</button></div><div class="legend"><span>⭐ +2 клітинки</span><span>🌀 назад на 3</span><span>⚡ ще один кидок</span><span>Стати на суперника — він відступає на 4</span></div>`;
 const tr=$("#tr");
 const cellEls=[];for(let gi=0;gi<30;gi++){const k=order[gi];const c=el("div","tc"+(k===0?" start":k===N-1?" fin":""),`<small>${k===0?"старт":k===N-1?"фініш":k}</small>${SP[k]||(k===N-1?"🏁":"")}<div class="tokens"></div>`);tr.appendChild(c);cellEls[k]=c}
 const draw=()=>{cellEls.forEach(c=>c.querySelector(".tokens").innerHTML="");pos.forEach((p,i)=>{const t=el("span","tok");t.style.setProperty("--tc",`var(${TEAMC[i]})`);t.title=T[i].name;cellEls[Math.min(p,N-1)].querySelector(".tokens").appendChild(t)});T.forEach((t,i)=>{t.score=pos[i];t.extra=""});scores()};
 const D="⚀⚁⚂⚃⚄⚅";const dice=$("#dice"),rb=$("#roll");
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function turn(){if(!running)return;draw();status(`Хід команди «${esc(T[cur].name)}» — киньте кубик`);rb.disabled=false;
  await new Promise(r=>rb.onclick=r);rb.disabled=true;const v=1+rnd(6);dice.classList.remove("roll");void dice.offsetWidth;dice.classList.add("roll");tone([[300,.05],[400,.05],[500,.05]]);await wait(600);dice.textContent=D[v-1];
  const {ok}=await ask(cur,{lead:`на кубику ${v} — відповідь вирішує, чи підеш`});if(!running)return;
  let again=false;
  if(ok){for(let s=0;s<v&&pos[cur]<N-1;s++){pos[cur]++;draw();tone([[700,.04]]);await wait(160)}
   const sp=SP[pos[cur]];if(sp==="⭐"){status("⭐ Бонус: +2!");await wait(500);pos[cur]=Math.min(N-1,pos[cur]+2)}else if(sp==="🌀"){status("🌀 Вихор: назад на 3!");await wait(500);pos[cur]=Math.max(0,pos[cur]-3)}else if(sp==="⚡"){status("⚡ Ще один кидок!");again=true}
   pos.forEach((p,j)=>{if(j!==cur&&p===pos[cur]&&p>0&&p<N-1){pos[j]=Math.max(0,p-4);status(`💥 «${esc(T[cur].name)}» збиває «${esc(T[j].name)}» — назад на 4!`)}});draw();await wait(700)}
  else{status("Кубик «згорів» — фішка стоїть.");await wait(900)}
  if(pos[cur]>=N-1){T[cur].score=N;draw();finish(`«${esc(T[cur].name)}» перша дісталася фінішу!`);return}
  turns++;if(turns>=MAXT){finish("Час гри вийшов — перемагає команда, що пройшла найдалі.");return}
  if(!again)cur=(cur+1)%T.length;turn()}
 running={stop(){running=null}};draw();turn()}

/* ================= HOLE ================= */
function Hole(){
 const TURN=50;let ti=0;
 const st=$("#stage");st.innerHTML=`<div class="hole" id="ha"><div class="hq" id="hq"></div><div class="hh" id="hh"></div><div class="hhud" id="hhud"></div><button class="big ovl" id="hs">▶ Старт</button></div>`;
 const A=$("#ha"),HH=$("#hh");let hx=200,hy=200,tx=200,ty=200,R=34,objs=[],q=null,alive=false,raf=null,t0=0,last=0;
 const place=()=>{HH.style.left=hx+"px";HH.style.top=hy+"px";HH.style.width=HH.style.height=(R*2)+"px"};
 const aim=e=>{const r=A.getBoundingClientRect();tx=e.clientX-r.left;ty=e.clientY-r.top};
 A.onpointerdown=e=>{aim(e);try{A.setPointerCapture(e.pointerId)}catch(_){}};A.onpointermove=e=>{if(e.buttons||e.pointerType==="mouse")aim(e)};
 const keys={};const kd=e=>{keys[e.key]=1;if(e.key.startsWith("Arrow"))e.preventDefault()},ku=e=>keys[e.key]=0;addEventListener("keydown",kd);addEventListener("keyup",ku);
 function newQ(){objs.forEach(o=>o.e.remove());objs=[];q=nextQ();$("#hq").textContent="Ковтай правильну відповідь: "+q.q.replace(/\n/g," ");
  const W=A.clientWidth,H=A.clientHeight;const idx=shuffle(q.o.map((_,i)=>i));
  idx.forEach(i=>{const e=el("div","hobj",esc(q.o[i]));A.appendChild(e);let x,y,t=0;do{x=90+Math.random()*(W-180);y=100+Math.random()*(H-150);t++}while(t<200&&(Math.hypot(x-hx,y-hy)<R+130||objs.some(o=>Math.abs(o.x-x)<190&&Math.abs(o.y-y)<80)));
   objs.push({e,x,y,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,ok:i===0})})}
 function begin(){cur=ti;R=34;hx=A.clientWidth/2;hy=A.clientHeight/2;tx=hx;ty=hy;place();scores();status(`Грає «${esc(T[ti].name)}» · ${TURN} секунд · ведіть діру пальцем, мишею або стрілками`);
  $("#hq").textContent="Натисніть «Старт», коли команда готова";$("#hs").hidden=false;$("#hs").disabled=false;$("#hs").textContent="▶ Старт «"+T[ti].name+"»";try{A.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}HH.style.setProperty("--tc",`var(${TEAMC[ti]})`)}
 $("#hs").onpointerdown=e=>e.stopPropagation();$("#hs").onclick=e=>{e.stopPropagation();$("#hs").hidden=true;alive=true;t0=performance.now();last=t0;newQ();raf=requestAnimationFrame(step)};
 function step(t){if(!alive)return;const dt=Math.min(40,t-last);last=t;const W=A.clientWidth,H=A.clientHeight;
  const sp=.45*dt;if(keys.ArrowLeft)tx=hx-60;if(keys.ArrowRight)tx=hx+60;if(keys.ArrowUp)ty=hy-60;if(keys.ArrowDown)ty=hy+60;
  const dx=tx-hx,dy=ty-hy,d=Math.hypot(dx,dy);if(d>2){const m=Math.min(d,sp);hx+=dx/d*m;hy+=dy/d*m}hx=Math.max(R,Math.min(W-R,hx));hy=Math.max(R+40,Math.min(H-R,hy));place();
  for(const o of objs){if(o.eaten)continue;o.x+=o.vx*dt*.06;o.y+=o.vy*dt*.06;if(o.x<50||o.x>W-50)o.vx*=-1;if(o.y<80||o.y>H-30)o.vy*=-1;o.e.style.left=o.x+"px";o.e.style.top=o.y+"px";
   if(Math.hypot(o.x-hx,o.y-hy)<R*.85){o.eaten=true;o.e.classList.add("gone");
    if(o.ok){T[ti].score+=10;R=Math.min(80,R+5);sOk();float(A,hx,hy-R,"+10");setTimeout(()=>alive&&newQ(),450)}
    else{T[ti].score=Math.max(0,T[ti].score-3);R=Math.max(26,R-4);sBad();float(A,hx,hy-R,"−3","#c92a2a");if(!MISS.includes(q))MISS.push(q)}
    scores()}}
  const left=Math.max(0,TURN-(t-t0)/1000);$("#hhud").textContent=`⏱ ${Math.ceil(left)} с · ${T[ti].score} балів`;
  if(!left){alive=false;objs.forEach(o=>o.e.remove());objs=[];ti++;if(ti>=T.length){finish("Бали: правильна відповідь +10, неправильна −3. Діра росте від правильних!");return}setTimeout(begin,800);return}
  raf=requestAnimationFrame(step)}
 running={stop(){alive=false;cancelAnimationFrame(raf);removeEventListener("keydown",kd);removeEventListener("keyup",ku)}};begin()}

renderSetup();show("setup");
window.__arc={start,S,T:()=>T};
</script>
