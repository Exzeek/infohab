<style>
/* VOICE: командна гра на великий екран, азарт матчу, коротко й по-доброму
   IDEA: баскетбольне табло й майданчик «Ліги класу» — кожна відповідь це кидок

   LAYOUT: табло згори, майданчик ліворуч, питання праворуч; на вузькому екрані стовпчиком */
:root{color-scheme:light;
  --bg:#f4f6fb;--surface:#fff;--surface-2:#e9edf5;--ink:#18202f;--muted:#5b6578;--line:#dfe4ee;--accent:#2f5bea;
  --c:#e0661b;--onc:#fff;--ok:#2e7d32;--ok-bg:#e3f3e4;--bad:#b3261e;--bad-bg:#fbe7e5;--warn:#b45309;

  --bg:#11141b;--surface:#1a1f2a;--surface-2:#232a38;--ink:#e8ecf4;--muted:#9aa4b6;--line:#2b3242;--accent:#7d9bff;
  --c:#f59152;--onc:#11141b;--ok:#7fd283;--ok-bg:#1f3522;--bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f2b46b}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);overflow-x:clip}
.app{max-width:1500px;margin:0 auto;padding:16px max(16px,2vw) 40px;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.eyebrow{font:800 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,3.4vw,44px)/1.05 var(--f-display);margin:2px 0 0;color:var(--c)}
h2{font:700 clamp(19px,2vw,26px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:800 16px var(--f-body);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.btn.main{background:var(--c);border-color:var(--c);color:var(--onc);font-size:clamp(17px,1.5vw,22px);padding:12px 22px}
.btn:focus-visible,.shot:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* табло */
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;background:#141821;color:#f3f5fa;border-radius:20px;padding:12px 16px}
.team{display:grid;gap:2px;align-content:center;padding:8px 12px;border-radius:14px;border:3px solid transparent}
.team.on{border-color:#f59152;background:#1f2633}
.team.r{text-align:right}
.team .nm{font:800 clamp(14px,1.7vw,24px)/1.2 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .sc{font:800 clamp(40px,7vw,96px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:#ffb347}
.team .sc.bump{animation:bump .5s ease}
.team .st{font:700 13px var(--f-body);color:#9aa4b6;min-height:18px}
.mid{display:grid;justify-items:center;align-content:center;gap:4px;padding:0 6px;text-align:center}
.per{font:700 clamp(11px,1.2vw,16px)/1.2 var(--f-display)}
.clock{font:800 clamp(26px,4.2vw,58px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:#7fd283;min-height:1em}

.poss{font:700 13px var(--f-body);color:#9aa4b6}
.pause{font:800 13px var(--f-body);background:none;border:1px solid #3a4356;color:#f3f5fa;border-radius:999px;padding:4px 12px;cursor:pointer;min-height:30px}
@keyframes bump{30%{transform:scale(1.18);color:#fff}}
/* майданчик */
.arena{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.court{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);--wood:color-mix(in srgb,var(--c) 30%,var(--surface))}
.court svg.bg{position:absolute;inset:0;width:100%;height:100%}
.ball{position:absolute;width:9%;aspect-ratio:1;left:36%;top:74.5%;transform:translate(-50%,-50%);z-index:2}
.ball svg{width:100%;height:100%;display:block}
.ball.spin svg{animation:spin 1.2s linear}
@keyframes spin{to{transform:rotate(-540deg)}}
.spot{position:absolute;top:85%;transform:translateX(-50%);font:800 clamp(11px,1.1vw,15px) var(--f-display);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;border:2px solid var(--line)}
.spot.on{border-color:var(--c);background:var(--c);color:var(--onc)}
.call{position:absolute;left:50%;top:9%;transform:translateX(-50%);white-space:nowrap;font:800 clamp(18px,2.6vw,38px)/1 var(--f-display);padding:10px 18px;border-radius:14px;z-index:3}
.call.ok{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok)}
.call.bad{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)}
#net.swish{animation:swish .6s ease;transform-origin:668px 168px}
@keyframes swish{30%{transform:scaleY(1.25)}60%{transform:scaleY(.92)}}
/* панель */
.panel{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:clamp(16px,2vw,28px);display:grid;gap:14px;align-content:start;min-height:280px}
.who{font:700 clamp(18px,2vw,28px)/1.2 var(--f-display)}
.who span{color:var(--c)}
.hint{margin:0;color:var(--muted);font-weight:600}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shot{display:grid;gap:4px;justify-items:start;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;cursor:pointer;font-family:var(--f-body);color:var(--ink);min-height:120px;align-content:start}
.shot:hover{border-color:var(--c)}
.shot b{font:800 clamp(30px,3.6vw,50px)/1 var(--f-display);color:var(--c)}
.shot .nm{font:800 clamp(16px,1.5vw,21px)/1.2 var(--f-body)}
.shot small{font:600 14px/1.3 var(--f-body);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:800 13px/1 var(--f-body);background:var(--surface-2);border-radius:6px;padding:6px 9px}
.tag.pts{background:var(--c);color:var(--onc);font-size:14px}
.q{font:800 clamp(20px,2.1vw,31px)/1.3 var(--f-body);text-wrap:balance}
.q.small{font-size:clamp(17px,1.5vw,22px);font-weight:700;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.opt code,.right code{background:none;padding:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:700 clamp(17px,1.7vw,25px)/1.25 var(--f-body);border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:60px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .k{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--surface);font:800 16px var(--f-display)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);cursor:default}
.msg{font:800 clamp(17px,1.6vw,23px)/1.3 var(--f-body);border-radius:12px;padding:12px 14px;border:2px solid}
.msg.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.msg.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.inp{display:flex;gap:10px;flex-wrap:wrap}
.inp input,.cfg input[type=text]{flex:1;min-width:170px;font:700 clamp(18px,1.8vw,26px) var(--f-mono);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.right{font:700 clamp(18px,1.7vw,25px)/1.3 var(--f-body)}
.right b{font-family:var(--f-mono);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* налаштування */
.cfg{display:grid;gap:14px}
.cfg .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cfg label.f{display:grid;gap:4px;font-weight:800}
.cfg input[type=text]{font-family:var(--f-body);font-size:18px;width:100%}
.cfg fieldset{border:1px solid var(--line);border-radius:12px;margin:0;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 18px}
.cfg legend{font-weight:800;padding:0 6px}
.cfg fieldset label{display:flex;gap:8px;align-items:center;min-height:36px;font-weight:600;cursor:pointer}
.cfg input[type=radio],.cfg input[type=checkbox]{width:20px;height:20px;accent-color:var(--c)}
.rules{margin:0;padding-left:20px;display:grid;gap:4px}
/* підсумок */
.finscore{font:800 clamp(40px,6vw,84px)/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-weight:700}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;align-items:center;font-weight:700}
.bar .tr{grid-column:1/-1;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:999px}
.bar span:nth-child(2){text-align:right;white-space:nowrap}
.joke{margin:0;border-left:5px solid var(--c);background:var(--surface-2);border-radius:0 12px 12px 0;padding:12px 16px;font-weight:700}
@media (max-width:900px){.arena{grid-template-columns:1fr}}
@media (max-width:620px){.opts,.shots,.cfg .two{grid-template-columns:1fr}.shot{min-height:0}.sb{padding:8px}.team{padding:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
{
const G2={id:"match-8-2",grade:8,section:2,topics:["Збір даних","Додаткові параметри форматування","Прості обчислення","Складні розрахунки","Логічні функції","Посилання","Діаграми і графіки","Дослідження та гіпотези"]};
/* Банк питань: t — тема розділу, l — рівень (1 штрафний, 2 двоочковий, 3 триочковий).
   o — варіанти, ПРАВИЛЬНИЙ ЗАВЖДИ ПЕРШИЙ (перемішуються під час гри); a — прийнятні вписані відповіді. */

const BANK2=[

{t:1,l:2,q:'Скільки комірок у діапазоні `A1:C3`?',o:['9','6','3','12']},

}catch(e){} }

const ALIAS={"СУМ":"SUM","СУММ":"SUM","СЕРЕДНЄ":"AVERAGE","СРЗНАЧ":"AVERAGE","МАКС":"MAX","МІН":"MIN","МИН":"MIN","ЯКЩО":"IF","ЕСЛИ":"IF","АБО":"OR","ИЛИ":"OR","СТЕПІНЬ":"POWER","СТЕПЕНЬ":"POWER"};
const norm=s=>String(s).toUpperCase().replace(/[\s ]+/g,"").replace(/[“”«»„‟″]/g,'"').replace(/[’ʼ`]/g,"'").replace(/[–—−]/g,"-").replace(/;/g,",").replace(/[А-ЯІЇЄҐ]+(?=\()/g,m=>ALIAS[m]||m);
const num=s=>{const m=/^(-?\d+(?:[.,]\d+)?)(%?)$/.exec(s.replace(/(ГРН\.?|₴)$/,""));return m?{v:parseFloat(m[1].replace(",",".")),p:m[2]}:null};
function check(q,val){ const v=norm(val); if(!v) return {empty:true};
  for(const a of q.a){ const n=norm(a), x=num(n), y=num(v);
    if(x&&y){ if(x.v===y.v&&x.p===y.p) return {ok:true}; } else if(n===v) return {ok:true}; }
  const noEq=q.a.some(a=>a[0]==="="&&norm(a).slice(1)===v);
  return {ok:false,hint:noEq?"Формула має починатися зі знака «=».":""}; }

/* ---------- гра ---------- */
function newGame(cfg){ const pool={1:[],2:[],3:[]};
  BANK.forEach((q,i)=>{ if(cfg.topics.includes(q.t)) pool[q.l].push(i); });
  for(const l in pool) pool[l]=sh(pool[l]);
  S={cfg,teams:cfg.names.map(n=>({name:n,score:0,byQ:Array(cfg.quarters).fill(0)})),q:0,turn:0,att:0,phase:"pick",pool,used:{1:[],2:[],3:[]},stat:{},cur:null,left:null,paused:false};
  save(); render(); }
function draw(l){ if(!S.pool[l].length){ S.pool[l]=sh(S.used[l]); S.used[l]=[]; }
  if(!S.pool[l].length) return null; const i=S.pool[l].pop(); S.used[l].push(i); return i; }
function pick(l){ if(busy||S.phase!=="pick") return; const i=draw(l); if(i==null) return;
  const q=BANK[i]; S.cur={i,l,opts:q.o?sh(q.o.map((_,k)=>k)):null,tried:[],first:null,res:null};
  S.phase="ask"; startClock(SHOT[l].sec); save(); render(); }
function addScore(team,p){ S.teams[team].score+=p; S.teams[team].byQ[S.q]+=p; }
function shoot(ok,info){ if(busy) return; stopClock(); const q=BANK[S.cur.i], reb=S.phase==="rebound", c=S.cur;
  if(!reb){ const st=S.stat[q.t]||(S.stat[q.t]={n:0,ok:0}); st.n++; if(ok) st.ok++; }
  let after;
  if(ok){ c.team=reb?1-S.att:S.att; c.pts=reb?1:SHOT[q.l].pts; addScore(c.team,c.pts); c.res=reb?"reb":"made"; S.phase="result"; }
  else if(!reb){ c.first=info; if(q.o&&info!=null) c.tried.push(info); S.phase="rebound"; after=()=>startClock(15); }
  else { c.res="miss"; S.phase="result"; }
  save(); busy=true;
  fly(ok,q.l,reb).then(()=>{ busy=false; if(ok) bump(c.team); render(); if(after&&S&&S.phase==="rebound") after(); }); }
function judge(){ const c=S.cur, q=BANK[c.i]; if(c.res==="made") return;
  if(c.res==="reb"){ addScore(c.team,-1); }
  c.team=S.att; c.pts=SHOT[q.l].pts; addScore(c.team,c.pts); c.res="made"; (S.stat[q.t]||(S.stat[q.t]={n:1,ok:0})).ok++; stopClock(); S.phase="result"; save(); bump(c.team); beep("made"); render(); }
function next(){ if(busy) return; S.turn++; S.cur=null; const per=S.q<S.cfg.quarters?PER_Q:2;
  if(S.turn>=per){ const last=S.q>=S.cfg.quarters-1, tie=S.teams[0].score===S.teams[1].score;
    if(last&&!tie){ S.phase="final"; }
    else { S.q++; S.turn=0; if(last) S.teams.forEach(t=>t.byQ.push(0)); S.phase="break"; } }
  else S.phase="pick";
  S.att=(S.q+S.turn)%2; save(); render(); }

/* ---------- таймер ---------- */
function drawClock(){ const el=$("#clock"); el.textContent=S&&S.left!=null&&(S.phase==="ask"||S.phase==="rebound")?S.left:"–"; el.classList.toggle("low",!!S&&S.left!=null&&S.left<=5);
  const p=$("#pause"); p.hidden=!(S&&S.cfg.clock&&(S.phase==="ask"||S.phase==="rebound")); p.textContent=S&&S.paused?"Продовжити":"Пауза"; }
function stopClock(){ clearInterval(timer); timer=null; }
function startClock(sec){ stopClock(); if(!S.cfg.clock){ S.left=null; drawClock(); return; }
  S.left=sec; S.paused=false; drawClock();
  timer=setInterval(()=>{ if(!S||S.paused||busy) return; S.left--; drawClock(); if(S.left<=0){ beep("buzz"); shoot(false,null); } },1000); }

/* ---------- майданчик ---------- */
function placeBall(l){ ball.style.left=SHOT[l].x+"%"; ball.style.top=REST+"%"; [1,2,3].forEach(k=>$("#sp"+k).classList.toggle("on",k===l)); }
function call(text,ok){ const c=$("#call"); c.textContent=text; c.className="call "+(ok?"ok":"bad"); c.hidden=false; }
function bump(team){ const el=$(team?"#tB":"#tA").querySelector(".sc"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function fly(made,l,reb){ const txt=made?(reb?"Підбирання! +1":"Влучно! +"+SHOT[l].pts):(reb?"Без підбирання":"Промах!");
  beep(made?"made":"miss");
  if(RM||!ball.animate||reb){ call(txt,made); if(made){ ball.style.left=HOOP.x+"%"; ball.style.top=(REST)+"%"; } return new Promise(r=>setTimeout(r,reb&&!RM?500:60)); }
  const x0=SHOT[l].x+1,y0=REST-10,x1=HOOP.x-(made?0:5),y1=HOOP.y-(made?4:1),H=34,fr=[],N=14;
  for(let i=0;i<=N;i++){ const t=i/N; fr.push({left:(x0+(x1-x0)*t)+"%",top:(y0+(y1-y0)*t-H*4*t*(1-t))+"%",offset:+(t*.7).toFixed(3)}); }
  if(made) fr.push({left:HOOP.x+"%",top:(HOOP.y+9)+"%",offset:.8},{left:HOOP.x+"%",top:REST+"%",offset:1});
  else fr.push({left:(x1-9)+"%",top:(y1-13)+"%",offset:.83},{left:(x1-22)+"%",top:REST+"%",offset:1});
  ball.classList.add("spin");
  const an=ball.animate(fr,{duration:1250,easing:"linear"});
  const end=fr[fr.length-1];
  return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; ball.classList.remove("spin"); ball.style.left=end.left; ball.style.top=end.top; call(txt,made);
      if(made){ const n=$("#net"); n.classList.remove("swish"); void n.getBBox(); n.classList.add("swish"); } res(); };
    an.onfinish=fin; setTimeout(fin,1400); }); }

/* ---------- екрани ---------- */
function board(){ const A=$("#tA"),B=$("#tB"); const t=S?S.teams:[{name:"Господарі",score:0},{name:"Гості",score:0}];
  [A,B].forEach((el,i)=>{ el.querySelector(".nm").textContent=t[i].name; el.querySelector(".sc").textContent=t[i].score;
    const live=S&&S.phase!=="final"&&S.phase!=="break"; const reb=S&&S.phase==="rebound";
    el.classList.toggle("on",!!live&&(reb?1-S.att:S.att)===i);
    el.querySelector(".st").textContent=live&&(reb?1-S.att:S.att)===i?(reb?"підбирання":"атакує"):""; });
  $("#reset").hidden=!S;
  if(!S){ $("#per").textContent="Ліга класу"; $("#poss").textContent=G.lab; }
  else { const ot=S.q>=S.cfg.quarters; $("#per").textContent=S.phase==="final"?"Фінальна сирена":ot?"Овертайм":"Чверть "+(S.q+1)+" з "+S.cfg.quarters;
    $("#poss").textContent=S.phase==="final"?"Матч завершено":"Атака "+Math.min(S.turn+1,ot?2:PER_Q)+" з "+(ot?2:PER_Q); }
  drawClock(); }
function show(html){ panel.innerHTML=html; }
function render(){ board(); if(!S) return setup();
  if(S.phase!=="result"&&S.phase!=="rebound") $("#call").hidden=true;
  ({pick:vPick,ask:vAsk,rebound:vAsk,result:vResult,break:vBreak,final:vFinal})[S.phase](); }
function setup(){ const old=load(); placeBall(2);
  show(`<div class="row"><span class="hint">Розділ гри:</span><button class="btn${R5?"":" main"}" type="button" id="s2">Р2 · Числа</button><button class="btn${R5?" main":""}" type="button" id="s5">Р5 · Сайт і верстка</button></div><h2>Баскетбольний матч за темами розділу</h2>
  <ul class="rules"><li>Команди атакують по черзі й самі обирають кидок: 1, 2 або 3 очки.</li><li>Що дорожчий кидок, то складніше питання. Триочковий — відповідь треба вписати.</li><li>Промах? Суперник може підібрати м’яч: правильна відповідь дає 1 очко.</li></ul>
  ${old&&old.phase!=="final"?`<div class="row"><button class="btn main" id="cont" type="button">Продовжити матч ${esc(old.teams[0].name)} ${old.teams[0].score} : ${old.teams[1].score} ${esc(old.teams[1].name)}</button></div>`:""}
  <form class="cfg" id="cfg"><div class="two"><label class="f">Команда 1<input type="text" name="a" value="Господарі" maxlength="18"></label><label class="f">Команда 2<input type="text" name="b" value="Гості" maxlength="18"></label></div>
  <fieldset><legend>Тривалість</legend><label><input type="radio" name="len" value="2"> 2 чверті, до 15 хв</label><label><input type="radio" name="len" value="4" checked> 4 чверті, до 30 хв</label></fieldset>
  <fieldset><legend>Час на кидок</legend><label><input type="radio" name="clock" value="1" checked> З таймером (20–45 с)</label><label><input type="radio" name="clock" value="0"> Без таймера</label></fieldset>
  <fieldset><legend>Теми, які клас уже пройшов</legend>${G.topics.map((t,i)=>`<label><input type="checkbox" name="t" value="${i+1}" checked> Т${i+1}. ${esc(t)}</label>`).join("")}</fieldset>
  <div class="row"><button class="btn main">Почати матч</button><span class="hint" id="cfgMsg"></span></div></form>`);
  const setSec=v=>{try{localStorage.setItem("match8-sec",v)}catch(e){} location.reload();}; $("#s2").onclick=()=>{ if(R5) setSec("2"); }; $("#s5").onclick=()=>{ if(!R5) setSec("5"); };
  if($("#cont")) $("#cont").onclick=()=>{ S=old; beep("made"); render(); if(S.phase==="ask"||S.phase==="rebound") startClock(S.phase==="ask"?SHOT[S.cur.l].sec:15); };
  $("#cfg").onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target), topics=f.getAll("t").map(Number);
    if(!topics.length){ $("#cfgMsg").textContent="Оберіть хоча б одну тему."; return; }
    const a=(f.get("a")||"").trim()||"Господарі", b=(f.get("b")||"").trim()||"Гості";
    beep("made"); newGame({names:[a,b===a?b+" 2":b],quarters:+f.get("len"),clock:f.get("clock")==="1",topics}); }; }
function vPick(){ const T=S.teams[S.att]; placeBall(2);
  show(`<div class="who">Атакує: <span>${esc(T.name)}</span></div><p class="hint">Оберіть кидок. Клавіші 1, 2, 3 теж працюють.</p>
  <div class="shots">${[1,2,3].map(l=>`<button class="shot" type="button" data-l="${l}"><b>${SHOT[l].pts}</b><span class="nm">${SHOT[l].name}</span><small>${SHOT[l].lv} · ${SHOT[l].how}</small></button>`).join("")}</div>`);
  panel.querySelectorAll(".shot").forEach(b=>b.onclick=()=>pick(+b.dataset.l)); }
function vAsk(){ const c=S.cur,q=BANK[c.i],reb=S.phase==="rebound",T=S.teams[reb?1-S.att:S.att]; if(!reb) placeBall(c.l);
  let h=`<div class="tags"><span class="tag pts">${reb?"Підбирання · 1 очко":SHOT[c.l].name+" · "+SHOT[c.l].pts}</span><span class="tag">${SHOT[c.l].lv}</span><span class="tag">Т${q.t} · ${esc(G.topics[q.t-1])}</span></div>`;
  h+=reb?`<div class="msg bad">Промах! Підбирає команда «${esc(T.name)}».${!q.o&&c.first?` Відповідь «${esc(c.first)}» не зараховано.`:""}</div>`:`<div class="who">Кидає: <span>${esc(T.name)}</span></div>`;
  h+=`<div class="q">${fmt(q.q)}</div>`;
  if(q.o) h+=`<div class="opts">${c.opts.map((oi,k)=>{const x=c.tried.includes(oi);return `<button class="opt${x?" bad":""}" type="button" data-o="${oi}"${x?" disabled":""}><span class="k">${"ABCD"[k]}</span><span>${fmt(q.o[oi])}</span></button>`}).join("")}</div>`;
  else h+=`<form class="inp" id="f"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Впиши відповідь" aria-label="Відповідь"><button class="btn main">Кинути!</button></form><p class="hint" id="aMsg">${reb&&c.hint?esc(c.hint):(R5?"Теги пишемо з кутовими дужками, як у коді. Числа — без одиниць або з px/%.":"Формули пишемо англійськими назвами функцій; роздільник — «;» або «,».")}</p>`;
  if(reb) h+=`<div class="row"><button class="btn" id="skip" type="button">Без підбирання</button>${q.o?"":`<button class="btn" id="judge" type="button">Суддя: зарахувати перший кидок</button>`}</div>`;
  show(h);
  panel.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>shoot(+b.dataset.o===0,+b.dataset.o));
  if($("#f")){ $("#f").onsubmit=e=>{ e.preventDefault(); const val=$("#ans").value, r=check(q,val); if(r.empty){ $("#ans").focus(); return; } if(!reb) c.hint=r.hint||""; shoot(!!r.ok,val.trim()); }; $("#ans").focus(); }
  if($("#skip")) $("#skip").onclick=()=>shoot(false,null);
  if($("#judge")) $("#judge").onclick=judge; }
function vResult(){ const c=S.cur,q=BANK[c.i],right=q.o?q.o[0]:q.a[0];
  const head=c.res==="made"?`<div class="msg ok">Влучно! «${esc(S.teams[c.team].name)}» отримує +${c.pts}.</div>`:c.res==="reb"?`<div class="msg ok">Підбирання! «${esc(S.teams[c.team].name)}» отримує +1.</div>`:`<div class="msg bad">Промах, очок немає. Розберіть відповідь разом.</div>`;
  show(`${head}<div class="q small">${fmt(q.q)}</div><div class="right">Правильна відповідь: <b>${fmt(right)}</b></div>
  <div class="row"><button class="btn main" id="next" type="button">Далі →</button>${!q.o&&c.res!=="made"?`<button class="btn" id="judge" type="button">Суддя: зарахувати перший кидок</button>`:""}</div>`);
  $("#next").onclick=next; if($("#judge")) $("#judge").onclick=judge; $("#next").focus(); }
function periods(){ const n=S.teams[0].byQ.length; const head=Array.from({length:n},(_,i)=>`<th>${i<S.cfg.quarters?(i+1)+" чв.":"ОТ"}</th>`).join("");
  return `<table><tr><th>Команда</th>${head}<th>Разом</th></tr>${S.teams.map(t=>`<tr><td>${esc(t.name)}</td>${t.byQ.map(x=>`<td>${x}</td>`).join("")}<td><b>${t.score}</b></td></tr>`).join("")}</table>`; }
function vBreak(){ const ot=S.q>=S.cfg.quarters; placeBall(2);
  show(`<h2>${ot?"Нічия! Овертайм: по одному кидку":"Перерва. Попереду чверть "+(S.q+1)}</h2>${periods()}<div class="row"><button class="btn main" id="next" type="button">${ot?"Почати овертайм":"Почати чверть "+(S.q+1)}</button></div>`);
  $("#next").onclick=()=>{ S.phase="pick"; save(); render(); }; $("#next").focus(); }
function vFinal(){ stopClock(); const [a,b]=S.teams, w=a.score>b.score?a:b; ball.style.left=HOOP.x+"%"; ball.style.top=REST+"%";
  const rows=G.topics.map((t,i)=>({t,i:i+1,s:S.stat[i+1]})).filter(r=>r.s&&r.s.n);
  const weak=rows.filter(r=>r.s.ok/r.s.n<.6).sort((x,y)=>x.s.ok/x.s.n-y.s.ok/y.s.n).slice(0,3);
  if(!S.joke) { S.joke=JOKES[Math.floor(Math.random()*JOKES.length)]; save(); }
  show(`<h2>Перемога: «${esc(w.name)}»</h2><div class="finscore">${a.score} : ${b.score}</div>${periods()}
  <h2>Влучність перших кидків за темами</h2><div class="bars">${rows.map(r=>`<div class="bar"><span>Т${r.i}. ${esc(r.t)}</span><span>${r.s.ok} з ${r.s.n}</span><div class="tr"><i style="width:${Math.round(100*r.s.ok/r.s.n)}%"></i></div></div>`).join("")}</div>
  <p class="hint">${weak.length?"Варто повторити: "+weak.map(r=>"Т"+r.i+" «"+esc(r.t)+"»").join(", ")+".":"Усі теми зіграно впевнено. Можна братися за проєкт розділу."}</p>
  <blockquote class="joke">Жарт після сирени: ${esc(S.joke)}</blockquote>
  <div class="row"><button class="btn main" id="again" type="button">Реванш</button><button class="btn" id="fresh" type="button">Нові налаштування</button></div>`);
  $("#again").onclick=()=>{ const cfg=S.cfg; newGame(cfg); }; $("#fresh").onclick=()=>{ S=null; save(); render(); }; }

/* ---------- кнопки й клавіші ---------- */
$("#mute").onclick=e=>{ mute=!mute; e.currentTarget.textContent="Звук: "+(mute?"вимк.":"увімк."); e.currentTarget.setAttribute("aria-pressed",mute); };
$("#pause").onclick=()=>{ if(S){ S.paused=!S.paused; drawClock(); } };
$("#reset").onclick=e=>{ const b=e.currentTarget; if(b.dataset.sure){ delete b.dataset.sure; b.textContent="Нова гра"; stopClock(); S=null; save(); render(); } else { b.dataset.sure=1; b.textContent="Точно завершити матч?"; setTimeout(()=>{ delete b.dataset.sure; b.textContent="Нова гра"; },3000); } };
addEventListener("keydown",e=>{ if(!S||busy||/INPUT|TEXTAREA/.test(e.target.tagName)) return; const k=e.key.toLowerCase();
  if(S.phase==="pick"&&"123".includes(k)&&k) pick(+k);
  else if((S.phase==="ask"||S.phase==="rebound")&&BANK[S.cur.i].o){ let i="abcd".indexOf(k); if(i<0) i="фисв".indexOf(k); if(i<0) i="1234".indexOf(k); const b=panel.querySelectorAll(".opt")[i]; if(i>=0&&b&&!b.disabled) b.click(); } });
render();
}
</script>
</body></html>
