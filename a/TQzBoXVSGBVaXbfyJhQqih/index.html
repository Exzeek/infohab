.pstep ol.do{margin:0;padding-left:22px;display:grid;gap:6px}
.pstep ol.do li{line-height:1.4}
.pq{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.pq .lab{font-weight:700}
.pq .line{display:flex;gap:8px;flex-wrap:wrap}
.pq .line input,.pq .line select{flex:1 1 180px;min-width:0;font:600 16px var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pq.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.pq.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.pq .st{font-size:14px;font-weight:700}
.topicTag{font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--class)}
.mat a{color:var(--class);font-weight:800}
.mat li{margin:4px 0}
.gate{display:grid;gap:8px}
.gate .f{display:flex;flex-wrap:wrap;gap:8px}
.gate input{flex:1 1 200px;font:600 16px var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gate input#pCls{flex:0 1 120px}
.report{white-space:pre-wrap;font:500 13px var(--f-mono);background:var(--surface-2);border-radius:12px;padding:12px;max-height:280px;overflow:auto}
.fabP{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--send);color:var(--send-ink);border:0;border-radius:999px;padding:12px 18px;font:800 16px var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.rub{width:100%;border-collapse:collapse;font-size:15px}
.rub td,.rub th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}

      else inp=el("input",{type:"text",inputmode:(q.num!=null||q.range)?"decimal":"text",placeholder:q.ph||"Твоя відповідь","aria-label":q.q,value:ST.ans[code]??""});
      const st=el("div",{class:"st"},ok?"✓ Зараховано":((ST.tries[code]||0)?"Спроб: "+ST.tries[code]:""));
      const go=el("button",{class:"btn",type:"button",onclick:()=>{ if(!ST.name){ $("#pMsg").textContent="Спершу впиши прізвище, ім'я та клас угорі ☝️"; $("#pName").focus(); return; } if(ST.ok[code]) return;
        const v=inp.value; if(!String(v).trim()){ st.textContent="Спершу впиши відповідь."; return; } ST.ans[code]=v; ST.tries[code]=(ST.tries[code]||0)+1;
        if(judge(q,v)){ ST.ok[code]=true; save(); render(); const n=document.getElementById("st"+si); if(n) n.scrollIntoView({block:"center"}); }

    el("div",{class:"report",id:"pRep"},rep),
    el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},el("button",{class:"btn",type:"button",onclick:e=>{ const b=e.currentTarget; navigator.clipboard?.writeText(rep).then(()=>b.textContent="Скопійовано ✔",()=>b.textContent="Виділи текст звіту й скопіюй вручну"); }},"📋 Скопіювати звіт")),

}

  return ["v1",P.grade,P.title,clean(ST.cls),clean(ST.name),ST.attempt||1,"проєкт",sc.done?sc.grade:"—",(Math.round(sc.got*100)/100)+" з "+sc.tot,Math.round(sc.frac*100),sc.err,hm(Date.now()-ST.started),P.span,"проєкт",sc.done===Q.length?"завершено":"не завершено",tasks].join("|"); }
