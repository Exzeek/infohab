.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}

.fc .b{background:var(--surface-2);transform:rotateY(180deg);font-size:15px;font-weight:700}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--cls);transition:width .4s}
/* результат */
.big{font:800 64px/1 var(--fd);color:var(--cls);text-align:center}
.lvl{text-align:center;font-weight:800;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
input[type=text]{font:700 16px var(--fb);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.warnTxt{color:var(--warn);font-weight:800}
.fab{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--send);color:var(--send-ink);border:0;border-radius:999px;padding:12px 18px;font:800 16px var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .card{max-width:420px;width:100%}
.sendBtn{background:var(--send);color:var(--send-ink)}
.theme{position:absolute;right:14px;top:14px;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}
.head{position:relative}.head h1,.head .eyebrow{padding-right:48px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted);justify-content:center;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--cls:#0b7f8a}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cls:#3cc0bf}}:root[data-theme=dark]{--cls:#3cc0bf}
.young{font-size:19px}.tip{font-size:19px}
.bar2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip.on{background:var(--cls);color:#fff;border-color:var(--cls)}
.chip{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 12px;font:800 15px var(--fb);cursor:pointer}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:44px;background:var(--surface-2);border-radius:14px;padding:8px;font-size:26px}
.pile .cn{animation:pop .3s}
.kozaky{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.kz{border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit}
.kz:active{transform:scale(.97)}.kz .kf{font-size:40px}.kz .bag{font-size:14px;min-height:20px;word-break:break-all;text-align:center}.kz .cnt{font:800 24px var(--fd);color:var(--cls)}.kz.chest{border-style:dashed}
.ti{width:64px;text-align:center;font-size:22px;padding:4px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
.jugs{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.jug{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:14px;padding:6px;border:3px solid transparent}.jug.sel{border-color:#ffb020}
.jbody{position:relative;width:78px;border:4px solid #7a4a24;border-top:0;border-radius:0 0 18px 18px;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5ab6f0,#1e8fd6);transition:height .5s}.jbody b{position:relative;font:800 20px var(--fd);color:var(--ink);text-shadow:0 0 4px var(--surface)}
.stars{font-size:34px;letter-spacing:6px;text-align:center}.stars span{display:inline-block;animation:pop .45s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

<body>
<canvas id="conf"></canvas>
<div class="wrap young">
 <header class="head"><button class="theme" id="themeBtn" aria-label="Змінити тему">🌓</button>
  <div class="eyebrow">Математика · 1–5 клас · Козацькі задачі</div><h1>Козацькі задачі</h1>
  <div class="card top story"><div style="font-size:64px;line-height:1" aria-hidden="true">🧔🪙</div><p><b>На Січі — справи для кмітливих!</b> Отаман просить поділити здобуті дукати порівну, а кашовар — відміряти воду без мірної склянки. Обери задачу й складність.</p></div>
  <div class="hud" id="hud"></div></header>
 <div class="bar2" id="modes"></div><div class="bar2" id="diff"></div>
 <div class="card top" id="stage"></div>
</div>
<script>"use strict";
const $=s=>document.querySelector(s);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const LS="kozak-math";
let S;try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}S=S||{mode:"coins",d:1,stars:{},xp:0};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function confetti(){if(reduce)return;const c=$("#conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#f5c518","#2b86c8","#e0233f","#2f9e4f","#fff"];
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,a:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*5|0]}));let f=0;
 (function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.beginPath();x.arc(p.x+Math.sin(p.a)*8,p.y,p.s/2,0,7);x.fill()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
const DN={1:"🟢 Легко",2:"🟡 Середньо",3:"🔴 Складно"};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function hud(){$("#hud").innerHTML=`<span>⭐ ${Object.values(S.stars).reduce((a,b)=>a+b,0)}</span><span>XP ${S.xp}</span>`}
function bars(){$("#modes").innerHTML=[["coins","🪙 Поділи дукати"],["jugs","🪣 Переливання"]].map(m=>`<button class="chip${S.mode===m[0]?" on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
 $("#diff").innerHTML=[1,2,3].map(d=>`<button class="chip${S.d===d?" on":""}" data-d="${d}">${DN[d]}</button>`).join("");
 $("#modes").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();start()});$("#diff").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.d=+b.dataset.d;save();start()})}
function start(){bars();hud();S.mode==="coins"?coins():jugs()}
function winBox(stars,msg){const k=S.mode+S.d;S.stars[k]=Math.max(S.stars[k]||0,stars);S.xp+=5+stars*5;save();hud();confetti();
 return `<div class="msg ok">${msg}<div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.25}s">${i<stars?"⭐":"☆"}</span>`).join("")}</div><button class="btn" id="again">Нова задача ↻</button></div>`}
// ===== Поділи дукати =====
let C=null;
function coins(){const d=S.d;let n,k;if(d===1){k=R(2,3);n=k*R(2,3)}else if(d===2){k=R(3,4);n=k*R(3,5)}else{k=R(3,5);n=k*R(3,5)+R(1,k-1)}
 C={n,k,bags:Array(k).fill(0),chest:0,left:n,moves:0,done:false};drawCoins()}
function drawCoins(){const c=C,rem=c.n%c.k,each=Math.floor(c.n/c.k);
 $("#stage").innerHTML=`<h2>🪙 Поділи дукати порівну</h2><p class="tip">Отаман приніс <b>${c.n}</b> дукатів. Поділи їх <b>порівну</b> між <b>${c.k}</b> козаками: натисни на козака, щоб дати йому дукат.${S.d===3?" Те, що не ділиться порівну, поклади у <b>скриню</b> — це остача.":""}</p>
 <div class="pile">${"<span class='cn'>🪙</span>".repeat(c.left)||'<span class="muted">Купка порожня</span>'}</div>
 <div class="kozaky">${c.bags.map((b,i)=>`<button class="kz${c.done?"":""}" data-i="${i}"><span class="kf">${["🧔","👨‍🦱","🧑","👴","👱"][i]}</span><b>Козак ${i+1}</b><span class="bag">${b?"🪙".repeat(Math.min(b,8))+(b>8?"…":""):"—"}</span><b class="cnt">${b}</b></button>`).join("")}
 ${S.d===3?`<button class="kz chest" data-i="chest"><span class="kf">🧰</span><b>Скриня</b><span class="bag">${c.chest?"🪙".repeat(c.chest):"—"}</span><b class="cnt">${c.chest}</b></button>`:""}</div>
 <div class="row"><button class="btn ghost" id="undo">↺ Почати знову</button></div>
 <div id="q" ${c.left?"hidden":""}><p class="tip"><b>Запиши ділення:</b> ${c.n} : ${c.k} = <input class="ti" id="q1" inputmode="numeric" maxlength="3">${S.d===3?` (ост. <input class="ti" id="q2" inputmode="numeric" maxlength="2">)`:""}</p><button class="btn" id="chk">Перевірити</button></div><div id="fbx"></div>`;
 $("#stage").querySelectorAll(".kz").forEach(b=>b.onclick=()=>{if(!c.left||c.done)return;const i=b.dataset.i;if(i==="chest")c.chest++;else c.bags[+i]++;c.left--;c.moves++;drawCoins()});
 $("#undo").onclick=()=>{C={...c,bags:Array(c.k).fill(0),chest:0,left:c.n,moves:0,done:false};drawCoins()};
 const ch=$("#chk");if(ch)ch.onclick=()=>{const eq=c.bags.every(b=>b===each),q1=+$("#q1").value,q2=S.d===3?+$("#q2").value:0;
  if(!eq){$("#fbx").innerHTML=`<div class="msg bad">Не порівну! У козаків: ${c.bags.join(", ")}. Забери зайві або доклади.</div>`;return}
  if(S.d===3&&c.chest!==rem){$("#fbx").innerHTML=`<div class="msg bad">У скрині має лишитися стільки, скільки не ділиться порівну.</div>`;return}
  if(q1!==each||(S.d===3&&q2!==rem)){$("#fbx").innerHTML=`<div class="msg bad">Подивись на кожного козака: скільки в нього дукатів?</div>`;return}
  c.done=true;$("#fbx").innerHTML=winBox(3,`Порівну! ${c.n} : ${c.k} = ${each}${rem?" (ост. "+rem+")":""}. Кожен козак задоволений!`);$("#again").onclick=coins}}
// ===== Переливання =====
const JL={1:{cap:[5,3],start:[0,0],goal:2,opt:2,txt:"Набери рівно <b>2 л</b> води в будь-якому відрі."},2:{cap:[5,3],start:[0,0],goal:4,opt:6,txt:"Набери рівно <b>4 л</b> у великому відрі."},3:{cap:[8,5,3],start:[8,0,0],goal:"44",opt:7,txt:"Поділи <b>8 л</b> молока порівну: по <b>4 л</b> у двох найбільших глечиках."}};
let J=null;
function jugs(){const L=JL[S.d];J={v:L.start.slice(),moves:0,sel:null,done:false};drawJugs()}
function solved(){const L=JL[S.d];return S.d===3?(J.v[0]===4&&J.v[1]===4):S.d===2?J.v[0]===4:J.v.includes(2)}
function drawJugs(){const L=JL[S.d];
 $("#stage").innerHTML=`<h2>🪣 Козацьке переливання</h2><p class="tip">${L.txt} Натисни відро, з якого ллєш, потім — куди. ${S.d<3?"Біля криниці можна <b>наповнити</b> чи <b>вилити</b> відро.":"Криниці немає — лише переливай між глечиками."}</p>
 <div class="jugs">${L.cap.map((c,i)=>`<div class="jug${J.sel===i?" sel":""}" data-i="${i}" role="button" tabindex="0" aria-label="Відро ${c} л, у ньому ${J.v[i]} л"><div class="jbody" style="height:${40+c*14}px"><div class="water" style="height:${J.v[i]/c*100}%"></div><b>${J.v[i]} л</b></div><small>місткість ${c} л</small>
 ${S.d<3?`<div class="row" style="justify-content:center;gap:4px"><button class="chip" data-f="${i}">🚰 Наповнити</button><button class="chip" data-e="${i}">⬇️ Вилити</button></div>`:""}</div>`).join("")}</div>
 <p class="tip" style="text-align:center">Ходів: <b>${J.moves}</b> · найкращий результат: ${L.opt}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="reset">↺ Почати знову</button></div><div id="fbx"></div>`;
 $("#stage").querySelectorAll(".jug").forEach(j=>j.onclick=e=>{if(J.done||e.target.closest("button"))return;const i=+j.dataset.i;if(J.sel==null){J.sel=i}else if(J.sel===i){J.sel=null}else{const a=J.sel,cap=L.cap[i],x=Math.min(J.v[a],cap-J.v[i]);if(x>0){J.v[a]-=x;J.v[i]+=x;J.moves++}J.sel=null;check()}drawJugs()});
 $("#stage").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(J.done)return;const i=+b.dataset.f;if(J.v[i]<L.cap[i]){J.v[i]=L.cap[i];J.moves++;check()}drawJugs()});
 $("#stage").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{if(J.done)return;const i=+b.dataset.e;if(J.v[i]>0){J.v[i]=0;J.moves++;check()}drawJugs()});
 $("#reset").onclick=jugs;if(J.done){$("#fbx").innerHTML=J.win;$("#again").onclick=jugs}}
function check(){if(solved()&&!J.done){J.done=true;const L=JL[S.d];const st=J.moves<=L.opt?3:J.moves<=L.opt+3?2:1;J.win=winBox(st,`Вийшло за ${J.moves} ходів!${st<3?" Спробуй за "+L.opt+".":" Це найкоротший шлях!"}`)}}
$("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=cur==="dark"?"light":"dark"};
start();
</script>
