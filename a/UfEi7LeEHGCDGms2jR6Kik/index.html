          el("div",{class:"f"},el("input",{type:"text",id:"jName",placeholder:"Прізвище та ім'я",autocomplete:"off","aria-label":"Прізвище та ім'я"}),el("input",{type:"text",id:"jCls",placeholder:"Клас, 5-А",maxlength:"6",autocomplete:"off","aria-label":"Клас"})),
          el("div",{},el("a",{class:"sendgo",id:"jSend",href:"#",target:"_blank",rel:"noopener"},"Надіслати вчителю")),
          el("div",{class:"muted",id:"jMsg"},"Спершу натисни «Завершити й отримати оцінку». Потім відкриється Google Форма з твоїм результатом — натисни в ній «Надіслати». Вхід в акаунт не потрібен."))),
      el("div",{class:"card"},
        el("h2",{},"Рейтинг класу"),
        el("p",{class:"muted",style:"margin:0"},"Введи нікнейм або код від учителя (не прізвище) і збережи свій XP."),
        el("div",{class:"actions"},el("input",{type:"text",id:"nick",maxlength:"16",placeholder:"Напр. Біт_5А",style:"max-width:220px","aria-label":"Нікнейм"}),el("button",{class:"btn",id:"saveRank",type:"button"},"Зберегти"),el("span",{id:"rankMsg",class:"muted"})),
        el("div",{class:"tblwrap"},el("table",{class:"rank"},el("thead",{},el("tr",{},el("th",{},"#"),el("th",{},"Нікнейм"),el("th",{},"XP"),el("th",{},"Місія"))),el("tbody",{id:"rankBody"},el("tr",{},el("td",{colspan:"4",class:"muted"},"Рейтинг завантажується…"))))))
    )),
  el("button",{id:"jFab",type:"button"},"📤 Надіслати вчителю")
);

/* ---------- таймер ---------- */
function elapsed(){ return S.t0 ? ((S.tEnd||Date.now())-S.t0)/1000 : 0; }
function tick(){ const now=Date.now(); if(S.t0 && !S.tEnd && S.lastTick){ const d=(now-S.lastTick)/1000; if(S.tab==="ex") S.exT+=d; if(S.tab==="mission") S.mT+=d; } S.lastTick=now;
  const T=elapsed(), h=$("#hudT"); h.textContent="⏱ "+fmt(T)+(S.tEnd?" ✓":""); h.classList.toggle("over",T>NORM&&!S.tEnd); }
function start(){ if(!S.t0 && !S.frozen){ S.t0=Date.now(); S.lastTick=S.t0; } }
setInterval(tick,1000);
const wrap=document.querySelector(".wrap");
wrap.addEventListener("pointerdown",e=>{ if(e.target.closest("#p-warm,#p-ex,#p-mission")) start(); },true);
wrap.addEventListener("keydown",e=>{ if(e.target.closest("#p-warm,#p-ex,#p-mission")) start(); },true);

/* ---------- вкладки ---------- */
function showTab(t){ tick(); S.tab=t;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  document.querySelectorAll("section.panel[id^=p-]").forEach(p=>p.hidden=p.id!=="p-"+t);
  if(t==="res") renderRes(); if(t==="mission" && window.MISSION && MISSION.onShow) MISSION.onShow(); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.t)));

/* ---------- ефекти ---------- */
function floatAt(node,text,color){ if(RM||!node) return; const r=node.getBoundingClientRect(); const d=el("div",{class:"float"},text); if(color) d.style.color=color; d.style.left=(r.left+r.width/2)+"px"; d.style.top=r.top+"px"; document.body.appendChild(d); setTimeout(()=>d.remove(),1200); }
function confetti(){ if(RM) return; const c=$("#confetti"); c.hidden=false; const ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cls=getComputedStyle(document.documentElement).getPropertyValue("--class").trim()||"#c2255c"; const cols=[cls,"#ffb020","#2e7d32","#2f5bea","#7a4fd8"];
  const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:Math.random()*6.28,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function fr(){ ctx.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.r*40)/30);p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore();}); if(++f<140) requestAnimationFrame(fr); else { ctx.clearRect(0,0,c.width,c.height); c.hidden=true; } })(); }
function hurt(node){ if(!node) return; node.classList.remove("hurt","shake"); void node.offsetWidth; node.classList.add(node.classList.contains("card")?"hurt":"shake"); }

/* ---------- універсальні завдання (вправи й розминка) ---------- */
function buildTask(ex, st, onDone, opts){
  const card=el("div",{class:"card"+(st.done?" done":"")});
  card.append(el("div",{class:"qhead"},el("h3",{},opts.label),ex.lv?el("span",{class:"lvl"},LV[ex.lv]+(ex.trend?" · 🔥 у тренді":"")):null), el("p",{class:"q"},ex.q));
  if(ex.how) card.append(el("p",{class:"how"},"👉 "+ex.how));
  if(ex.pre) card.append(el("pre",{class:"mono",style:"margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre"},ex.pre));
  const body=el("div",{style:"display:grid;gap:8px"}); let get; const fb=el("div",{"aria-live":"polite"});
  const btn=el("button",{class:"btn",type:"button"},"Перевірити");
  if(ex.type==="choice"){ let sel=null; const box=el("div",{class:"opts"});
    shuffle(ex.o.map((t,i)=>i),opts.seed).forEach(i=>box.append(el("button",{class:"opt",type:"button","aria-pressed":"false","data-i":i,onclick:()=>{sel=i;box.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x.dataset.i==i));}},ex.o[i])));
    body.append(box); get=()=>sel===ex.a; }
  else if(ex.type==="input"||ex.type==="number"){ const inp=el("input",{type:ex.type==="number"?"number":"text",autocomplete:"off","aria-label":"Відповідь",placeholder:ex.ph||"Твоя відповідь"}); body.append(inp);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") btn.click(); });
    get=()=> ex.type==="number" ? parseFloat(String(inp.value).replace(",","."))===ex.a : (ex.re ? new RegExp(ex.re,ex.flags??"i").test(inp.value.trim()) : ex.a.map(norm).includes(norm(inp.value))); }
  else if(ex.type==="chips"){ const pick={};
    ex.rows.forEach((r,ri)=>{ const ch=el("div",{class:"chips"}); ex.cats.forEach((c,ci)=>ch.append(el("button",{class:"chip",type:"button","aria-pressed":"false",onclick:()=>{pick[ri]=ci;ch.querySelectorAll(".chip").forEach((x,j)=>x.setAttribute("aria-pressed",j===ci));}},c))); body.append(el("div",{class:"row"},el("span",{},r[0]),ch)); });
    get=()=>ex.rows.every((r,ri)=>pick[ri]===r[1]); }
  else if(ex.type==="match"){ const Lc=el("div",{class:"col"}), Rc=el("div",{class:"col"}); let sel=null, ok=0;
    ex.pairs.forEach((p,i)=>Lc.append(el("button",{class:"mi",type:"button","data-i":i},p[0])));
    shuffle(ex.pairs.map((p,i)=>i),opts.seed+3).forEach(i=>Rc.append(el("button",{class:"mi",type:"button","data-i":i},ex.pairs[i][1])));
    Lc.addEventListener("click",e=>{ const b=e.target.closest(".mi"); if(!b||b.classList.contains("paired")) return; Lc.querySelectorAll(".mi").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=b; });
    Rc.addEventListener("click",e=>{ const b=e.target.closest(".mi"); if(!b||b.classList.contains("paired")||st.done) return; if(!sel){ fb.className="fb info"; fb.textContent="Спершу обери картку ліворуч."; return; }
      if(b.dataset.i===sel.dataset.i){ b.classList.add("paired"); sel.classList.remove("sel"); sel.classList.add("paired"); sel=null; ok++; }
      else { hurt(b); hurt(sel); st.tries++; fb.className="fb bad"; fb.textContent="Ця пара не підходить. Спробуй іншу!"; } });
    body.append(el("div",{class:"match"},Lc,Rc)); get=()=>ok===ex.pairs.length; }
  else if(ex.type==="order"){ let built=[]; const seq=el("div",{class:"seq"}), bank=el("div",{class:"chips"});
    const draw=()=>{ seq.innerHTML=""; bank.innerHTML="";
      built.forEach((i,p)=>seq.append(el("div",{class:"step"},el("b",{},(p+1)+"."),el("span",{},ex.items[i]),el("button",{type:"button","aria-label":"Прибрати крок",onclick:()=>{built.splice(p,1);draw();}},"✕"))));
      shuffle(ex.items.map((t,i)=>i),opts.seed+7).filter(i=>!built.includes(i)).forEach(i=>bank.append(el("button",{class:"chip",type:"button",onclick:()=>{built.push(i);draw();}},ex.items[i]))); };
    draw(); body.append(seq,bank); get=()=>built.length===ex.items.length && built.every((v,i)=>v===i); }
  else if(ex.type==="errors"){ const picked=new Set(); const tb=el("tbody");
    ex.rows.forEach((r,ri)=>{ const tr=el("tr",{tabindex:"0"},...r.slice(0,-1).map(c=>el("td",{},c))); const tg=()=>{picked.has(ri)?picked.delete(ri):picked.add(ri);tr.classList.toggle("pick");}; tr.addEventListener("click",tg); tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tg();}}); tb.append(tr); });
    body.append(el("div",{class:"tblwrap"},el("table",{class:"err"},el("thead",{},el("tr",{},...ex.head.map(h=>el("th",{},h)))),tb)));
    get=()=>ex.rows.every((r,ri)=>picked.has(ri)===!!r[r.length-1]); }
  card.append(body);
  if(ex.hw){ const box=el("div",{class:"hints"}); const b=el("button",{class:"hintbtn",type:"button"},"💡 Слова-підказки"); b.addEventListener("click",()=>{ b.remove(); ex.hw.forEach(w=>box.append(el("span",{class:"hw"},w))); }); box.append(b); card.append(box); }
  btn.addEventListener("click",()=>{ if(st.done||S.frozen) return; start();
    if(get()){ st.done=true; st.pts=st.tries===0?1:(st.tries===1?0.5:0); const gain=opts.warm?5:(st.tries===0?10:5); S.xp+=gain;
      fb.className="fb ok"; fb.textContent=(opts.warm?"Так! ":"Молодець! ")+(opts.warm?"+"+gain+" XP":(st.pts===1?"+1 бал":st.pts?"+0,5 бала":"Тепер правильно (0 балів)"))+(ex.e?" "+ex.e:""); card.classList.add("done"); btn.disabled=true; floatAt(btn,"+"+gain+" XP"); onDone(); }
    else { st.tries++; fb.className="fb bad"; fb.textContent="Ще не так. Спробуй ще раз!"+(st.tries>=2&&ex.hw?" Натисни «💡 Слова-підказки».":""); hurt(card); hud(); } });
  if(st.done){ btn.disabled=true; fb.className="fb ok"; fb.textContent="Виконано ✓"; }
  card.append(el("div",{class:"actions"},btn),fb);
  return card;
}
function renderWarm(){ const box=$("#warmList"); box.innerHTML=""; L.warm.forEach((ex,i)=>{ const st=S.warm[i]||(S.warm[i]={tries:0,done:false,pts:0}); box.append(buildTask(ex,st,hud,{label:"Пригадай "+(i+1)+(ex.from?" · "+ex.from:""),seed:100+i,warm:true})); });
  box.append(NEXT("cards","Далі: Картки →")); }
function renderEx(){ const box=$("#exList"); box.innerHTML=""; L.ex.forEach((ex,i)=>{ const st=S.ex[i]||(S.ex[i]={tries:0,done:false,pts:0}); box.append(buildTask(ex,st,hud,{label:"Вправа "+(i+1),seed:7*(i+1)})); }); box.append(NEXT("mission","Далі: "+L.mission.tab+" →")); }
function renderCards(){ const f=$("#flash"); L.cards.forEach(([t,d])=>{ const c=el("button",{class:"fc",type:"button","aria-expanded":"false"},el("span",{class:"t"},t),el("span",{class:"d",hidden:true},d)); c.addEventListener("click",()=>{ const o=c.classList.toggle("open"); c.querySelector(".d").hidden=!o; c.setAttribute("aria-expanded",o); }); f.append(c); }); }

/* ---------- місія: API ---------- */
const api = { el, shuffle, norm, fmt, floatAt, confetti, hurt, start, root:$("#mRoot"),
  frozen:()=>!!S.frozen,
  xp(n,node){ S.xp+=n; if(node) floatAt(node,"+"+n+" XP"); hud(); },
  report(r){ Object.assign(S.m,r); const p=Math.round((S.m.items.filter(x=>x.done).length/Math.max(1,S.m.items.length))*100); $("#mBar").style.width=p+"%";
    $("#mStat").textContent="Виконано "+S.m.items.filter(x=>x.done).length+" з "+S.m.items.length+" · помилок у місії: "+S.m.errors+(S.m.label?" · "+S.m.label:""); hud(); }
};

/* ---------- оцінка ---------- */
function compute(){
  const exPts=L.ex.reduce((s,e,i)=>s+((S.ex[i]&&S.ex[i].pts)||0),0), exErr=L.ex.reduce((s,e,i)=>s+Math.min(2,(S.ex[i]&&S.ex[i].tries)||0),0);
  const E=exPts/L.ex.length, M=Math.max(0,Math.min(1,S.m.score||0)), P=0.6*E+0.4*M;
  const mErr=(S.m.items&&S.m.items.length&&S.m.items.some(x=>typeof x.err==="number"))?S.m.items.reduce((s,x)=>s+Math.min(2,x.err||0),0):(S.m.errors||0);
  const errors=exErr+mErr, T=elapsed();
  const errPen=Math.min(3,Math.max(0,errors-2)*0.25), timePen=T<=NORM?0:(T<=NORM*1.5?1:2);
  let grade=Math.max(1,Math.min(12,Math.round(12*P-errPen-timePen))); if(grade===12 && !(P>=0.95&&errors<=2&&T<=NORM)) grade=11;
  const any=exPts>0||M>0;
  return {grade:any?grade:null, exPts, E, M, P, errors, errPen, timePen, T, tooFast:any&&T>0&&T<NORM*0.3};
}
window.computeGrade=compute;
function lvlWord(g){ return g==null?"з 12":g>=10?"високий рівень":g>=7?"достатній рівень":g>=4?"середній рівень":"початковий рівень"; }
function renderRes(){ tick(); const r=S.frozen||compute();
  $("#rGrade").textContent=r.grade==null?"—":r.grade; $("#rLvl").textContent=lvlWord(r.grade);
  $("#rEx").textContent=dec(r.exPts)+" з "+L.ex.length; $("#rM").textContent=Math.round(r.M*100)+"%"; $("#rErr").textContent=r.errors; $("#rXp").textContent=S.xp;
  $("#rT").textContent=fmt(r.T); $("#rNorm").textContent="норма "+fmt(NORM)+" · вправи "+fmt(S.exT)+" · місія "+fmt(S.mT);
  const pen=[]; if(r.errPen) pen.push("штраф за помилки −"+dec(r.errPen)); if(r.timePen) pen.push("штраф за час −"+r.timePen);
  const rp=$("#rPen"); rp.innerHTML=""; rp.append((pen.length?pen.join(" · "):"Штрафів немає")+" · спроба №"+S.attempt+" · оцінка = 60 % вправи + 40 % місія");
  if(r.tooFast) rp.append(el("div",{class:"warnline"},"⚠ занадто швидко"));
  $("#finish").hidden=!!S.frozen; $("#again").hidden=!S.frozen; }
$("#finish").addEventListener("click",()=>{ tick(); S.tEnd=Date.now(); if(!S.t0) S.t0=S.tEnd; S.frozen=compute(); renderRes(); hud(); $("#jMsg").textContent="Оцінку зафіксовано. Впиши прізвище, ім'я та клас і натисни «Надіслати вчителю»."; $("#jName").focus(); });
$("#again").addEventListener("click",()=>{ try{ localStorage.setItem(KEY,S.attempt); }catch(e){} location.reload(); });

/* ---------- надіслати вчителю ---------- */
const clean = v => String(v==null?"":v).replace(/[|\n\r]/g," ").trim() || "—";
function taskStr(){ const a=[];
  L.ex.forEach((e,i)=>{ const s=S.ex[i]||{tries:0,done:false}; a.push("В"+(i+1)+":"+(s.done?s.tries:(s.tries?s.tries+"н":"н"))); });
  S.m.items.forEach(it=>a.push(it.code+":"+(it.done?(it.err||0):((it.err||0)+"н").replace(/^0н$/,"н"))));
  return a.join(","); }
function sendLine(name,cls){ const r=S.frozen||compute();
  return ["v1",GR,L.title,clean(cls),clean(name),S.attempt,"—",r.grade==null?"—":r.grade,dec(r.exPts)+" з "+L.ex.length,Math.round(r.M*100),r.errors,hm(r.T),hm(NORM),r.tooFast?"занадто швидко":"",S.frozen?"завершено":"не завершено",taskStr()].join("|"); }
window.G5line=sendLine;
$("#jSend").addEventListener("click",e=>{ const n=$("#jName").value.trim(), c=$("#jCls").value.trim(), m=$("#jMsg");
  if(!S.frozen){ e.preventDefault(); m.textContent="Спершу натисни «Завершити й отримати оцінку» ☝️"; $("#finish").focus(); return; }
  if(!n||!c){ e.preventDefault(); m.textContent="Впиши прізвище, ім'я та клас ☝️"; (n?$("#jCls"):$("#jName")).focus(); return; }
  e.currentTarget.href=FORM+encodeURIComponent(sendLine(n,c)); m.textContent="Форму відкрито в новій вкладці — натисни там «Надіслати» ✔"; });
$("#jFab").addEventListener("click",()=>{ showTab("res"); $("#sendbox").scrollIntoView({behavior:RM?"auto":"smooth",block:"center"}); (S.frozen?$("#jName"):$("#finish")).focus({preventScroll:true}); });

/* ---------- HUD ---------- */
function hud(){ const d=L.ex.filter((e,i)=>S.ex[i]&&S.ex[i].done).length; $("#hudEx").textContent="Вправи: "+d+"/"+L.ex.length;
  const md=S.m.items.filter(x=>x.done).length; $("#hudM").textContent=L.mission.icon+" "+md+"/"+(S.m.items.length||"…"); $("#hudXp").textContent="XP "+S.xp; }

/* ---------- рейтинг ---------- */
let DB=null, ME=null;
function drawRank(docs){ const tb=$("#rankBody"); tb.innerHTML=""; const rows=docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(b.xp-a.xp)||(b.m-a.m)).slice(0,40);
  if(!rows.length){ tb.append(el("tr",{},el("td",{colspan:"4",class:"muted"},"Поки порожньо. Будь першим!"))); return; }
  rows.forEach((r,i)=>tb.append(el("tr",{},el("td",{},String(i+1)),el("td",{},String(r.nick||"?")),el("td",{},String(r.xp|0)),el("td",{},String(r.m|0)+"%")))); }
(async()=>{ try{ if(!window.claude||!claude.use) throw 0; const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user) throw 0; DB=db; ME=await user.id();
  db.collection("board").onSnapshot(s=>drawRank(s.docs),()=>{ $("#rankBody").innerHTML='<tr><td colspan="4" class="muted">Рейтинг зараз недоступний.</td></tr>'; }); }
  catch(e){ $("#rankBody").innerHTML='<tr><td colspan="4" class="muted">Рейтинг працює, коли сторінку відкрито з увійденим акаунтом.</td></tr>'; $("#saveRank").disabled=true; } })();
$("#saveRank").addEventListener("click",async()=>{ const nick=$("#nick").value.trim().slice(0,16); if(!nick){ $("#rankMsg").textContent="Введи нікнейм."; return; }
  if(!DB||!ME){ $("#rankMsg").textContent="Рейтинг недоступний."; return; }
  try{ await DB.collection("board").doc(ME).set({nick,xp:S.xp,m:Math.round((S.m.score||0)*100),at:new Date().toISOString()}); $("#rankMsg").textContent="Збережено! ⭐"; }catch(e){ $("#rankMsg").textContent="Не вдалося зберегти. Спробуй пізніше."; } });

/* ---------- старт ---------- */
renderWarm(); renderEx(); renderCards(); showTab("warm"); hud();
if(window.MISSION) MISSION.init(api, L.mission);
})();
</script></body></html>
