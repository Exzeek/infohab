.pq.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.pq .st{font-size:14px;font-weight:700}
.topicTag{font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--class)}
.mat a{color:var(--class);font-weight:800}
.mat li{margin:4px 0}
.gate{display:grid;gap:8px}
.gate .f{display:flex;flex-wrap:wrap;gap:8px}
.gate input{flex:1 1 200px;font:600 16px var(--f-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gate input#pCls{flex:0 1 120px}
.report{white-space:pre-wrap;font:500 13px var(--f-mono);background:var(--surface-2);border-radius:12px;padding:12px;max-height:280px;overflow:auto}
.fabP{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--send);color:var(--send-ink);border:0;border-radius:999px;padding:12px 18px;font:800 16px var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.rub{width:100%;border-collapse:collapse;font-size:15px}
.rub td,.rub th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
