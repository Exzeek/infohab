<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Немає інтернету — urokinfo</title><meta name="description" content="Сторінка без з’єднання">
<link rel="canonical" href="https://urokinfo.com.ua/offline/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="robots" content="noindex">

<link rel="stylesheet" href="/site/fonts.css">
<style>
:root{--bg:#f6f7fb;--s:#fff;--ink:#1b1e28;--mut:#5c6375;--line:#e3e6ee;--acc:#c2255c}
@media (prefers-color-scheme:dark){:root{--bg:#12141b;--s:#1b1e28;--ink:#eef0f5;--mut:#a3a9b8;--line:#2c3040;--acc:#f06595}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:22px 16px 40px}h1{font:800 clamp(24px,5vw,34px)/1.15 Unbounded,sans-serif;margin:0 0 8px}
h2{font:800 19px Unbounded,sans-serif;margin:30px 0 10px}h3{font-size:17px;margin:18px 0 4px}.lead{color:var(--mut);font-size:18px}
a{color:var(--acc)}.toc{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toc a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s);text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.box{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:10px 0}
ol.st li,ul.st li{margin:6px 0}kbd,code{font:700 15px ui-monospace,Menlo,monospace;background:var(--s);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
details{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}summary{font-weight:800;cursor:pointer}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#5b3cc4"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png"></head><body><main>
<h1>Немає інтернету</h1><p class="lead">Ця сторінка ще не збережена на пристрої. Ось що можна відкрити без мережі:</p>
<div class="box" id="l">Пошук збережених сторінок…</div><p><a href="/">Спробувати ще раз</a></p>
<script>(async()=>{try{const out=[];for(const n of await caches.keys()){const c=await caches.open(n);for(const r of await c.keys()){const u=new URL(r.url);if(u.origin===location.origin&&u.pathname.endsWith("/")&&!/offline/.test(u.pathname))out.push(u.pathname+u.search)}}
let H=[];try{H=JSON.parse(localStorage.getItem("ui-hist")||"[]")}catch(e){}const T={};H.forEach(x=>T[x.u.split("#")[0]]=x.t);
document.getElementById("l").innerHTML=out.length?"<ul>"+[...new Set(out)].map(u=>`<li><a href="${u}">${(T[u]||u).replace(/</g,"&lt;")}</a></li>`).join("")+"</ul>":"Збережених сторінок ще немає."}catch(e){document.getElementById("l").textContent="Браузер не підтримує офлайн-збереження."}})()</script></main><script src="/site/nav.js" defer></script></body></html>
