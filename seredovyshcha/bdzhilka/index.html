<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бджілка-виконавець — алгоритми для 2–4 класу онлайн</title>
<meta name="description" content="Бджілка-виконавець у браузері: склади алгоритм зі стрілок, повторень і знайди помилку. 18 рівнів для 2–4 класу з автоперевіркою, без реєстрації.">
<link rel="canonical" href="https://urokinfo.com.ua/seredovyshcha/bdzhilka/"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Бджілка-виконавець — алгоритми для 2–4 класу"><meta property="og:locale" content="uk_UA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<style>
:root{--acc:#d97706}@media (prefers-color-scheme:dark){:root{--acc:#fbbf24}}
body{font-size:19px}
.lvbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);align-items:center}
.lvbar button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:800 15px var(--f-body)}
.lvbar button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lvbar button.cur{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.play{display:flex;gap:18px;flex-wrap:wrap;padding:16px;align-items:flex-start;justify-content:center}
.task{max-width:820px;width:100%;margin:0 auto;padding:12px 16px 0;font-weight:700}
.task small{display:block;color:var(--muted);font-weight:600;font-size:16px}
.field{display:grid;gap:4px;background:#bfe6a8;padding:8px;border-radius:18px;touch-action:manipulation}
.field div{width:clamp(44px,9vw,64px);aspect-ratio:1;border-radius:10px;background:#d9f2c9;display:grid;place-items:center;font-size:clamp(26px,5.5vw,40px);position:relative}
.field div.rock{background:#9aa49a}
.bee{position:absolute;inset:0;display:grid;place-items:center;transition:transform .32s;z-index:2;filter:drop-shadow(0 2px 2px #0004)}
.bee.shake{animation:sh .4s}@keyframes sh{25%{translate:-6px}75%{translate:6px}}
.ctrl{display:grid;gap:12px;min-width:280px;max-width:360px;flex:1}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pad button,.rep button{height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:30px;color:var(--ink)}
.pad button:active{transform:scale(.95)}
.rep{display:flex;gap:8px;justify-content:center}.rep button{width:auto;padding:0 12px;font:800 18px var(--f-body);height:48px}
.prog{min-height:76px;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.prog span{min-width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 18%,var(--surface));display:inline-grid;place-items:center;font-size:24px;padding:0 6px;cursor:pointer;border:2px solid transparent}
.prog span b{font:800 15px var(--f-body);margin-left:2px}
.prog span.run{border-color:var(--acc)}
.prog span.bug{border-color:var(--bad)}
.prog:empty::before{content:"Тут з'явиться твій алгоритм";color:var(--muted);font-size:16px;padding:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.acts .btn{font-size:18px;padding:12px 18px}
.say{font-weight:800;text-align:center;min-height:1.4em;font-size:18px}
.say.ok{color:var(--ok)}.say.bad{color:var(--bad)}
.hand{position:absolute;font-size:40px;pointer-events:none;animation:hp 1.2s infinite;z-index:5}@keyframes hp{50%{transform:translate(6px,8px)}}
.lim{color:var(--muted);font-size:15px;text-align:center}
@media (prefers-reduced-motion:reduce){.bee{transition:none}.hand{animation:none}}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#5b3cc4"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png"><script src="/site/app.js" defer></script><!--og--><meta property="og:image" content="https://urokinfo.com.ua/site/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><!--/og--></head><body>
<main id="app">
 <div class="lvbar" id="lvbar"></div>
 <div class="task" id="task"></div>
 <div class="play">
  <div class="field" id="field" aria-label="Поле"></div>
  <div class="ctrl">
   <div class="pad"><span></span><button data-d="U" aria-label="Вгору">⬆️</button><span></span><button data-d="L" aria-label="Ліворуч">⬅️</button><button data-d="D" aria-label="Вниз">⬇️</button><button data-d="R" aria-label="Праворуч">➡️</button></div>
   <div class="rep" id="rep"><button data-x="2">×2</button><button data-x="3">×3</button><button data-x="4">×4</button></div>
   <div class="prog" id="prog" aria-label="Алгоритм"></div>
   <div class="lim" id="lim"></div>
   <div class="acts"><button class="btn" id="run">▶ Запустити</button><button class="btn ghost" id="undo">⌫</button><button class="btn ghost" id="clr">Очистити</button></div>
   <div class="say" id="say" role="status"></div>
  </div>
 </div>
</main>
<script src="../kit.js"></script>
<script>
const $=s=>document.querySelector(s);
const ARW={U:"⬆️",D:"⬇️",L:"⬅️",R:"➡️"},DV={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
/* легенда: . трава, # камінь, F квітка, B бджілка (старт), H вулик */
const L=[
 {m:["B.F...","......"],t:"Долети до квітки.",rep:0},
 {m:["B.....",".....F"],t:"Квітка далі — склади довший шлях.",rep:0},
 {m:["B..#..","...#.F","......"],t:"Облети камінь!",rep:0},
 {m:["B...F.","......","..F..."],t:"Збери обидві квітки.",rep:0},
 {m:["F.#...","..#.H.","B....."],t:"Збери квітку й прилети у вулик 🏠.",rep:0,home:1},
 {m:["B.#F..","..#...","....#.","F...#H"],t:"Збери всі квітки й повертайся у вулик.",rep:0,home:1},
 {m:["B.....F"],t:"Скористайся повторенням: ➡️ і кнопка ×. Не більше 2 блоків.",rep:1,max:2},
 {m:["B....",".....",".....","....F"],t:"Вниз і праворуч з повтореннями. Не більше 3 блоків.",rep:1,max:3},
 {m:["B..F","...#","F...","...H"],t:"Збери квітки й прилети у вулик. Не більше 6 блоків.",rep:1,max:6,home:1},
 {m:["B.#....","..#.##.","....#F.","##..#..","F.....H"],t:"Великий лабіринт: усі квітки й вулик. Не більше 10 блоків.",rep:1,max:10,home:1},
 {m:["B..F","....","F..H"],t:"Знайди помилку: бджілка мала зібрати квітки й прилетіти у вулик. Запусти, подивись, де вона зупинилась. Натисни на неправильний блок, щоб прибрати його, і додай правильний.",rep:1,bug:["R3","D1","D1","L3","R2"],home:1},
 {m:["B...","#.#.","F.#F","..#H"],t:"Знайди помилку в алгоритмі й виправ його. Підказка: бджілка не долітає.",rep:1,bug:["R1","D2","L1","R1","U2","R2","D2"],home:1},
];
const SETS={
 k2:{name:"2 клас: перші алгоритми (рівні 1–6)",cls:2,norm:15,lv:[0,1,2,3,4,5]},
 k3:{name:"3 клас: алгоритми й повторення (рівні 3–9)",cls:3,norm:18,lv:[2,3,4,5,6,7,8]},
 k4:{name:"4 клас: повторення й налагодження (рівні 6–12)",cls:4,norm:20,lv:[5,6,7,8,9,10,11]}
};
Object.values(SETS).forEach(s=>{s.story="Бджілка виконує команди по черзі. Склади алгоритм зі стрілок і натисни «Запустити». Помилився — нічого страшного, спробуй ще!";
  s.tasks=s.lv.map(i=>({t:"Рівень "+(i+1)+": "+L[i].t.split(".")[0]+".",ok:()=>!!done[i]}))});
let done={},cur=0,prog=[],busy=false,handEl=null;
function parse(lv){const m=lv.m;const g={w:m[0].length,h:m.length,cells:[],fl:[],b:null,home:null};
  m.forEach((row,y)=>[...row].forEach((ch,x)=>{g.cells.push(ch==="#"?"#":".");if(ch==="F")g.fl.push(x+","+y);if(ch==="B")g.b=[x,y];if(ch==="H")g.home=[x,y]}));return g}
let G;
function draw(pos,got){const f=$("#field");f.style.gridTemplateColumns=`repeat(${G.w},auto)`;f.innerHTML="";
  for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const d=document.createElement("div");const k=x+","+y;
    if(G.cells[y*G.w+x]==="#"){d.className="rock";d.textContent="🪨"}else if(G.fl.includes(k)&&!got.has(k))d.textContent="🌼";else if(G.home&&G.home[0]===x&&G.home[1]===y)d.textContent="🏠";
    if(pos[0]===x&&pos[1]===y){const b=document.createElement("span");b.className="bee";b.textContent="🐝";b.id="bee";d.append(b)}f.append(d)}}
function showProg(hi,bug){$("#prog").innerHTML=prog.map((c,i)=>`<span data-i="${i}" class="${i===hi?"run":""}${i===bug?" bug":""}" title="Натисни, щоб прибрати">${ARW[c[0]]}${+c.slice(1)>1?"<b>×"+c.slice(1)+"</b>":""}</span>`).join("");
  const lv=L[cur];$("#lim").textContent=lv.max?`Блоків: ${prog.length} з ${lv.max}`:`Блоків: ${prog.length}`}
function say(t,c){const s=$("#say");s.textContent=t;s.className="say "+(c||"")}
function lvbar(){const set=SETS[KIT.set];$("#lvbar").innerHTML=set.lv.map(i=>`<button data-l="${i}" class="${done[i]?"done":""} ${i===cur?"cur":""}" aria-label="Рівень ${i+1}">${i+1}</button>`).join("")}
function load(i){cur=i;const lv=L[i];G=parse(lv);prog=lv.bug?[...lv.bug]:[];$("#task").innerHTML=`Рівень ${i+1}. ${lv.t}<small>${lv.home?"Квіток: "+G.fl.length+" · потім у вулик 🏠":"Квіток: "+G.fl.length}</small>`;
  $("#rep").style.visibility=lv.rep?"visible":"hidden";draw(G.b,new Set());showProg();say("");lvbar();hand();save()}
function hand(){if(handEl){handEl.remove();handEl=null}if(cur!==0||prog.length||done[0])return;const b=document.querySelector('.pad [data-d="R"]');const r=b.getBoundingClientRect(),m=$("#app").getBoundingClientRect();
  handEl=document.createElement("div");handEl.className="hand";handEl.textContent="👆";handEl.style.left=(r.left-m.left+20)+"px";handEl.style.top=(r.top-m.top+$("#app").scrollTop+40)+"px";$("#app").append(handEl)}
function save(){KIT.store({done,cur})}
document.querySelectorAll(".pad [data-d]").forEach(b=>b.onclick=()=>{if(busy)return;const lv=L[cur];if(lv.max&&prog.length>=lv.max){say("Більше блоків не можна — спробуй повторення ×","bad");return}prog.push(b.dataset.d+"1");showProg();hand()});
$("#rep").onclick=e=>{const b=e.target.closest("button");if(!b||busy)return;if(!prog.length){say("Спершу обери стрілку, потім ×","bad");return}const l=prog[prog.length-1];prog[prog.length-1]=l[0]+b.dataset.x;showProg()};
$("#prog").onclick=e=>{const s=e.target.closest("span[data-i]");if(!s||busy)return;prog.splice(+s.dataset.i,1);showProg()};
$("#undo").onclick=()=>{if(busy)return;prog.pop();showProg()};
$("#clr").onclick=()=>{if(busy)return;prog=[];showProg();draw(G.b,new Set());say("")};
$("#lvbar").onclick=e=>{const b=e.target.closest("button");if(b&&!busy)load(+b.dataset.l)};
const wait=ms=>new Promise(r=>setTimeout(r,matchMedia("(prefers-reduced-motion:reduce)").matches?60:ms));
$("#run").onclick=async()=>{if(busy||!prog.length){if(!prog.length)say("Склади алгоритм зі стрілок","bad");return}busy=true;KIT.touch();
  let p=[...G.b];const got=new Set();draw(p,got);let fail="";
  outer:for(let i=0;i<prog.length;i++){const c=prog[i],n=+c.slice(1);for(let k=0;k<n;k++){showProg(i);const[dx,dy]=DV[c[0]];const nx=p[0]+dx,ny=p[1]+dy;
      if(nx<0||ny<0||nx>=G.w||ny>=G.h){fail="Ой! Бджілка вилетіла за край поля.";showProg(i,i);break outer}
      if(G.cells[ny*G.w+nx]==="#"){fail="Бум! Там камінь.";showProg(i,i);break outer}
      p=[nx,ny];if(G.fl.includes(p.join(",")))got.add(p.join(","));draw(p,got);await wait(380)}}
  if(fail){const b=$("#bee");b&&b.classList.add("shake");say(fail+" Виправ алгоритм.","bad");busy=false;return}
  const allF=got.size===G.fl.length,home=!L[cur].home||(G.home[0]===p[0]&&G.home[1]===p[1]);
  showProg();
  if(allF&&home){done[cur]=1;save();lvbar();KIT.refresh();say("Чудово! Рівень пройдено 🎉","ok");const set=SETS[KIT.set];const nx=set.lv.find(i=>!done[i]);const was=cur;if(nx!=null)setTimeout(()=>{if(!busy&&cur===was)load(nx)},1400)}
  else say(!allF?"Зібрано квіток: "+got.size+" з "+G.fl.length+". Спробуй ще!":"Квітки зібрано, але бджілка не у вулику 🏠","bad");
  busy=false};
KIT.start({id:"bdzhilka",title:"Бджілка-виконавець",sub:"алгоритми для 2–4 класу",cls:2,sets:SETS,onSet(k,fresh){const d=!fresh&&KIT.load(null);done=d?d.done||{}:{};const set=SETS[k];load(d&&set.lv.includes(d.cur)?d.cur:(set.lv.find(i=>!done[i])??set.lv[0]))}});
</script>
</body></html>
