<main id="app">
<div class="gw">
 <section class="card"><h3>📁 Робоча папка «site-ligy» <small id="wst"></small></h3><div class="tabs" id="tabs"></div><textarea class="ed" id="ed" spellcheck="false"></textarea></section>
 <section class="card"><h3>🌳 Граф комітів <small id="head"></small></h3><div id="graph"></div></section>
 <section class="term"><div class="out" id="out" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="in"><span id="ps">site-ligy $</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="введи команду, напр. git init  (help — список команд)" aria-label="Команда"></div></section>
</div>
</main>
<script src="../kit.js"></script>
<script>
const $=s=>document.querySelector(s);
const FILES0={"index.html":"<h1>Ліга 8-Б</h1>\n<p>Турнірна таблиця сезону</p>\n","style.css":"h1 { color: navy; }\n","README.md":"# Сайт ліги\n"};
let R,file="index.html",hist=[],hi=0;
function fresh(k){
  const r={init:false,work:JSON.parse(JSON.stringify(FILES0)),index:{},commits:[],br:{},head:"main",n:0,merging:null,log:[]};
  if(k==="conflict"){r.init=true;const c1=mk(r,"Перша версія сайту",[],{...FILES0});r.br.main=c1.id;
    const fb={...FILES0,"index.html":"<h1>Ліга 8-Б</h1>\n<p>Турнірна таблиця сезону</p>\n<p>Найкращий бомбардир: Тарас</p>\n"};const c2=mk(r,"Додано бомбардира",[c1.id],fb,"tablo");r.br.tablo=c2.id;
    const fm={...FILES0,"index.html":"<h1>Ліга 8-Б</h1>\n<p>Турнірна таблиця сезону</p>\n<p>Наступний матч: п'ятниця, 15:00</p>\n"};const c3=mk(r,"Додано дату матчу",[c1.id],fm,"main");r.br.main=c3.id;
    r.work={...fm};r.index={...fm};}
  return r}
function mk(r,msg,parents,snap,branch){const id=(++r.n*2654435761>>>0).toString(16).slice(0,7).padStart(7,"a");const c={id,msg,parents,snap:{...snap},branch:branch||r.head,t:r.n};r.commits.push(c);return c}
const C=id=>R.commits.find(c=>c.id===id);
const headC=()=>C(R.br[R.head]);
const snap=()=>headC()?headC().snap:{};
const eq=(a,b)=>JSON.stringify(Object.entries(a||{}).sort())===JSON.stringify(Object.entries(b||{}).sort());
function status(){const h=snap(),ix=R.index,w=R.work,staged=[],unst=[],untr=[];
  Object.keys({...h,...ix}).forEach(f=>{if((ix[f]??null)!==(h[f]??null))staged.push((h[f]==null?"новий файл: ":ix[f]==null?"видалено: ":"змінено: ")+f)});
  Object.keys(w).forEach(f=>{if(ix[f]==null&&h[f]==null)untr.push(f);else if(ix[f]!==w[f])unst.push("змінено: "+f)});return{staged,unst,untr}}
function ancestors(id){const s=new Set(),st=[id];while(st.length){const x=st.pop();if(!x||s.has(x))continue;s.add(x);(C(x)?.parents||[]).forEach(p=>st.push(p))}return s}
function mergeBase(a,b){const A=ancestors(a);let best=null;[...ancestors(b)].forEach(x=>{if(A.has(x)&&(!best||C(x).t>C(best).t))best=x});return best}
/* ---------- вивід ---------- */
function out(t,cls){const o=$("#out");const d=document.createElement("div");if(cls)d.className=cls;d.textContent=t;o.append(d);o.scrollTop=o.scrollHeight}
function outH(h){const o=$("#out");const d=document.createElement("div");d.innerHTML=h;o.append(d);o.scrollTop=o.scrollHeight}
const HELP=`Команди:
  git init                 — створити репозиторій
  git status               — що змінилось
  git add <файл> | git add .   — підготувати до коміту
  git commit -m "опис"     — зберегти версію
  git log [--oneline]      — історія комітів
  git branch [назва]       — список гілок / нова гілка
  git switch <гілка>       — перейти на гілку (або git checkout)
  git switch -c <назва>    — створити гілку й перейти
  git merge <гілка>        — злити гілку в поточну
  git diff                 — зміни, ще не додані через add
  clear                    — очистити екран`;
function run(line){
  const raw=line.trim();if(!raw)return;outH(`<span class="g">${KIT.esc($("#ps").textContent)}</span> ${KIT.esc(raw)}`);KIT.touch();R.log.push(raw);
  if(raw==="clear"){$("#out").innerHTML="";return}
  if(raw==="help"||raw==="git help"||raw==="git"){out(HELP,"d");return}
  const args=raw.match(/"[^"]*"|'[^']*'|\S+/g).map(a=>a.replace(/^["']|["']$/g,""));
  if(args[0]!=="git"){out(`${args[0]}: команду не знайдено. Підказка: команди починаються з «git». Введи help.`,"e");return}
  const c=args[1];
  if(c!=="init"&&!R.init){out("fatal: not a git repository — спершу виконай git init","e");return}
  switch(c){
   case"init":if(R.init){out("Репозиторій уже існує","d");break}R.init=true;R.head="main";out("Initialized empty Git repository in /site-ligy/.git/ — створено порожній репозиторій, гілка main","g");break;
   case"status":{const s=status();out("On branch "+R.head+(R.merging?" — злиття триває (є конфлікт)":""));if(!s.staged.length&&!s.unst.length&&!s.untr.length){out("nothing to commit, working tree clean — усе збережено","g");break}
     if(s.staged.length)out("Підготовлено до коміту (git add):\n  "+s.staged.join("\n  "),"g");if(s.unst.length)out("Змінено, але не додано:\n  "+s.unst.join("\n  "),"e");if(s.untr.length)out("Невідстежувані файли:\n  "+s.untr.join("\n  "),"e");break}
   case"add":{const f=args[2];if(!f){out("Вкажи файл: git add index.html або git add .","e");break}
     const list=f==="."||f==="-A"?Object.keys(R.work):[f];for(const x of list){if(R.work[x]==null){out(`fatal: pathspec '${x}' did not match any files — такого файлу немає`,"e");return}R.index[x]=R.work[x]}
     if(R.merging&&Object.values(R.index).some(v=>/<<<<<<<|>>>>>>>/.test(v)))out("Увага: у файлі ще є позначки конфлікту <<<<<<< / >>>>>>>","e");break}
   case"commit":{const mi=args.indexOf("-m");const msg=mi>0?args.slice(mi+1).join(" "):"";if(!msg){out('Додай опис: git commit -m "що змінено"',"e");break}
     if(Object.values(R.index).some(v=>/<<<<<<<|=======|>>>>>>>/.test(v))){out("error: є нерозв'язаний конфлікт — прибери позначки <<<<<<< ======= >>>>>>> і зроби git add","e");break}
     if(eq(R.index,snap())&&!R.merging){out("nothing to commit — спершу зміни файли й виконай git add","e");break}
     const parents=headC()?[headC().id]:[];if(R.merging)parents.push(R.merging);
     const cm=mk(R,msg,parents,R.index,R.head);R.br[R.head]=cm.id;R.merging=null;out(`[${R.head} ${cm.id}] ${msg}`,"g");break}
   case"log":{if(!headC()){out("Ще немає жодного коміту","d");break}const s=[...ancestors(headC().id)].map(C).sort((a,b)=>b.t-a.t);
     s.forEach(x=>{if(args[2]==="--oneline")outH(`<span class="c">${x.id}</span> ${KIT.esc(x.msg)}`);else{outH(`<span class="c">commit ${x.id}</span>${Object.entries(R.br).filter(([b,i])=>i===x.id).map(([b])=>` <span class="m">(${b})</span>`).join("")}`);out("    "+x.msg+(x.parents.length>1?"   [коміт злиття]":""))}});break}
   case"branch":{const n=args[2];if(!n){Object.keys({[R.head]:1,...R.br}).forEach(b=>outH((b===R.head?'<span class="g">* '+b+"</span>":"  "+b)));break}
     if(!headC()){out("fatal: спершу зроби хоча б один коміт","e");break}if(!/^[a-z0-9_\-]+$/i.test(n)){out("Назва гілки — латиницею без пробілів, напр. dizain","e");break}if(R.br[n]){out(`fatal: гілка '${n}' вже існує`,"e");break}R.br[n]=headC().id;out(`Створено гілку ${n}`,"g");break}
   case"switch":case"checkout":{let n=args[2],create=false;if(n==="-c"||n==="-b"){create=true;n=args[3]}if(!n){out("Вкажи гілку: git switch dizain","e");break}
     if(R.merging){out("error: спершу заверши злиття","e");break}
     if(create){if(!headC()){out("fatal: спершу зроби хоча б один коміт","e");break}if(!/^[a-z0-9_\-]+$/i.test(n)){out("Назва гілки — латиницею без пробілів","e");break}if(R.br[n]){out(`fatal: гілка '${n}' вже існує`,"e");break}R.br[n]=headC().id}
     else if(!R.br[n]){out(`error: гілки '${n}' немає. Створи її: git switch -c ${n}`,"e");break}
     const s=status();if(s.unst.length||s.staged.length){out("error: є незбережені зміни — закоміть їх перед переходом","e");break}
     R.head=n;R.work={...snap()};R.index={...snap()};out(`Switched to ${create?"a new ":""}branch '${n}'`,"g");break}
   case"merge":{const n=args[2];if(!n||!R.br[n]){out("Вкажи гілку, яку зливаємо: git merge dizain","e");break}if(n===R.head){out("Не можна злити гілку саму в себе","e");break}
     const a=headC().id,b=R.br[n];const A=ancestors(a);if(A.has(b)){out("Already up to date — усе вже злито","d");break}
     if(ancestors(b).has(a)){R.br[R.head]=b;R.work={...C(b).snap};R.index={...C(b).snap};out(`Fast-forward: ${R.head} тепер на ${b}`,"g");break}
     const base=C(mergeBase(a,b)).snap,ours=C(a).snap,theirs=C(b).snap,res={};let conf=[];
     new Set([...Object.keys(ours),...Object.keys(theirs)]).forEach(f=>{const o=ours[f],t=theirs[f],bs=base[f];
       if(o===t)res[f]=o;else if(o===bs)res[f]=t;else if(t===bs)res[f]=o;else{conf.push(f);res[f]=`<<<<<<< ${R.head}\n${o}=======\n${t}>>>>>>> ${n}\n`}});
     R.work={...res};
     if(conf.length){R.index={...res};R.merging=b;out(`CONFLICT у файлі ${conf.join(", ")}. Відкрий файл, залиш потрібне, прибери позначки, потім git add і git commit`,"e")}
     else{R.index={...res};const cm=mk(R,`Merge branch '${n}'`,[a,b],res,R.head);R.br[R.head]=cm.id;out(`Merge made — створено коміт злиття ${cm.id}`,"g")}break}
   case"diff":{const s=snap();let any=false;Object.keys(R.work).forEach(f=>{const base=R.index[f]??s[f]??"";if(base!==R.work[f]){any=true;outH(`<span class="m">--- ${f}</span>`);
       const a=base.split("\n"),b=R.work[f].split("\n");a.filter(x=>!b.includes(x)&&x).forEach(x=>outH(`<span class="e">- ${KIT.esc(x)}</span>`));b.filter(x=>!a.includes(x)&&x).forEach(x=>outH(`<span class="g">+ ${KIT.esc(x)}</span>`))}});if(!any)out("Змін немає","d");break}
   default:out(`git: '${c}' — невідома команда. Введи help`,"e")}
  draw();save()}
/* ---------- малювання ---------- */
function tabs(){const s=R.init?status():{unst:[],untr:[]};$("#tabs").innerHTML=Object.keys(R.work).map(f=>`<button data-f="${f}" class="${f===file?"cur":""}">${f}${R.init&&(s.unst.some(x=>x.endsWith(f))||s.untr.includes(f))?'<span class="st">●</span>':""}</button>`).join("");$("#ed").value=R.work[file]??""}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){file=b.dataset.f;tabs()}};
$("#ed").addEventListener("input",()=>{R.work[file]=$("#ed").value;KIT.touch();clearTimeout(window._t);window._t=setTimeout(()=>{tabs();save()},300)});
function graph(){const g=$("#graph");if(!R.init){g.innerHTML='<p style="color:var(--muted);padding:8px">Репозиторію ще немає. Виконай <b>git init</b>.</p>';return}
  if(!R.commits.length){g.innerHTML='<p style="color:var(--muted);padding:8px">Комітів ще немає.</p>';return}
  const lanes={};let ln=0;const order=[...R.commits].sort((a,b)=>a.t-b.t);order.forEach(c=>{if(!(c.branch in lanes))lanes[c.branch]=ln++});
  const X=c=>30+order.indexOf(c)*70,Y=c=>28+lanes[c.branch]*56,W=60+order.length*70,H=50+ln*56;
  let s=`<svg width="${W}" height="${H}" font-family="JetBrains Mono,monospace" font-size="11">`;
  order.forEach(c=>c.parents.forEach(p=>{const P=C(p);s+=`<path d="M${X(P)} ${Y(P)} C${X(P)+35} ${Y(P)},${X(c)-35} ${Y(c)},${X(c)} ${Y(c)}" stroke="#adb5bd" stroke-width="3" fill="none"/>`}));
  const col=b=>["#e8590c","#1c7ed6","#2b8a3e","#c2255c","#7048e8"][lanes[b]%5];
  order.forEach(c=>{s+=`<circle cx="${X(c)}" cy="${Y(c)}" r="11" fill="${col(c.branch)}"><title>${KIT.esc(c.id+" "+c.msg)}</title></circle><text x="${X(c)}" y="${Y(c)+26}" text-anchor="middle" fill="currentColor">${c.id.slice(0,5)}</text>`});
  Object.entries(R.br).forEach(([b,id])=>{const c=C(id);if(!c)return;const off=Object.entries(R.br).filter(([bb,ii])=>ii===id).findIndex(([bb])=>bb===b);s+=`<text x="${X(c)}" y="${Y(c)-16-off*13}" text-anchor="middle" font-weight="700" fill="${b===R.head?"#e8590c":"currentColor"}">${b===R.head?"HEAD→":""}${b}</text>`});
  g.innerHTML=s+"</svg>"}
function draw(){tabs();graph();$("#ps").textContent="site-ligy"+(R.init?" ("+R.head+(R.merging?"|MERGING":"")+")":"")+" $";$("#head").textContent=R.init?"HEAD → "+R.head:"";
  const s=R.init?status():null;$("#wst").textContent=!R.init?"не під контролем Git":(s.unst.length+s.untr.length?"є незбережені зміни":(s.staged.length?"зміни підготовлено":"чисто ✓"))}
function save(){KIT.store(R);KIT.refresh()}
$("#cmd").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value;e.target.value="";if(v.trim()){hist.push(v);hi=hist.length}run(v)}else if(e.key==="ArrowUp"){if(hi>0){hi--;e.target.value=hist[hi]}e.preventDefault()}else if(e.key==="ArrowDown"){if(hi<hist.length-1){hi++;e.target.value=hist[hi]}else{hi=hist.length;e.target.value=""}e.preventDefault()}});
$("#chips").innerHTML=["git status","git add .","git log --oneline","git branch","help"].map(c=>`<button data-c="${c}">${c}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("button");if(b)run(b.dataset.c)};
/* ---------- завдання ---------- */
const commitsOn=b=>R.br[b]?[...ancestors(R.br[b])].map(C):[];
const SETS={
 basics:{name:"Коміти й гілки (8 клас)",cls:8,norm:15,story:"Команда розробляє сайт ліги. Постав проєкт під контроль Git, збережи версії, зроби окрему гілку для дизайну й об'єднай її з основною.",tasks:[
  {t:"Створи репозиторій.",hint:"<b>git init</b>",ok:()=>R.init},
  {t:"Додай усі файли й зроби перший коміт з описом.",hint:'<b>git add .</b> → <b>git commit -m "Перша версія"</b>',ok:()=>R.commits.length>=1&&Object.keys(R.commits[0].snap).length===3},
  {t:"Зміни README.md (допиши опис сайту) і зроби другий коміт.",ok:()=>commitsOn("main").some(c=>c.parents.length&&c.snap["README.md"]!==FILES0["README.md"])},
  {t:"Створи гілку <b>dizain</b> і перейди на неї.",hint:"<b>git switch -c dizain</b>",ok:()=>!!R.br.dizain&&(R.head==="dizain"||R.log.some(l=>/(switch|checkout)\s+(-c\s+|-b\s+)?dizain/.test(l)))},
  {t:"На гілці dizain зміни колір заголовка в style.css і закоміть.",ok:()=>commitsOn("dizain").some(c=>c.branch==="dizain"&&c.snap["style.css"]!==FILES0["style.css"])},
  {t:"Повернись на <b>main</b> і злий у неї гілку dizain.",hint:"<b>git switch main</b> → <b>git merge dizain</b>",ok:()=>R.br.dizain&&ancestors(R.br.main||"").has(R.br.dizain)&&snapOf("main")["style.css"]!==FILES0["style.css"]},
  {t:"Переглянь історію комітів однією командою.",ok:()=>R.log.some(l=>/^git log/.test(l))&&R.commits.length>=3}]},
 conflict:{name:"Конфлікт злиття (8 клас)",cls:8,norm:12,story:"Двоє учнів одночасно змінили index.html: один у гілці tablo додав бомбардира, інший у main — дату матчу. Злий гілки й розв'яжи конфлікт, залишивши ОБИДВА рядки.",tasks:[
  {t:"Переглянь стан репозиторію й список гілок.",ok:()=>R.log.some(l=>l==="git status")&&R.log.some(l=>/^git branch$/.test(l))},
  {t:"Злий гілку <b>tablo</b> у main.",hint:"<b>git merge tablo</b> — з'явиться конфлікт",ok:()=>R.log.some(l=>/^git merge tablo/.test(l))},
  {t:"Відкрий index.html, залиш і бомбардира, і дату матчу, прибери позначки <b>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</b>, <b>=======</b>, <b>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</b>.",ok:()=>{const t=R.work["index.html"]||"";return /бомбардир/i.test(t)&&/матч/i.test(t)&&!/<<<<<<<|=======|>>>>>>>/.test(t)}},
  {t:"Додай виправлений файл і зроби <b>коміт злиття</b>.",ok:()=>R.commits.some(c=>c.parents.length===2&&/бомбардир/i.test(c.snap["index.html"])&&/матч/i.test(c.snap["index.html"]))},
  {t:"Переконайся командою, що робоча папка чиста.",ok:()=>R.commits.some(c=>c.parents.length===2)&&R.log.slice(R.log.findIndex(l=>/^git commit/.test(l))+1).some(l=>l==="git status")&&!R.merging}]}
};
const snapOf=b=>C(R.br[b])?.snap||{};
KIT.start({id:"git",title:"Git-тренажер",sub:"система контролю версій",cls:8,sets:SETS,onSet(k,fresh){const d=!fresh&&KIT.load(null);R=d||fresh_(k);file="index.html";$("#out").innerHTML="";
  out(k==="conflict"?"Репозиторій уже створено: гілки main і tablo. Почни з git status.":"Ласкаво просимо! Папка site-ligy ще не під контролем Git. Почни з git init. Список команд — help.","d");draw();if(!d)save();setTimeout(()=>$("#cmd").focus(),50)}});
function fresh_(k){return fresh(k)}
</script>
