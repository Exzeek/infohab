<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Безпечний віртуальний комп'ютер у браузері: робочий стіл, вікна (згорнути, розгорнути, закрити), меню Пуск, налаштування, Блокнот і браузер з вкладками…">

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{--acc:#1c7ed6}@media (prefers-color-scheme:dark){:root{--acc:#74c0fc}}
.pc{position:relative;height:min(78vh,720px);min-height:520px;margin:10px;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #0003;font-family:Nunito,system-ui,sans-serif;--fs:1}
.pc.dark{--w:#1f232b;--wi:#eef0f5;--wl:#343a46}.pc{--w:#ffffff;--wi:#1b1e28;--wl:#dee2e6}
.desk{position:absolute;inset:0 0 48px 0;padding:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:92px;gap:6px;align-content:start}
.ic{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:2px solid transparent;color:#fff;text-shadow:0 1px 3px #000a;font-weight:800;font-size:calc(13px*var(--fs));cursor:pointer;background:none;text-align:center}
.ic span{font-size:38px;line-height:1}.ic.sel{background:#ffffff40;border-color:#ffffff90}
.tbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#1b1e28e6;color:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;backdrop-filter:blur(6px);z-index:900}
.tbar button{background:none;border:0;color:#fff;font:800 14px Nunito,sans-serif;border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tbar button:hover,.tbar button.on{background:#ffffff26}.tbar .start{font-size:22px}.tbar .sp{flex:1}.tbar .clk{font:700 13px "JetBrains Mono",monospace;text-align:right;line-height:1.1}
.tbar .tw{max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-bottom:3px solid transparent}.tbar .tw.act{border-bottom-color:#74c0fc}
.menu{position:absolute;left:8px;bottom:54px;width:270px;background:var(--w);color:var(--wi);border-radius:14px;box-shadow:0 10px 30px #0006;padding:10px;z-index:950;display:none}.menu.on{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:inherit;font:700 calc(15px*var(--fs)) Nunito,sans-serif;padding:8px;border-radius:8px;cursor:pointer;text-align:left}.menu button:hover{background:#1c7ed622}
.menu hr{border:0;border-top:1px solid var(--wl);margin:6px 0}
.win{position:absolute;background:var(--w);color:var(--wi);border-radius:10px;box-shadow:0 10px 30px #0005;display:flex;flex-direction:column;overflow:hidden;min-width:260px;font-size:calc(15px*var(--fs))}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}
.win.min{display:none}
.wt{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:var(--wl);cursor:move;user-select:none;font-weight:800;touch-action:none}
.wt span{flex:1}.wt button{width:34px;height:28px;border:0;border-radius:6px;background:transparent;color:inherit;font:800 15px Nunito,sans-serif;cursor:pointer}.wt button:hover{background:#0002}.wt .x:hover{background:#e03131;color:#fff}
.wb{flex:1;overflow:auto;padding:10px;min-height:0}
.set{display:grid;gap:12px}.set h4{margin:0}.set .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set button.wp{width:70px;height:46px;border-radius:8px;border:3px solid transparent;cursor:pointer}.set button.wp.on{border-color:var(--acc)}
.set .opt button{border:1px solid var(--wl);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font:700 14px Nunito,sans-serif;cursor:pointer}.set .opt button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.np{display:flex;flex-direction:column;height:100%;gap:6px}.np textarea{flex:1;font:calc(16px*var(--fs)) "JetBrains Mono",monospace;border:1px solid var(--wl);border-radius:6px;padding:8px;background:transparent;color:inherit;resize:none}
.np .bar{display:flex;gap:6px}.np button,.br button{border:1px solid var(--wl);background:transparent;color:inherit;border-radius:7px;padding:5px 9px;font:700 13px Nunito,sans-serif;cursor:pointer}
/* браузер */
.br{display:flex;flex-direction:column;height:100%;margin:-10px}
.tabs{display:flex;gap:2px;background:var(--wl);padding:4px 4px 0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;max-width:170px;padding:6px 8px;border-radius:8px 8px 0 0;background:#0001;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--w)}.tab span{overflow:hidden;text-overflow:ellipsis}.tab b{font-weight:800;padding:0 3px;border-radius:4px}.tab b:hover{background:#0002}
.tabs .nt{border:0;background:none;color:inherit;font:800 18px Nunito;cursor:pointer;padding:0 8px}
.nav{display:flex;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--wl)}
.nav input{flex:1;font:14px Nunito,sans-serif;padding:6px 10px;border-radius:18px;border:1px solid var(--wl);background:transparent;color:inherit;min-width:60px}
.nav .lock{border:0;background:none;font-size:16px;cursor:pointer;padding:2px 4px}
.bmk{display:flex;gap:6px;padding:4px 8px;border-bottom:1px solid var(--wl);font-size:12.5px;min-height:26px;flex-wrap:wrap}.bmk a{cursor:pointer;color:inherit;text-decoration:none;background:#0001;border-radius:6px;padding:2px 8px}
.pg{flex:1;overflow:auto;padding:14px 18px;background:#fff;color:#1b1e28}
.pg h1{font:800 24px Unbounded,Nunito,sans-serif;margin:0 0 8px}.pg a.l{color:#1c64d6;text-decoration:underline;cursor:pointer}
.pg .res{margin:10px 0}.pg .res small{color:#2b8a3e;display:block}.pg .warn{background:#fff5f5;border:2px solid #e03131;border-radius:12px;padding:12px;margin:10px 0}
.pg .big{font-size:64px;text-align:center}.pg .srch{display:flex;gap:6px;margin:14px 0}.pg .srch input{flex:1;font:16px Nunito;padding:10px 14px;border-radius:24px;border:2px solid #74c0fc}
.pg .srch button{border:0;background:#1c7ed6;color:#fff;border-radius:24px;padding:10px 18px;font:800 15px Nunito;cursor:pointer}
.pg .btnr{border:0;border-radius:10px;padding:10px 16px;font:800 15px Nunito;cursor:pointer;color:#fff;background:#e03131}.pg .btng{background:#2f9e44}
.pop{position:absolute;z-index:2000;background:var(--w);color:var(--wi);border:1px solid var(--wl);border-radius:12px;box-shadow:0 10px 30px #0005;padding:12px;max-width:300px;font-size:14px}
.off{position:absolute;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:3000;text-align:center;font:800 20px Nunito}
.off button{margin-top:14px;border:0;border-radius:12px;padding:10px 16px;font:800 16px Nunito;cursor:pointer}
.hist{font-size:14px}.hist div{padding:4px 0;border-bottom:1px solid #eee;cursor:pointer}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#5b3cc4"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png"><script src="/site/app.js" defer></script><!--og--><meta property="og:image" content="https://urokinfo.com.ua/site/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><!--/og--></head><body>
<main id="app"><div class="pc" id="pc"><div class="desk" id="desk"></div><div id="wins"></div><div class="menu" id="menu"></div><div class="tbar" id="tbar"></div></div></main>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const WPS={sky:"linear-gradient(160deg,#4dabf7,#1864ab)",meadow:"linear-gradient(160deg,#8ce99a,#2b8a3e)",sunset:"linear-gradient(160deg,#ffa94d,#c2255c)",space:"radial-gradient(circle at 30% 30%,#5f3dc4,#100b2e)"};
const APPS={notepad:["📝","Блокнот"],browser:["🌐","Браузер"],settings:["⚙️","Налаштування"],docs:["📁","Документи"],trash:["🗑️","Кошик"]};
/* ---------- сайти «інтернету» ---------- */
const SITES={
 "shukaiko.ua":{t:"Шукайко",lock:1,page:()=>`<h1>🔎 Шукайко</h1><p>Дитячий пошуковик. Введіть, що шукаєте:</p><div class="srch"><input id="q" placeholder="Наприклад: дельфін"><button data-search>Знайти</button></div>`},
 "shkola.ua":{t:"Школа №1",lock:1,page:()=>`<h1>🏫 Школа №1</h1><p>Розклад, новини, гуртки.</p><p>📢 У п'ятницю — ярмарок! Гурток робототехніки — щосереди.</p><p><a class="l" data-go="shkola.ua/gurtky">Гуртки школи →</a></p>`},
 "shkola.ua/gurtky":{t:"Гуртки",lock:1,page:()=>`<h1>🤖 Гуртки</h1><p>Робототехніка (ср), Шахи (пн), Scratch (пт).</p>`},
 "dytiacha-wiki.ua/delfin":{t:"Дельфін — Дитяча вікі",lock:1,page:()=>`<div class="big">🐬</div><h1>Дельфін</h1><p>Дельфіни — розумні морські ссавці. Вони дихають повітрям і спілкуються свистом.</p>`},
 "dytiacha-wiki.ua/akula":{t:"Акула — Дитяча вікі",lock:1,page:()=>`<div class="big">🦈</div><h1>Акула</h1><p>Акули — риби. Вони живуть у морях понад 400 мільйонів років.</p>`},
 "dytiacha-wiki.ua/kosmos":{t:"Планети — Дитяча вікі",lock:1,page:()=>`<div class="big">🪐</div><h1>Планети Сонячної системи</h1><p>Навколо Сонця обертаються 8 планет: Меркурій, Венера, Земля, Марс, Юпітер, Сатурн, Уран, Нептун.</p>`},
 "kosmos-dlia-ditei.ua":{t:"Космос для дітей",lock:1,page:()=>`<div class="big">🚀</div><h1>Космос для дітей</h1><p>Відео й ігри про космос і космонавтів.</p>`},
 "pohoda.ua":{t:"Погода",lock:1,page:()=>`<div class="big">⛅</div><h1>Погода у Львові</h1><p>Завтра +7°, хмарно з проясненнями.</p>`},
 "vygrash-iphone.xyz":{t:"ВИ ВИГРАЛИ!!!",lock:0,bad:1,page:()=>`<h1 style="color:#e03131">🎁 ВІТАЄМО! ВИ ВИГРАЛИ ТЕЛЕФОН!!!</h1><p>Щоб забрати приз, введіть пароль від пошти й номер картки батьків!</p><p><input placeholder="пароль" style="font:16px Nunito;padding:8px"> <button class="btnr" data-trap>Забрати приз</button></p>
  <div class="warn"><b>🛡 Підказка Дослідника:</b> тут немає замочка, дивна адреса й поспіх. Це шахраї! <br><br><button class="btnr btng" data-leave>Покинути сайт</button> <button class="btnr" data-report>⚠ Повідомити про небезпечний сайт</button></div>`},
 "free-games-download.club":{t:"Безкоштовні ігри",lock:0,bad:1,page:()=>`<h1>🎮 СКАЧАЙ УСІ ІГРИ БЕЗКОШТОВНО</h1><p>Натисни «Скачати» — і отримай 1000 ігор!</p><button class="btnr" data-trap>⬇ Скачати</button><div class="warn"><b>🛡</b> Невідомий сайт без замочка просить щось завантажити. Так поширюються віруси.<br><br><button class="btnr btng" data-leave>Покинути сайт</button> <button class="btnr" data-report>⚠ Повідомити про небезпечний сайт</button></div>`}
};
const IDX=[["дельфін дельфіни море ссавці","dytiacha-wiki.ua/delfin","Дельфін — Дитяча вікі","Дельфіни — розумні морські ссавці…"],["акула море риба","dytiacha-wiki.ua/akula","Акула — Дитяча вікі","Акули — риби, що живуть у морях…"],
 ["космос планети сонце","dytiacha-wiki.ua/kosmos","Планети Сонячної системи — Дитяча вікі","8 планет обертаються навколо Сонця…"],["космос ракета космонавти","kosmos-dlia-ditei.ua","Космос для дітей","Відео й ігри про космос…"],
 ["телефон ігри приз виграш планети космос","vygrash-iphone.xyz","🎁 Ви виграли телефон! Терміново!","Тільки сьогодні! Заберіть приз…"],["ігри скачати безкоштовно дельфін","free-games-download.club","Скачати всі ігри безкоштовно","1000 ігор без реєстрації…"],
 ["школа гуртки розклад","shkola.ua","Школа №1 — офіційний сайт","Розклад, новини, гуртки"],["погода львів","pohoda.ua","Погода у Львові","Завтра +7°…"]];
let S,Z=10,dragW=null;
function freshS(){return{wp:"sky",vol:70,lang:"УКР",fs:1,dark:false,wins:[],files:[],log:{},tabs:[],ctab:0,bm:[],hist:[],off:false}}
const L=(k,v)=>{S.log[k]=v===undefined?(S.log[k]||0)+1:v;save()};
function save(){KIT.store(S);KIT.refresh()}
/* ---------- малювання ---------- */
function draw(){const pc=$("#pc");pc.style.background=WPS[S.wp];pc.style.setProperty("--fs",S.fs);pc.classList.toggle("dark",S.dark);
 $("#desk").innerHTML=Object.entries(APPS).map(([k,a])=>`<button class="ic" data-app="${k}"><span>${a[0]}</span>${a[1]}</button>`).join("");
 $("#wins").innerHTML=S.wins.map(w=>`<div class="win${w.max?" max":""}${w.min?" min":""}" data-w="${w.id}" style="left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.z}"><div class="wt" data-drag="${w.id}"><span>${APPS[w.app][0]} ${APPS[w.app][1]}</span><button data-wmin="${w.id}" title="Згорнути">—</button><button data-wmax="${w.id}" title="${w.max?"Відновити":"Розгорнути"}">${w.max?"❐":"☐"}</button><button class="x" data-wx="${w.id}" title="Закрити">✕</button></div><div class="wb">${body(w)}</div></div>`).join("");
 const top=Math.max(0,...S.wins.filter(w=>!w.min).map(w=>w.z));
 const t=new Date(),cl=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
 $("#tbar").innerHTML=`<button class="start" data-start title="Пуск">🪟</button>${S.wins.map(w=>`<button class="tw${w.z===top&&!w.min?" act":""}" data-tw="${w.id}">${APPS[w.app][0]} ${APPS[w.app][1]}</button>`).join("")}<span class="sp"></span><button data-vol title="Гучність">${S.vol?S.vol<40?"🔉":"🔊":"🔇"} ${S.vol}%</button><button data-lang title="Мова клавіатури">${S.lang}</button><span class="clk">${cl}<br>${t.toLocaleDateString("uk-UA")}</span>`;
 if(S.off){$("#wins").insertAdjacentHTML("beforeend",`<div class="off"><div>💤 Комп'ютер вимкнено<br><button data-on>🔘 Увімкнути</button></div></div>`)}
 const br=$("#wins .br input.addr");if(br&&document.activeElement!==br){}}
function body(w){if(w.app==="notepad")return`<div class="np"><div class="bar"><button data-npsave="${w.id}">💾 Зберегти як…</button><button data-npnew="${w.id}">📄 Новий</button></div><textarea data-np="${w.id}" placeholder="Пишіть тут…">${esc(w.text||"")}</textarea></div>`;
 if(w.app==="settings")return`<div class="set"><div><h4>🖼️ Фон робочого столу</h4><div class="row">${Object.keys(WPS).map(k=>`<button class="wp${S.wp===k?" on":""}" data-wp="${k}" style="background:${WPS[k]}" aria-label="${k}"></button>`).join("")}</div></div>
  <div><h4>🔊 Гучність: <span id="vv">${S.vol}</span>%</h4><input type="range" min="0" max="100" step="5" value="${S.vol}" data-volr style="width:100%"></div>
  <div class="opt"><h4>🔠 Розмір тексту</h4><div class="row">${[[1,"100%"],[1.25,"125%"],[1.5,"150%"]].map(f=>`<button class="${S.fs===f[0]?"on":""}" data-fs="${f[0]}">${f[1]}</button>`).join("")}</div></div>
  <div class="opt"><h4>🌗 Тема</h4><div class="row"><button class="${!S.dark?"on":""}" data-dark="0">☀️ Світла</button><button class="${S.dark?"on":""}" data-dark="1">🌙 Темна</button></div></div>
  <div class="opt"><h4>⌨️ Мова клавіатури</h4><div class="row">${["УКР","ENG"].map(l=>`<button class="${S.lang===l?"on":""}" data-langs="${l}">${l}</button>`).join("")}</div></div></div>`;
 if(w.app==="docs")return S.files.length?`<div>${S.files.map(f=>`<div style="padding:6px 0">📄 <b>${esc(f.n)}.txt</b> <small style="opacity:.7">${f.text.length} символів</small></div>`).join("")}</div>`:"<p>Тут з'являться збережені файли.</p>";
 if(w.app==="trash")return"<p>Кошик порожній.</p>";
 if(w.app==="browser")return browser(w);return""}
/* ---------- браузер ---------- */
function curTab(){return S.tabs[S.ctab]}
function browser(w){if(!S.tabs.length){S.tabs=[{h:["shukaiko.ua"],i:0}];S.ctab=0}const t=curTab(),u=t.h[t.i],site=SITES[u.split("?")[0]];
 const prot=site&&site.lock?"https://":"http://";const isBm=S.bm.includes(u);
 let pg="";if(u==="history")pg=`<h1>🕘 Історія</h1><div class="hist">${S.hist.slice().reverse().map(h=>`<div data-go="${esc(h)}">${esc((SITES[h.split("?")[0]]||{t:h}).t)} <small style="color:#868e96">${esc(h.startsWith("shukaiko.ua?q=")?"пошук: "+decodeURIComponent(h.split("q=")[1]):h)}</small></div>`).join("")||"Порожньо"}</div>`;
 else if(u.startsWith("shukaiko.ua?q=")){const q=decodeURIComponent(u.split("q=")[1]).toLowerCase().trim(),W=q.split(/\s+/);const R=IDX.filter(r=>W.every(x=>r[0].includes(x)||r[2].toLowerCase().includes(x)));
   pg=`<h1>🔎 Шукайко</h1><div class="srch"><input id="q" value="${esc(q)}"><button data-search>Знайти</button></div><p>Знайдено: ${R.length}</p>${R.map(r=>`<div class="res"><a class="l" data-go="${r[1]}">${esc(r[2])}</a><small>${SITES[r[1]].lock?"🔒 https://":"⚠ http://"}${r[1]}</small>${esc(r[3])}</div>`).join("")||"<p>Нічого не знайдено. Спробуйте інше слово.</p>"}`}
 else if(site)pg=site.page();else pg=`<h1>😕 Сайт не знайдено</h1><p>Перевірте адресу «${esc(u)}». Можливо, у ній помилка.</p>`;
 return`<div class="br"><div class="tabs">${S.tabs.map((x,i)=>{const uu=x.h[x.i],s=SITES[uu.split("?")[0]];return`<div class="tab${i===S.ctab?" on":""}" data-tab="${i}"><span>${esc(uu==="history"?"Історія":uu.startsWith("shukaiko.ua?q")?"Пошук":s?s.t:uu)}</span><b data-tclose="${i}" title="Закрити вкладку">✕</b></div>`}).join("")}<button class="nt" data-tnew title="Нова вкладка">＋</button></div>
